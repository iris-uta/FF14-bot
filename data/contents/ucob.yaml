# ────────────────────────────────────────────────────────
# 募集テンプレ
# ────────────────────────────────────────────────────────
recruitmentTemplates:
  - source: Rage Avel - Lodestone「固定募集記事テンプレート（コピペ用）」(fru.yaml/top.yaml と共通)
    # Source: https://na.finalfantasyxiv.com/lodestone/character/36087283/blog/5297756/
    # 注: Lodestone 用 BBCode フォーマット。Discord 用には別途整形が必要。
    template: |
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}    # 注: 絶バハは H3構成 (ヒラ 3) が野良主流

      ▼固定の目標
      ● {{goal}}
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}    # 例: 新みんとっと/H3/拘束具逆▽/カータTLB/進軍十字/連撃V字/群竜TLB

      ▼必須事項
      {{requirements}}

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle

