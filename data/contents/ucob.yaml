# 絶バハムート討滅戦 (The Unending Coil of Bahamut Ultimate / UCoB)
# データ収集日: 2026-05-25
# 第一参照: りりーどーる (Lily Doll) - Lodestone 日記、新みんとっと (YouTube)、あせろぐ
#
# 注意:
# - 本ファイルの情報源は実装 (2017-10-31 / patch 4.11) から 7.x 時点で確認できた
#   野良主流の処理法・マクロです。流派名は時期によって大きく変化しています。
# - 2024-09 に「みんとっと → 新みんとっと」へ野良主流が刷新されており、
#   本ファイルは新みんとっと/H3構成を基準として記載しています。
# - りりーどーる Lodestone 原文 (blog/5248067) は WebFetch では著作権上の理由で
#   マクロ全文を自動抽出できなかったため、dsr.yaml と同じ「冒頭/構成抜粋 + URL」
#   パターンで記載しています。完全版は Lodestone を直接参照のこと。
# - フェーズ番号は野良/解説サイト (あせろぐ、ふうcだよ、Lily Doll、Console Games Wiki)
#   いずれも P1〜P5 の 5 構成が標準のため、本ファイルも P1〜P5 構成を採用。
#   ユーザ要件「7 phase」については、P3 プライム内のトリオ (進軍/黒炎/災厄/天地/連撃/八重奏)
#   を P3 phase 内の tips/strategies で展開する形で表現する。

id: ucob
displayName: 絶バハムート討滅戦
shortName: UCoB
type: ultimate
patch: "4.11"                # 実装パッチ
# 実装日 2017-10-31 (US/EU は 11-01)
# 世界最速踏破: Dysnomia (JP/Alexander) 2017-11-04 (実装より 11 日)
# Dysnomia は旧 Lucrezia 系メンバー (前作「真成編 World 1st」と同系統) を含む構成
# Source: https://ffxiv.consolegameswiki.com/wiki/The_Unending_Coil_of_Bahamut_(Ultimate)
# Source: https://novacrystallis.com/2017/11/group-including-ex-lucrezia-players-claims-world-first-clear-unending-coil-bahamut-raid/

phases:
  - id: p1
    name: P1 ツインタニア (Twintania)
    order: 1
    description: |
      開幕フェーズ。
      主要ギミック: 拘束具 (Liquid Hell)、神鳥の魔印 (Magnetism)、Plummet、
      Conflag Strike、Twister (DPSチェック前の即死誘発)、Death Sentence (TB)、
      磁力 (引き寄せ/反発の◯×振り分け)、第7霊災 (Hatch + Liquid Hell)。
      野良主流は「新みんとっと / H3構成 / 拘束具逆▽ (3 つの拘束具を逆三角形配置)」。
    # Source: https://asellog.com/bahamut-p1/
    # Source: https://ffxiv.consolegameswiki.com/wiki/The_Unending_Coil_of_Bahamut_(Ultimate)
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5248067/
    # 軽減表は P1-P5 全Phase を 1 シートで扱うため、便宜上 P1 にぶら下げる。
    # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5186770/
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (絶バハ Patch 7.1 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
    videos:
      - title: FF14 みんとのギミック解説 絶バハムート討滅戦 ツインタニア編
        url: https://www.youtube.com/watch?v=R916Q2iqxew
        author: みんとっと
        phase: p1
      - title: 絶バハムート討滅戦【ツインタニア編】ギミック解説動画
        url: https://www.youtube.com/watch?v=NdZKovigmyA
        # Source: 検索結果より (実装直後 2017-11-02 公開、投稿者非確定)
        phase: p1
      - title: 【FF14/FFXIV】4.xから始める絶バハムート-ツインタニア編-【解説/攻略】
        url: https://www.youtube.com/watch?v=f6VWJGX9nX4
        phase: p1
      - title: FF14 ①絶バハムート ずんだもんと学ぶ ツインタニアフェーズ
        url: https://www.youtube.com/watch?v=daHMd0LEXjM
        phase: p1
    strategies:
      - id: shin-mintotto-h3
        name: 新みんとっと / H3構成 / 拘束具逆▽ (野良主流)
        description: |
          2024-09 にりりーどーる Lodestone マクロが「みんとっと → 新みんとっと」へ
          切替わったタイミングで野良主流が刷新された。
          H3 構成 (ヒーラー 3) + 拘束具を逆三角形 (▽) 配置で災厄ギミックの視認性を上げる流派。
      - id: t3-mintotto
        name: T3構成 みんとっと (代替・旧主流)
        description: |
          実装初期からの「みんとっと」(タンク 3) 構成。
          現在も一部固定で採用される代替流派。
          # 出典: https://na.finalfantasyxiv.com/lodestone/character/18500174/blog/4804267/
    tips:
      - "Twister の捨て位置は近接組がボスクリーブ内に置くと安定する。"
      - "拘束具 (Liquid Hell) は▽逆三角に置いて第7霊災のハッチ位置を見やすくする。"
      - "Death Sentence (タンクバスター) は MT 側 CD or ST スイッチで受ける。"

  - id: p2
    name: P2 ネール・デウス・ダーナス (Nael Deus Darnus)
    order: 2
    description: |
      引用詠唱 (Quote) に応じて配置を変える「コール戦」フェーズ。
      主要ギミック: サンダーストラック (青雷)、レイヴンダイブ (TB)、
      バハムートクロウ、ラヴァディープ (赤デバフ)、ハイパーノヴァ (氷)、
      カータライズ (Cauterize / 直線ダイブ)、ヘヴンスフォール、
      メテオストリーム、メテオ (ドラゴン add)、フィエリディスパッチ (頭割り)、
      ダブルアスペクト (二重デバフ詠唱)。
      野良主流は「新みんとっと / カータTLB (カータライズで タンクLB3 を発動)」。
    # Source: https://asellog.com/bahamut-p2/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5248067/
    videos:
      - title: 【FF14/FFXIV】4.xから始める絶バハムート-ネール編-【解説/攻略】
        url: https://www.youtube.com/watch?v=qeHvnLCmIn0
        phase: p2
      - title: 【FF14】絶バハ ネール 簡易解説【漆黒のヴィランズ】
        url: https://www.youtube.com/watch?v=Ib3go8TsXjY
        phase: p2
    strategies:
      - id: kata-tlb
        name: カータTLB (新みんとっと)
        description: |
          カータライズ (Cauterize / 直線ダイブ) のタイミングで タンク LB3 を発動し
          パーティ全体のダメージを軽減する野良主流処理。
    tips:
      - "コール (引用詠唱) のパターンを覚えるのが攻略のメイン。"
      - "サンダーストラック (青雷) 付与者は声で大きくコールする慣習。"
      - "ダイブマーカーは雷ターゲットを参考に配置を判断する。"

  - id: p3
    name: P3 バハムート・プライム (Bahamut Prime)
    order: 3
    description: |
      最長フェーズ。プライム / ネール / ツインタニアの 3 体が「三重奏 (Trio)」として
      同時にギミックを行う。Trio 構成 (野良主流呼称):
        1. 進軍の三重奏 (Quickmarch Trio)   ← 進軍十字
        2. 黒炎の三重奏 (Blackfire Trio)
        3. 災厄の三重奏 (Fellruin Trio)
        4. 天地の三重奏 (Heavensfall Trio)
        5. 連撃の三重奏 (Tenstrike Trio)     ← 連撃V字
        6. 群竜の八重奏 (Grand Octet)        ← 群竜TLB
      主要ギミック: メガフレア、Twister、アースシェイカー、Liquid Hell、
      タワー処理、フレア (Flatten)、Hypernova、Dive、ドラゴン add 制御。
      野良主流は「新みんとっと / 進軍十字 / 連撃V字 / 群竜TLB」。
    # Source: https://asellog.com/bahamut-p3tl3/
    # Source: https://ffxiv.consolegameswiki.com/wiki/The_Unending_Coil_of_Bahamut_(Ultimate)
    # Source: http://laytina14.com/archives/13711663.html
    videos:
      - title: 【FF14/FFXIV】4.xから始める絶バハムート-プライム編-【解説/攻略】
        url: https://www.youtube.com/watch?v=9gPviBWwf2g
        phase: p3
      - title: FF14 みんとのギミック解説 絶バハムート討滅戦プライム編 連撃の三重奏
        url: https://www.youtube.com/watch?v=_iwh2HROeDo
        author: みんとっと
        phase: p3-tenstrike
    strategies:
      - id: shingun-juuji
        name: 進軍十字 (Quickmarch Trio)
        description: |
          進軍の三重奏 (Quickmarch Trio) の野良主流処理。
          十字状の配置でアースシェイカー / メテオストリーム / Dive を捌く。
      - id: rengeki-v
        name: 連撃V字 (Tenstrike Trio)
        description: |
          連撃の三重奏 (Tenstrike Trio) の野良主流処理。
          魔力錬成 (Generate) 対象 3 名を V 字に配置して拘束具誘導 + 散開を両立。
          # 出典: https://asellog.com/bahamut-p3tl3/
      - id: gunryu-tlb
        name: 群竜TLB (Grand Octet)
        description: |
          群竜の八重奏 (Grand Octet) の最終ギミック。
          メガフレアダイブのタイミングでタンク LB3 を発動し、頭割りマーカーを無視できる
          「マラソン処理」の野良主流。プライムの東西南北位置で時計/反時計回りを分岐。
          # 出典: https://asellog.com/bahamut-p3tl3/
    tips:
      - "三重奏は全て『プライム + ネール + ツインタニアの 3 体が同時にギミックを実行する』構造。"
      - "Trio 順: 進軍 → 黒炎 → 災厄 → 天地 → 連撃 → 八重奏 (Grand Octet) の 6 段階。"
      - "八重奏のマラソン方向はプライム/ネール出現位置で時計/反時計を判断する (要事前合意)。"
      - "群竜のメガフレアダイブで TLB3 を打つので、ST タンク無敵タイミングと衝突しないこと。"

  - id: p4
    name: P4 2体フェーズ (Adds Phase / Twintania & Nael)
    order: 4
    description: |
      ツインタニアとネールの 2 体フェーズ (Trinity)。
      P1 と P2 のギミックが同時進行する短いフェーズ。
      主要ギミック: 拘束具 (Liquid Hell)、Twister、Death Sentence、
      サンダーストラック (青雷)、レイヴンダイブ、ラヴァディープ、
      ハイパーノヴァ、Doom デバフ、Earthshaker。
      HP 同期処理 (2 体の HP を揃えて削る) が必須。
    # Source: https://ffxiv.consolegameswiki.com/wiki/The_Unending_Coil_of_Bahamut_(Ultimate)
    # Source: https://www.nonbiri.blog/ultimate-bahamut/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5248067/
    videos:
      # 注: P4 (2体フェーズ) 単独の解説動画は単体で出回っていない傾向。
      #     新みんとっと完結編 / プライム編後半に含まれる。
      - title: FF14 みんとのギミック解説 絶バハムート討滅戦 完結編
        url: https://www.youtube.com/watch?v=hDQ-5THCc3Y
        author: みんとっと
        phase: p4-p5
    strategies: []
    tips:
      - "2 体の HP は同期して削るのが鉄則 (片方を先に倒すと残った方が enrage)。"
      - "P1 / P2 のギミックを混合処理するため、配置・コールはパーティ事前合意必須。"
      - "常時移動が必要 (Twister 回避)。"

  - id: p5
    name: P5 金バハ / 終焉 (Golden Bahamut Prime / Akh Morn)
    order: 5
    description: |
      最終フェーズ。Golden Bahamut Prime (金色のバハムート) が登場する DPS チェック。
      主要ギミック: メガフレア (リミットカット連続)、
      ギガフレア (DPS チェック頭割り)、テラフレア (時間切れ)、
      エクサフレア (移動型 AoE、8 方向ランダム)、
      モーン・アファー (Morn Afar / 大ダメージ範囲、ボス足元集合)、
      アク・モーン (Akh Morn / 3〜6 連続範囲ダメージ、敵視 1 位)。
      野良主流は「ボス足元集合のスタック処理 + アク・モーン 無敵切替」。
    # Source: https://asellog.com/bahamut-p5/
    # Source: https://ffxiv.consolegameswiki.com/wiki/The_Unending_Coil_of_Bahamut_(Ultimate)
    # Source: https://www.nonbiri.blog/ultimate-bahamut/
    videos:
      - title: FF14 みんとのギミック解説 絶バハムート討滅戦 完結編
        url: https://www.youtube.com/watch?v=hDQ-5THCc3Y
        author: みんとっと
        phase: p5
    strategies:
      - id: gold-bahamut-final
        name: 金バハ最終処理 (新みんとっと / ボス足元集合)
        description: |
          モーン・アファーはボス足元集合で全員均等に受ける。
          アク・モーンは MT/ST 無敵切替で対応。
          エクサフレアの安置 (8 方向ランダム) は床マーカーをパーティで分担コールする。
    tips:
      - "エクサフレアの安置察知が最大の難所。フェニックスの加護 (リレイズ) を失わないよう優先処理。"
      - "モーン・アファーはボス足元スタック (8人分散)。"
      - "アク・モーン は連続 3〜6 回、MT/ST 無敵 (リビデ/インビン) を交互に使用。"
      - "ヒーラー軽減はパーティ全体攻撃に合わせて使用。"

