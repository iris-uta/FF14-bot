    text: |
      # マクロ全文は著作権上の理由で抜粋のみ。完全版は Lodestone 原文を参照。
      # 出典: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5248067/
      # 短縮URL: https://ffxiv.link/096666
      #
      # 構成 (見出しのみ):
      #  【P1 ツインタニア】拘束具逆▽ / 磁力○×振り分け / 第7霊災ハッチ
      #  【P2 ネール】コール戦 / カータTLB / サンダーストラック散開
      #  【P3 プライム】進軍十字 / 黒炎 / 災厄 / 天地 / 連撃V字 / 群竜TLB
      #  【P4 2体フェーズ】ツインタニア + ネール 同時処理 / HP同期
