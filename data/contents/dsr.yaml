# 募集テンプレ
# ────────────────────────────────────────────────────────
recruitmentTemplates:
  - source: Rage Avel - Lodestone「固定募集記事テンプレート（コピペ用）」
    # Source: https://na.finalfantasyxiv.com/lodestone/character/36087283/blog/5297756/
    # 注: Lodestone 用 BBCode フォーマット。Discord 用には別途整形が必要。
    template: |
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}

      ▼固定の目標
      ● {{goal}}
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}    # 例: リリド式（ゼ基ペア / 4塔近接 / こまぞう式改死刻 / アクモーン2TLB）

      ▼必須事項
      {{requirements}}

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle

  - source: 絶竜詩 固定募集 慣例パターン (Lodestone 各種募集記事より集約)
    # Source: https://jp.finalfantasyxiv.com/lodestone/character/26759521/blog/4853571/
    # Source: https://jp.finalfantasyxiv.com/lodestone/character/35728574/blog/5551486/
    # 注: 慣習的な絶竜詩攻略固定の募集テンプレ。攻略期間 1〜2 ヶ月が一般的。
    template: |
      【絶竜詩戦争 攻略固定募集】
      ● 活動DC: {{datacenter}}
      ● 募集ロール: {{recruitingRoles}}
      ● 進行度: {{progress}}    # 例: P1から / P5死刻練習中 / P7消化
      ● 攻略期間目標: {{goalPeriod}}    # 例: 1〜2ヶ月、3週間短期
      ● 活動時間: {{schedule}}    # 例: 平日21:30〜24:00 / 週4〜5日
      ● 攻略方針: {{strategy}}    # 例: リリド式 / こまぞう式改死刻
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})

      【必須事項】
      ● 前絶 or パンデモニウム零式辺獄編/煉獄編クリア経験
      ● 複数ジョブ操作可能（ロール内）
      {{requirements}}

      【コンタクト】
      Discord: {{discordHandle}}
    variables:
      - datacenter
      - recruitingRoles
      - progress
      - goalPeriod
      - schedule
      - strategy
      - listenOnlyPolicy
      - requirements
      - discordHandle

