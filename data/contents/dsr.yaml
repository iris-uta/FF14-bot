# ────────────────────────────────────────────────────────
# フェーズ番号付けに関する注意
# ────────────────────────────────────────────────────────
# 本ファイルは P1-P7 構成（P7 最終）を採用。
# 一部解説サイト（ARUTORA など）では P5「教皇庁②」を独立フェーズとして扱う
# 8 段階構成を採用しているが、本ファイルでは P4-2 として P4 の後半に統合している。
# マッピング表:
#   本ファイル          ARUTORA 8 段階構成
#   P1 教皇庁①    ←→  P1 教皇庁
#   P2 トールダン  ←→  P2 トールダン
#   P3 ニーズヘッグ ←→  P3 ニーズヘッグ
#   P4 邪眼 (+ P4-2 教皇庁②)  ←→  P4 邪眼 + P5 教皇庁②
#   P5 偽典トールダン  ←→  P6 偽典トールダン (風槍・死刻)
#   P6 二天竜      ←→  P7 二天竜
#   P7 騎竜神トールダン ←→  P8 最終フェーズ
