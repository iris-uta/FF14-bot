# 絶竜詩戦争 (Dragonsong's Reprise Ultimate / DSR)
# データ収集日: 2026-05-25
# 第一参照: りりーどーる (Lily Doll) - Lodestone 日記、ぬけまるG (YouTube)、ふうcだよ
#
# 注意:
# - 本ファイルの情報源は 2025〜2026 年時点で確認できた野良主流の処理法・マクロです。
# - 「処理方」「マクロ」は時期によって変化します。最新版はりりーどーる/ふうcだよの最新記事を参照。
# - りりーどーる Lodestone 原文 (blog/5178834) はマクロ全文の自動抽出を著作権上の理由で
#   拒否されたため、fru.yaml と同様「冒頭抜粋 + URL + コメント」パターンで掲載します。
# - フェーズ番号付けは ARUTORA など一部サイトでは P1〜P8（教皇庁2回目を独立 P5 として扱う）の
#   8段階構成ですが、ふうcだよ・ばる工房・ユーザ要件に従い P1〜P7 構成（P4-2 として P4 と統合、
#   P7 が最終）で記述します。
# - 「P5 死刻」「P6 二天竜」「P7 最終」が攻略の山場となるメカニクス。

id: dsr
displayName: 絶竜詩戦争
shortName: DSR
type: ultimate
patch: "6.11"                # 実装パッチ
# 実装日 2022-04-26 / 世界最速クリア Neverland (EU/NA mixed) 2022-05-02 (約124時間)
# Source: https://automaton-media.com/articles/newsjp/20220503-201287/
# Source: https://ffxiv.consolegameswiki.com/wiki/Dragonsong%27s_Reprise_(Ultimate)

phases:
  - id: p1
    name: P1 教皇庁フェーズ (Sers Adelphel, Grinnaux, and Charibert)
    order: 1
    description: |
      開幕フェーズ。蒼天騎士団3名（聖騎士アデルフェル / グリノー / シャリベル）と戦う。
      ハイパーディメンション、プレステ散開（◯×△□マーカー）、光翼閃、
      ホーリーブレードダンス（線処理）、ホリエストブレッシング（沈黙）など。
      野良主流は「MTアデル / STグリノー / 線ST無敵 / 沈黙 MT→レンジ→MT」。
    # Source: https://arutora.com/24113
    # Source: https://fuucdayo.com/battle/3414/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5178834
    # 軽減表は本来 P1-P7 全Phase を 1 シートで扱うため、便宜上 P1 にぶら下げる。
    # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5006460/
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (Patch 7.1 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1mvMEPv8BkWObs1z37AeOZ41u0dHV5RpA8_Sbzd3x84Y/edit?usp=sharing
      copyable: true
    videos:
      - title: 【絶竜詩戦争】文字を読みたくない人のための教皇庁① (P1解説)
        # Source: 検索結果より（同シリーズの解説動画群）
        url: https://www.youtube.com/watch?v=Xd9DQojqmWA
      - title: 【FF14/絶】絶竜詩戦争 攻略配信 Day 1【ぬけまる】
        url: https://www.youtube.com/watch?v=knE5LqufEW8
        author: ぬけまるG
    strategies:
      - id: ririd-style-p1
        name: リリド式 P1 (MTアデル/STグリノー/線ST無敵/沈黙 MT→レンジ→MT)
        description: |
          りりーどーる版野良主流。
          - MTアデルフェル / STグリノー固定
          - ホーリーブレードダンス線は ST 無敵で受ける
          - ホリエストブレッシング詠唱は沈黙でキャンセル: MT→レンジ→MT の順
          - プレステ散開: 北基準で◯×△□マーカーをロール固定で散開
    tips:
      - "ハイパーディメンションは北捨て→南捨ての順で処理。"
      - "プレステ散開はロール固定で簡略化できるが、後半（P5死刻）に備え位置パターンの理解も必要。"
      - "光翼閃の捨て位置は安置横にペア（H1H2 / D34 / MTST / D12）。"

  - id: p2
    name: P2 トールダン (King Thordan and His Knights Twelve)
    order: 2
    description: |
      雷槍、聖杖、隕石（ホーリーコメット）など。
      野良主流は「ゼフィラン基準散開 / 隕石ハムカツ式」。
      雷槍はスパイラルスラスト＋百雷、聖杖はゼフィラン基準でペア調整（MTST/H1H2/D1D2/D3D4）。
      隕石GGパターンは多くの固定で「詰みパターンとして諦める」とされる。
    # Source: https://arutora.com/24197
    # Source: https://fuucdayo.com/battle/3414/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5178834
    videos:
      - title: 【絶竜詩戦争】文字を読みたくない人のためのトールダンフェーズ
        # Source: 検索結果より (ぬけまる/他のシリーズ動画)
        url: https://www.youtube.com/watch?v=mxeQNCgHI7Y
        # 注: ニーズ動画と同系列の解説動画シリーズ。トールダン版は別動画にあるかも要確認。
    strategies:
      - id: ririd-style-p2
        name: リリド式 P2 (ゼフィラン基準散開/隕石ハムカツ式)
        description: |
          りりーどーる版野良主流。
          - 雷槍: MT組 D-1 / ST組 B-3 で扇配置
          - 聖杖: ゼフィラン基準でペア (MTST/H1H2/D1D2/D3D4) を組み、剣1+MT組はゼフィラン対角、剣2+ST組はゼフィラン後ろ
          - 隕石（ホーリーコメット）: ハムカツ式（南北スタートで7回設置）
    tips:
      - "トールダン位置は蒼天騎士団の出現時点で予測可能。誰かがコールすると効率的。"
      - "ヘヴィインパクト（ドーナツ型攻撃）は中心に寄って回避。"
      - "ディメンションクラッシュ後はエリアが分断され、6本の塔処理が必要。"

  - id: p3
    name: P3 ニーズヘッグ (Nidhogg)
    order: 3
    description: |
      サイコロ（堕天のドラゴンダイブ）、4塔（ジオーガとゲイルスコグル）、
      ソウルテザー、アイ・オブ・タイラント、牙尾/尾牙の連旋などのギミック。
      野良主流は「①②③ イル↓D・スパ↑B 固定 / 4塔近接調整」。
    # Source: https://arutora.com/24296
    # Source: https://fuucdayo.com/battle/3414/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5178834
    videos:
      - title: 【FF14/絶解説】絶竜詩戦争 ニーズフェーズ図解解説 ジャンプ全パターン視点あり【ぬけまる】
        url: https://www.youtube.com/watch?v=mxeQNCgHI7Y
        author: ぬけまるG
      - title: 【絶竜詩戦争】文字を読みたくない人のためのニーズヘッグフェーズ前半【解説】
        url: https://www.youtube.com/watch?v=Xd9DQojqmWA
        # Source: 検索結果より
    strategies:
      - id: iru-d-spa-b
        name: イル↓D・スパ↑B固定 (リリド式)
        description: |
          サイコロ番号と塔配置を固定する野良主流。
          - イルーシブジャンプ↓: D ライン担当
          - スパインダイブ↑: B ライン担当
          - サイコロ②③は北でアピール、①は中央配置
          - 4塔近接調整: 近接ジョブが移動調整、優先度は時計回り>反時計回り>対角
      - id: nukemaru-nidhogg
        name: ぬけまる式 (ニーズフェーズ図解版)
        description: |
          ぬけまる動画準拠の処理法。サイコロ全パターンの視点動画あり。
          固定の流派として選ばれることもある。
    tips:
      - "MTはボスをA（北）に向け続ける。"
      - "ソウルテザーはタンク2名で線処理（無敵活用推奨）。"
      - "時間調整: 最期の咆哮までに削り切る必要があるため、火力管理が必須。"

  - id: p4
    name: P4 邪眼フェーズ (The Eyes of Nidhogg)
    order: 4
    description: |
      邪竜の目（左眼 / 右眼）を破壊する短いフェーズ。
      赤線/青線の交換による眼への攻撃、ミラージュダイブ（複数回の円形範囲）など。
      野良主流は「近接青眼寄せ / ミラージュダイブ交代固定」。
      ※ARUTORA 等の 8 段階構成では P5「教皇庁②（タンクLB / 光翼閃②）」を独立フェーズとして
      扱うが、本ファイルは P1〜P7 構成のため、教皇庁② を P4 の後半（P4-2）として含む。
    # Source: https://arutora.com/24357
    # Source: https://arutora.com/24400
    # Source: https://fuucdayo.com/battle/3414/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5178834
    videos:
      - title: 【絶竜詩戦争】邪眼フェーズ解説（要調査）
        # Source: 検索結果から個別動画タイトルは確証できなかったため要調査
        # 代替: ぬけまるG 攻略配信 Day シリーズ
        url: https://www.youtube.com/@nukemarugames/videos
        author: ぬけまるG
    strategies:
      - id: kinsetsu-aoi-yose
        name: 近接青眼寄せ (リリド式)
        description: |
          近接ジョブが青眼に寄って効率的にダメージを与える野良主流。
          - 黄玉: DPS / 青玉: TH 担当
          - 黄玉後: 邪眼南北で受け渡し
          - ミラージュダイブ: 青眼集合、交代順は ①②③④優先順位
          - 1回目: ①D1>D2④ / 2回目: ①D3>D4④ / 3回目: ①MT>ST>H2>H1④
    tips:
      - "赤線と青線は接触することで交換できる。これを利用して効率的に削る。"
      - "右眼を優先破壊、その後左眼を処理。"
      - "P4 後の P4-2「教皇庁②」では タンク LB3 を シャリベル HP 29% で使用、光翼閃② は P1 と同様。"

  - id: p5
    name: P5 偽典トールダン / 至天の陣 (Dark King Thordan)
    order: 5
    description: |
      偽典トールダン戦。「至天の陣:風槍」と「至天の陣:死刻」の 2 大ギミック。
      死刻は絶竜詩最大の山場とも言われる複雑なギミックで、
      死の宣告デバフ + ツイスター + ヘヴィインパクトを直線移動で処理する。
      野良主流は「こまぞう式改」（イディル式 + こまぞう式のハイブリッド）。
    # Source: https://arutora.com/24419
    # Source: https://meilog-ff14.com/sikoku-kaisetsu/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/26041085/blog/5023548/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/26040845/blog/5034036/
    videos:
      - title: 【FF14/絶解説】こまぞう式改 死刻 絶竜詩 アニメーション解説【ぬけまる】
        url: https://www.youtube.com/watch?v=NIroKcIHpnI
        author: ぬけまるG
      - title: 【FF14/絶解説】絶竜詩戦争 いいところ取り死刻+α アニメーション解説【ぬけまる】
        url: https://www.youtube.com/watch?v=TBt_AgoHn80
        author: ぬけまるG
    strategies:
      - id: komazou-shiki-kai
        name: こまぞう式改 (野良主流死刻処理)
        description: |
          現在もっとも採用されている主流処理法。
          イディル式とこまぞう式のハイブリッドで、基本動作はこまぞう式、
          散開座標はイディル式を採用。
          死の宣告解放点を固定し、ツイスターを意識する必要を最小化する。
          散開優先度: D4>D3>D2>D1>ST>MT>H1>H2 (※固定により変動あり)
      - id: komazou-w3rd
        name: こまぞう式 (W3rd / オリジナル)
        description: |
          オリジナル「こまぞう式」。W3rd クリアチームの流派。
          散開優先度は D4MTSTD1D2D3H1H2 系統。
      - id: idyll-shiki
        name: イディル式 (旧主流)
        description: |
          旧主流処理法。現在は「こまぞう式改」に取って代わられているが
          固定によっては依然採用されることもある。
    tips:
      - "フィールドマーカー設置（1234マーカーは斜め内側 / ABCDは外周金リング接触）が必須。"
      - "風槍: スパイラルピアス対象者は対角側へ線を伸ばし、青玉対象は北西へ。"
      - "死刻: 北西→南東に斜め8人並び、ゲリック出現位置を北として認識。"
      - "死刻処理は固定向け（複数の流派融合のため複雑）。野良では「こまぞう式改」が主流。"

  - id: p6
    name: P6 二天竜 (Nidhogg and Hraesvelgr)
    order: 6
    description: |
      ニーズヘッグ（D側）とフレースヴェルグ（B側）の 2 体戦。
      聖竜/邪竜の息吹（線処理）、滅殺の誓い（DPS リレー）、
      アク・アファー（ヒラ起点頭割り）、邪念の炎、カータライズなどのギミック。
      野良主流は「おこめ式息吹1 / 脳死息吹2 / 南三角」。
    # Source: https://arutora.com/24493
    # Source: https://arutora.com/24254
    # Source: https://fuucdayo.com/battle/3414/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5178834
    videos:
      - title: 【FF14/絶解説】絶竜詩戦争 2天竜フェーズ 図解解説【ぬけまる】
        url: https://www.youtube.com/watch?v=3yJpWHmKjpg
        author: ぬけまるG
    strategies:
      - id: okome-style-p6
        name: おこめ式（息吹1回目） / 脳死（息吹2回目） / 南三角
        description: |
          野良主流の二天竜処理。
          - ニーズ担当: MT H1 D1 D3 / フレース担当: ST H2 D2 D4
          - 息吹1回目: おこめ式（調整: H2 D2 D3、初期配置で散開）
          - 息吹2回目: 脳死配置（A基準で北側にMT、フレース側に頭割り集合）
          - 南三角: 初期散開から「赤線と青線を1対ずつ3ペアに分けて処理」、
            動くのは2名のみで効率的
          - 滅殺の誓い受け渡し順: DPS→MT→ST→近接(D1優先)→D3
          - 邪念の炎: ←MT ST D1 D2 D3 D4 H1 H2→ の優先順位で白+(無)/紫を配置
    tips:
      - "息吹は線を伸ばし過ぎて反対側の即死範囲に入らないよう注意。"
      - "アク・アファー: ヒーラー2名を起点とした頭割り、HP均等化が必須。"
      - "カータライズ: MT/ST はタッチダウン A 集合、滅殺持ち近接と D3 は A に残る。"
      - "1234マーカーは「絶対的な安地」として機能。設置精度が攻略成否を分ける。"

  - id: p7
    name: P7 騎竜神トールダン / 最終フェーズ (Dragon-king Thordan)
    order: 7
    description: |
      最終フェーズ。騎竜剣エクサフレア、トリニティ（オートアタック）、
      騎竜剣アク・モーン、騎竜剣ギガフレア、騎竜剣モーン・アファー（時間切れ攻撃）の連続。
      「エクサ→アクモーン→ギガフレア」のサイクルを 3 週繰り返して時間切れに到達する設計。
      野良主流は「アクモーン2回目 TLB3」処理。
    # Source: https://arutora.com/24559
    # Source: https://baru7studio.hatenablog.com/entry/2024/06/23/193038
    # Source: https://yuguchan.com/1226/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5178834
    videos:
      - title: 【FF14/絶解説】絶竜詩戦争 最終フェーズ 図解解説 軽減例付き 忍暗白視点【ぬけまる】
        url: https://www.youtube.com/watch?v=1fsbzkZsWUE
        author: ぬけまるG
      - title: 【絶竜詩戦争】文字を読みたくない人のための騎竜神トールダン【解説】
        url: https://www.youtube.com/watch?v=pRkdxw9YOLo
        # Source: 検索結果より
    strategies:
      - id: acmorn2-tlb3
        name: アクモーン2回目 TLB3 (リリド式)
        description: |
          野良主流の最終フェーズ処理。
          - アクモーン2回目で タンク LB3 を発動
          - エクサ→アクモーン→ギガフレア の 3 周構成（3 周目はギガフレアなし）
          - トリニティ AA 受け順: エクサ後→H1/H2 / アクモーン後→D1/D2 / ギガ後→D3/D4
      - id: tate-yoke
        name: エクサ縦避け（フィールド模様基準）
        description: |
          ARUTORA 推奨のエクサフレア処理法。
          ボスを北または南に向けた状態で、最初の爆発後に中心に移動、
          その後ひし形の床模様の頂点へ移動する縦避け方式。
    tips:
      - "タンクはミスが許されない（向き調整 / ヘイトコントロールの失敗は即ワイプ）。"
      - "タンク以外がダイナモ/チャリオットのコールを担当して負担軽減。"
      - "ギガフレア: 1発目の予兆を見たら対角へ、着弾後は直線スプリント移動。"
      - "アクモーン: 連続頭割り＋塔出現、方向は「MT組、ST組、タンク」で分散。"

