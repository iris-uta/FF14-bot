macros:
  - source: りりーどーる (P1 - 教皇庁① / MTアデル STグリノー / 線ST無敵 / 沈黙 MT→レンジ→MT)
    url: https://ffxiv.link/088010
    text: |
      /p 【教皇庁①】
      /p ｜■MTアデル／STグリノー
      /p ｜開幕アデルへバースト　線ST無敵
      /p ｜■ハイパーディメンション：北捨て→南捨て
      /p ｜■沈黙　MT→レンジ→MT
      /p ｜■プレステ　※北基準
      /p ｜　H△　T×　 T□
      /p ｜　D〇　　 　 D〇　※◯： 西 D1>D2>D3>D4 東
