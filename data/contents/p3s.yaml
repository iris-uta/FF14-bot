id: p3s
displayName: 万魔殿パンデモニウム零式：辺獄編3層 (獄炎鳳王フェニックス)
shortName: P3S
type: savage
patch: "6.05"
phases:
  - id: p1
    name: P1 前半 (フェニックス通常戦)
    order: 1
    description: |-
      フェニックス前半フェーズ。鳥雑魚 + 闇の炎 + 突進 + 線取り。
      主要技:
        - 4:4 分け (雑魚 / 霊泉)            MT 組 = MTH1D1D3, ST 組 = STH2D2D4
        - 闇の炎設置ペア (X 字)            サイコロ数字マーカー、時計回り処理
        - 十字走火 (大玉 / 小玉)            基本北西、北東出は北東へ
        - 突進 (中央散開 / 左右散開)       ボスから T → H → D の順
        - 雑魚誘導                          MT 組: 北→西 / ST 組: 東→南
        - 雑魚突進 (線 2 本 / 線 1 本)
      野良主流: Game8 採用「基本犬丸＋闇の炎X字 (しのしょー)＋霊泉ハピおじ」式。
    videos:
      - title: ゆっくりと振り返るパンデモニウム辺獄編零式1層
        url: https://www.youtube.com/watch?v=eGJ5eRvRzK8
    mitigation:
      name: 軽減表テンプレ (P3S - パッチ 6.0x 攻略時の野良標準)
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
  - id: p2
    name: P2 後半 (魔力錬成 〜 辺獄フェーズ)
    order: 2
    description: |-
      後半フェーズ。魔力錬成 (闇)、霊泉フェーズ、辺獄シリーズ。
      主要技:
        - 魔力錬成・闇 (辺獄の炎嵐以外)     近接組北 / 遠隔組南
        - 霊泉フェーズ (ハピおじ式)         塔踏み AoE 時計回り
        - 辺獄 2 回目散開                   位置固定散開
        - 辺獄黒竜巻ノックバック            近接←/遠隔→
        - 黒玉散開 (赤小玉→黒小玉 / 赤大玉→黒小玉)
        - 辺獄中ピザカット避け              3 番目待機 → 1 番目退避
        - 辺獄中ノックバック後散開
      野良主流: 同上 Game8 採用 融合版。
    tips:
      - 魔力錬成・闇は近接組 (MTSTD1D2) 北 / 遠隔組 (H1H2D3D4) 南で安置取り。
      - "霊泉フェーズ塔踏み AoE: MT 組 北/西スタート、ST 組 南/東スタート (時計回り)。"
      - "AoE ペア: MT/ST → D1/D2 → D3/D4。"
      - 辺獄黒竜巻ノックバックは黒竜巻に向かって近接が左へ、遠隔が右へ吹き飛び安置確保。
macros:
  - source: Game8 (ゲームエイト) - 辺獄編零式3層 前半フェーズ用
    url: https://game8.jp/ff14/421350
    text: |-
      /p 【4:4分け（雑魚/霊泉）】
      /p MT組：MTH1D1D3　ST組：STH2D2D4
      /p 【闇の炎設置ペア：X字】
      /p 　D3/MT ① D4/ST
      /p 　 　 ④　□　②
      /p 　D1/H1 ③ D2/H2
      /p ※サイコロ数字マーカー、時計回りに炎を倒す
      /p 【十字走火】大玉/小玉：基本北西　※北東方面に出た場合北東
      /p 【突進：中央散開】ボスからMT/D3→H1/D1→H2/D2→ST/D4
      /p 【突進：左右散開】←TH　DPS→ ※縦の並びは中央散開
      /p 【雑魚誘導】MT組：北→西 　ST組：東→南
      /p 【雑魚突進】
      /p 線2本：繋がってる鳥の対角の時計回り
      /p 線1本：繋がってるペアの対角
  - source: Game8 (ゲームエイト) - 辺獄編零式3層 後半フェーズ用
    url: https://game8.jp/ff14/421350
    text: |-
      /p 【魔力錬成：闇（辺獄の炎嵐以外）】
      /p 近接組(MTSTD1D2)：北安置　遠隔組(H1H2D3D4)：南安置
      /p 【霊泉フェーズ：ハピおじ】
      /p 塔踏みAOEスタート場所：MT組→北/西　ST組→南/東
      /p ※時計回り塔踏みとAOEを設置
      /p AoEペア：MT/ST → D1/D2 → D3/D4
      /p 【辺獄2回目散開】
      /p 　　 　　〇H2
      /p 　 　 MT 　 ST
      /p D3　 　 ボス　 　 H1
      /p 〇 　D1 D4 D2　〇
      /p 【辺獄黒竜巻ノックバック】
      /p 　　 　黒竜巻
      /p ←近接 　　　 遠隔→
  - source: Game8 (ゲームエイト) - 辺獄編零式3層 黒玉散開マクロ
    url: https://game8.jp/ff14/421350
    text: |-
      /p 【赤小玉→黒小玉】　【赤大玉→黒小玉】
      /p 　 　MT　ST　　　　 D1　MT　D2　ST
      /p 　　　 ★　 　　 　　 　　　 ★
      /p 　 　D1　 D2
      /p 　　 　中央
      /p 　 　H1　H2　　　　D3　H1　H2　D4
      /p 　D3 　 　 　D4
      /p ↑辺獄1回目ピザ後も【赤小玉→黒小玉】の並びで散開
      /p 【辺獄中ピザカット避け】
      /p ピザ3番目待機→1番目に退避→その場で頭割りor散開
      /p 【辺獄中のノックバック後散開】
      /p 　　　　　〇
      /p ST　D2 　★　 H2　D4
      /p 　〇 　D1　 H1　〇
      /p 　　MT　　　　D3
