# 万魔殿パンデモニウム零式：辺獄編3層 - フェニックス (P3S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - シリーズ呼称について p1s.yaml 冒頭コメント参照。
# - 通称: 国際/FFLogs では P3S、Game8/JP では「辺獄編零式3層」「パンデ零3層」。
# - 公式ボス名: 「獄炎鳳王フェニックス」(英: Phoinix)。
# - 旧 tier (2022-01 実装) のため情報の散逸あり。Game8 + ARUTORA / さにすと 主体で収集。
# - 流派名: Game8 採用版は「基本犬丸 + 闇の炎X字 (しのしょー式) + 霊泉はぴおじ式」融合形。

id: p3s
displayName: 万魔殿パンデモニウム零式：辺獄編3層 (獄炎鳳王フェニックス)
shortName: P3S
type: savage
patch: "6.05"
# ノーマル実装日: 2021-12-21 (Patch 6.01)
# 零式実装日:   2022-01-04 (Patch 6.05)
# 拡張: 暁月のフィナーレ (Endwalker)
# Source: https://ffxiv.consolegameswiki.com/wiki/Asphodelos:_The_Third_Circle_(Savage)

phases:
  - id: p1
    name: P1 前半 (フェニックス通常戦)
    order: 1
    description: |
      フェニックス前半フェーズ。鳥雑魚 + 闇の炎 + 突進 + 線取り。
      主要技:
        - 4:4 分け (雑魚 / 霊泉)            MT 組 = MTH1D1D3, ST 組 = STH2D2D4
        - 闇の炎設置ペア (X 字)            サイコロ数字マーカー、時計回り処理
        - 十字走火 (大玉 / 小玉)            基本北西、北東出は北東へ
        - 突進 (中央散開 / 左右散開)       ボスから T → H → D の順
        - 雑魚誘導                          MT 組: 北→西 / ST 組: 東→南
        - 雑魚突進 (線 2 本 / 線 1 本)
      野良主流: Game8 採用「基本犬丸＋闇の炎X字 (しのしょー)＋霊泉ハピおじ」式。
    # Source: https://game8.jp/ff14/421350
    # Source: https://arutora.com/23996
    mitigation:
      name: 軽減表テンプレ (P3S - パッチ 6.0x 攻略時の野良標準)
      # 公開状態の P3S 専用 Last Agous シートを 2026 時点で確認できず。要手動補完。
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
    videos:
      # 注: 「ゆっくりと振り返る辺獄編零式」シリーズに 3 層編が含まれる前提。
      # シリーズ 1 層編を代表 URL として保持。
      - title: ゆっくりと振り返るパンデモニウム辺獄編零式1層 #FF14 (シリーズ起点)
        url: https://www.youtube.com/watch?v=eGJ5eRvRzK8
    strategies:
      - id: inumaru-shinoshow-hapioji
        name: 基本犬丸 + 闇の炎 X 字 (しのしょー) + 霊泉ハピおじ式 (Game8 採用)
        description: |
          Game8 採用流派。複数の野良流派を融合した形。
          - 4:4 分け: MT 組 (MTH1D1D3) / ST 組 (STH2D2D4)
          - 闇の炎設置ペア (X字): D3/MT → ① / D4/ST → ② / D1/H1 → ③ / D2/H2 → ④
            サイコロ数字マーカー、時計回りに炎を倒す
          - 十字走火: 大玉/小玉は基本北西へ走る、北東に出た場合は北東
          - 突進中央散開: ボスから MT/D3 → H1/D1 → H2/D2 → ST/D4
          - 突進左右散開: ←TH / DPS→ (縦の並びは中央散開)
          - 雑魚誘導: MT 組 北→西 / ST 組 東→南
          - 雑魚突進: 線 2 本 → 繋がってる鳥の対角の時計回り、線 1 本 → 繋がってるペアの対角

  - id: p2
    name: P2 後半 (魔力錬成 〜 辺獄フェーズ)
    order: 2
    description: |
      後半フェーズ。魔力錬成 (闇)、霊泉フェーズ、辺獄シリーズ。
      主要技:
        - 魔力錬成・闇 (辺獄の炎嵐以外)     近接組北 / 遠隔組南
        - 霊泉フェーズ (ハピおじ式)         塔踏み AoE 時計回り
        - 辺獄 2 回目散開                   位置固定散開
        - 辺獄黒竜巻ノックバック            近接←/遠隔→
        - 黒玉散開 (赤小玉→黒小玉 / 赤大玉→黒小玉)
        - 辺獄中ピザカット避け              3 番目待機 → 1 番目退避
        - 辺獄中ノックバック後散開
      野良主流: 同上 Game8 採用 融合版。
    # Source: https://game8.jp/ff14/421350
    tips:
      - "魔力錬成・闇は近接組 (MTSTD1D2) 北 / 遠隔組 (H1H2D3D4) 南で安置取り。"
      - "霊泉フェーズ塔踏み AoE: MT 組 北/西スタート、ST 組 南/東スタート (時計回り)。"
      - "AoE ペア: MT/ST → D1/D2 → D3/D4。"
      - "辺獄黒竜巻ノックバックは黒竜巻に向かって近接が左へ、遠隔が右へ吹き飛び安置確保。"

