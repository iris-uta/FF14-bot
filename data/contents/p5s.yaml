id: p5s
displayName: 万魔殿パンデモニウム零式：煉獄編 1層 (プロトカーバンクル)
shortName: P5S
type: savage
patch: "6.21"
phases:
  - id: p1
    name: P1 プロトカーバンクル (Proto-Carbuncle) 通し
    order: 1
    description: |-
      ライオン型「創造の継承者」プロトカーバンクル戦。1ボス完結型。
      主要ギミック:
        - ソニックハウル (全体攻撃 + ノックバック)
        - ベノムマス / ベノムクランチ (タンク強攻撃、スワップ運用)
        - トパーズストーン (毒石ペア、近接内側 / 遠隔外側で時計回り)
        - ペア毒沼 (ペアで指定マーカーに毒AOE誘導)
        - ダブルラッシュ (対角突進、ノックバック軽減必須)
        - トパーズクラスター (4連トパーズ、結晶順序を覚える)
        - ベノムスコール / ベノムサージ (頭割り↔散開の交互)
        - クロウアンドテイル / テイルアンドクロウ (前後/前前/後前の判別)
        - 捕食 (Starving Stampede / 8青マーカーの順次飛び、スタン→捕食)
        - 十字毒沼 (十字配置の毒沼、塔踏み)
        - ベノムスプラッシュ (4部屋の3個部屋から対角逃げ)
      野良主流: ぬけまる式 (Game8 採用)。
    videos:
      - title: 【 FF14 / 煉獄零式解説 】煉獄編 零式 1層 さらっと解説 概要欄にマクロあります【ぬけまる】
        url: https://www.youtube.com/watch?v=GRrZvJT1fXM
        author: ぬけまるG
      - title: 【 FF14 】速報版 パンデモニウム 煉獄編 零式1層 解説動画 【 犬丸のぞみ 】
        url: https://www.youtube.com/watch?v=W7nJ5q8cU7w
        author: 犬丸のぞみ
    mitigation:
      name: Shimaji Row 軽減表 (パンデモニウム煉獄編 零式 全層 スプレッドシート)
      url: https://docs.google.com/spreadsheets/d/1bXhAgECunWRkWTn6zt7cxARg41il_wZcTVucgAu01m4/edit?usp=sharing
      copyable: true
    tips:
      - 毒石ペアは時計/反時計の方向ミスでパーティ事故になりやすい。マクロ表記を必ず読み合わせる。
      - 8連噛みつき (Starving Stampede) は青マーカー順を覚えれば回避は機械的。
      - トパーズクラスターは結晶落下順をボイチャでコールするのが安定。
macros:
  - source: Game8 (ゲームエイト) - 煉獄編零式1層 ぬけまる式 マクロVer2
    url: https://game8.jp/ff14/464675
    text: |-
      /p 【基本散開】　　　【十字毒塔】STフリー
      /p D3 MT D4　　　　　　MT(無敵)
      /p H1　　H2　　　H1D3　　 H2D4
      /p D1 ST D2　　　　　　 D1D2
      /p 【毒塔（近接内側 / 遠隔外側）】
      /p MTST / H1D3：12時から反時計回り
      /p D1D2 / H2D4：1時から時計回り
      /p 【ベノムサージ(東西受け)/スプラッシュ】
      /p 西/内壁：MTH1D1D3 東/外壁：STH2D2D4
      /p 【毒沼 + ベノムスコール】
      /p 　　毒D1H1D3外
      /p 　　　　MT
      /p 　　　　☆
      /p 　　　　ST
      /p 　外D4H2D2毒　※毒が逆位置の場合反転
      /p MT組：マーカー1or4に出た毒に合わせて移動
      /p ST組：マーカー2or3に出た毒に合わせて移動
      /p AOEは外周に捨ててMT/STの位置で頭割り
      /p 【4部屋ベノムスプラッシュ：3個部屋の対角】
recruitmentTemplates:
