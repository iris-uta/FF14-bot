      /p D1D2D3D4     ⑥-⑤-④｜④⑥入れ替え
      /p 　　　　　　   ⑤　　   ｜AoE：1,3の内側から時計周り
      /p ①-②-③　①　　　③　｜【バニシュガ2】
      /p │ ● │→　　 ●　　   ｜大球：X字ペア
      /p ⑥-⑤-④　④　　　⑥　｜MT/D3　H2/D4
      /p 　　　　　　   ②　　   ｜H1/D1　 ST/D2
      /p 【雑魚フェーズ】
      /p 　　　MT　　    ｜近接：円AoE誘導
      /p 　  D3　  H2      ｜　　：誘導する光水晶を攻撃
      /p D1　　　　  D2 ｜　　：ボス本体に近接LB3
      /p 　  H1　  D4      ｜遠隔：扇誘導
      /p 　　　ST　　　  ｜　　：時計回りの光水晶を攻撃

