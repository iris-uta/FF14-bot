  - source: りりーどーる (P4 - ぬけまる扇前 / アクモーン1:7 / 赤爆走アムレンY字)
    url: https://ffxiv.link/0122122
    text: |
      /p P4(扇前調整/アクモーン1:7/赤爆走アムレンY字/attack meマクロ)
      /p 基本担当：MT組⇒ミトロン/ST組⇒闇の巫女
      /p 【光と闇の竜詩】
      /p 北：H1H2MTST 南北で整列
      /p 南：D1D2D3D4
      /p (四角型)　　　　|(砂時計)　　　  |扇誘導
      /p  HーーT  TとD②| HーーT TとD①| H　　T
      /p │　　│　  入替| 　 X　　　入替|　  ●
      /p D①ーD②　　    |D①ーD② 　　  |←D1234→
      /p ■頭割り：南北の4:4で処理
      /p ※南北の片側に頭割りが偏った場合
      /p ⇒扇誘導頭割りが扇誘導の前に調整
      /p ■宵闇の舞踏技：タンク無敵で2回とも受ける
      /p ■アクモーン1:7受け
      /p 1回目：MT/2回目：ST/他：中央
      /p 【時間結晶】
      /p 赤ブリザガ/エアロガ優先度(西←H1MTSTD1D2D3D4H2→東)
      /p A基準/エラプと他担当は紫線に合わせて移動
