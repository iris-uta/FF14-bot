# 絶エデン (Futures Rewritten Ultimate / FRU)
# データ収集日: 2026-05-24
# 第一参照: りりーどーる (Lily Doll) - Lodestone 日記、ぬけまるG (YouTube)
#
# 注意:
# - 本ファイルの情報源は2025年初頭時点で確認できた野良主流の処理法・マクロです。
# - 「処理方」「マクロ」は時期によって変化します。最新版はりりーどーる/ぬけまるの最新記事を参照。
# - WebFetch でりりーどーるの短縮URL (ffxiv.link/0122122) は 403 で取得不可だったため、
#   Lodestone 原文 (blog/5500375) から抽出したマクロ抜粋を記載しています。

id: fru
displayName: 絶エデン
shortName: FRU
type: ultimate
patch: "7.11"                # 実装パッチ
# 実装日 2024-11-26 / 世界最速クリア Kindred (NA) 2024-11-28
# Source: https://asellog.com/fru-raidrace/
# Source: https://ffxiv.consolegameswiki.com/wiki/Futures_Rewritten_(Ultimate)

phases:
  - id: p1
    name: P1 フェイトブレイカー (Fatebreaker)
    order: 1
    description: |
      開幕フェーズ。サイクロニックブレイク、楽園絶技、転輪召、シンソイルセヴァー、塔踏み（バーンストライク）など。
      野良主流は「優先HTD / STD4入替 / 塔キャス固定」。
    # Source: https://ffxiv.consolegameswiki.com/wiki/Futures_Rewritten_(Ultimate)
    # Source: https://fuucdayo.com/battle/5758/
    # 軽減表は本来 P1-P5 全Phase を 1 シートで扱うため、便宜上 P1 にぶら下げる。
    # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5489598/
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (Patch 7.11 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1MWvfvf283BAkDjLBXu6wQz7EWbjYrJzAtyKfO5E3k2s/edit?usp=sharing
      copyable: true
    videos:
      - title: 【FF14/絶エデン】フェーズ1野良主流簡易解説(優先HTD/STD4入替/塔キャス固定)【絶もうひとつの未来】
        url: https://www.youtube.com/watch?v=0HDstP0aU_Y
        # Source: 検索結果より (投稿者非確定)
      - title: 【絶エデン】P1通しでひたすら見る動画 新リリドぬけまる【FF14 絶もうひとつの未来】
        url: https://www.youtube.com/watch?v=Ws3p-stlYuY
        author: ぬけまるG
      - title: 【絶エデン】P1楽園絶技ひたすら見る動画 新リリドぬけまる【FF14 絶もうひとつの未来】
        url: https://www.youtube.com/watch?v=boAVFc9chKU
        author: ぬけまるG
      - title: 「P1フェイトブレイカーの解説動画」by Lucrezia (X投稿)
        url: https://x.com/TeamLucrezia/status/1861426186238468427
        author: Lucrezia (TeamLucrezia)
    strategies:
      - id: priority-htd-std4
        name: 優先HTD/STD4入替/塔キャス固定 (リリド式)
        description: 野良主流。STとD4が入替、塔をキャスター固定で処理する流派。
    tips:
      - "楽園絶技はSTD4入替。爆印を持っているMTのみ寄る。"
      - "塔処理はキャスター固定（赤魔・召喚・黒魔・ピクトを優先的に塔へ）。"

  - id: p2
    name: P2 シヴァ・ミトロン (Usurper of Frost)
    order: 2
    description: |
      ダイアモンドダスト、鏡の国、光の暴走など。
      Intermission として「Ice Veil (氷帝)」破壊フェーズが直後にある。
      野良主流は「基本イディル / 暴走HT / ノクバマカ色＆バニシュガ2ペア変更」。
    # Source: https://fuucdayo.com/battle/5758/
    # Source: https://ffxiv.consolegameswiki.com/wiki/Futures_Rewritten_(Ultimate)
    videos:
      - title: 【絶エデン】P2光の暴走ひたすら見る動画 新リリドぬけまる【FF14 絶もうひとつの未来】
        url: https://www.youtube.com/watch?v=S_M1xdQMVng
        author: ぬけまるG
    strategies:
      - id: idyll-basic
        name: 基本イディル (リリド式)
        description: |
          りりーどーるの「基本イディル」処理法。
          DD（ダイアモンドダスト）は基本散開から時計回り調整、
          扇誘導は D3 MT D4 ライン上に1,3枚目（スプリント）。
    tips:
      - "扇誘導はスプリント推奨（1,3枚目担当）。"
      - "暴走はHT担当。ノクバマカ色とバニシュガ2ペアの優先度はパーティで合意必須。"

  - id: p3
    name: P3 闇の巫女 (Oracle of Darkness)
    order: 3
    description: |
      究極幻想（時間圧縮・絶）、アポカリプス、頭割り、塔など。
      野良主流は「跡部王国改（ポネコニさん版）」での時間圧縮処理 + アポカリ「最初の安置基準」または「アポカリ基準」。
    # Source: https://fuucdayo.com/battle/5758/
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5500375
    videos:
      - title: 【FF14/絶エデン解説】P3-1 時間圧縮・絶 解説 絶もうひとつの未来【ぬけまる】
        url: https://www.youtube.com/watch?v=oKSHteslL2w
        author: ぬけまるG
      - title: 【FF14/絶エデン解説】P3-2 アポカリ解説 安置基準&アポカリ基準 絶もうひとつの未来【ぬけまる】
        url: https://www.youtube.com/watch?v=4gWtS7GWiFQ
        author: ぬけまるG
      - title: 【絶エデン】P3アポカリひたすら見る動画 新リリドぬけまるアポカリ基準【FF14 絶もうひとつの未来】
        url: https://www.youtube.com/watch?v=5B-ZDg1K9J4
        author: ぬけまるG
      - title: 【FF14/絶PHイメトレ用】絶エデン アポカリプスを繰り返し見る動画 PH視点【ぬけまる】
        url: https://www.youtube.com/watch?v=Bf6X88gX_V4
        author: ぬけまるG
    strategies:
      - id: atobe-kingdom-kai
        name: 跡部王国改 (時間圧縮・絶)
        description: |
          ポネコニさんが派生させた跡部王国改版。
          P3野良主流の時間圧縮処理。X投稿 (PoneKoni) に詳細図あり。
      - id: anchi-kijun
        name: アポカリ：最初の安置基準
        description: |
          TH 赤紫マーカー / DPS 黄青マーカーで、最初の安置を基準にアポカリ処理。
          固定での採用が主流。遠隔組の移動距離が少ない。
      - id: apoka-kijun
        name: アポカリ：アポカリ基準
        description: |
          アポカリの出現位置を見て安置を決定する流派。
          ぬけまる動画 (P3-2) で詳細解説。
    tips:
      - "時間圧縮はホットバーカンペ3種（全体/TH用/DPS用）の事前準備が必須。"
      - "アポカリ処理は固定なら安置基準、野良ならアポカリ基準が多い傾向。"

  - id: p4
    name: P4 2体フェーズ (Usurper of Frost & Oracle of Darkness)
    order: 4
    description: |
      ミトロンと闇の巫女の2体フェーズ。
      アークライ、光と闇の竜詩、アク・モーン、モーン・アファー、時間結晶など。
      野良主流は「扇前調整 / アクモーン1:7 / 赤爆走アムレンY字 / attack me マクロ」。
      MT組がミトロン、ST組が闇の巫女を担当。
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34120564/blog/5500375
    # Source: https://fuucdayo.com/battle/5758/
    videos:
      - title: 【FF14/絶エデン】P4 2体フェーズ解説 絶もうひとつの未来 Futures Rewritten (ULTIMATE)【ぬけまる】
        url: https://www.youtube.com/watch?v=nX2kfaMnCiU
        author: ぬけまるG
      - title: 「P4後半 時間結晶の解説動画」by Lucrezia (X投稿)
        url: https://x.com/TeamLucrezia/status/1862906044655312937
        author: Lucrezia (TeamLucrezia)
    strategies:
      - id: nukemaru-style
        name: ぬけまる式 (扇前調整/アクモーン1:7/赤爆走アムレンY字)
        description: |
          P4-P5 野良主流。
          - 扇前調整: ウォタガ扇前調整
          - アクモーン: 1:7（1人と7人の分割）
          - 赤爆走: アムレンY字配置
          - attack me マクロ使用
    tips:
      - "ST組（闇の巫女担当）は attack me マクロを使用して敵視維持。"
      - "基本担当: MT組 → ミトロン / ST組 → 闇の巫女。"

  - id: p5
    name: P5 パンドラ・ミトロン (Pandora)
    order: 5
    description: |
      最終フェーズ。光塵の剣（Fulgent Blade）、パラダイスリゲインド、星霊の剣など。
      野良主流はぬけまる式。アクモーンはボス基準で MT組左/ST組右。
    # Source: https://fuucdayo.com/battle/5758/
    # Source: https://www.youtube.com/watch?v=nzpOdfOyUNo
    videos:
      - title: 【FF14/絶エデン解説】P5(最終) パンドラ・ミトロン ギミック解説 絶もうひとつの未来【ぬけまる】
        url: https://www.youtube.com/watch?v=nzpOdfOyUNo
        author: ぬけまるG
      - title: 【FF14】絶もうひとつの未来最速攻略ガイド！絶エデンのギミック分析＆攻略短縮のコツを徹底解説【patch7.18】
        url: https://www.youtube.com/watch?v=TFmeQMKxcjU
        # Source: 検索結果より
    strategies:
      - id: nukemaru-style-p5
        name: ぬけまる式 (アクモーン ボス基準/MT組左/ST組右)
        description: |
          P5 野良主流。光塵の剣、アクモーン、パラダイスリゲインド、星霊の剣をぬけまる解説動画準拠で処理。
    tips:
      - "光塵の剣はSplatoonスクリプト (Fulgent Blade Dodge Spots) で安置可視化可能。"
      - "アクモーンはボス基準: MT組左、ST組右。"

# ────────────────────────────────────────────────────────
# マクロ（コピペ用・主要な抜粋）
# ────────────────────────────────────────────────────────
# 注: りりーどーるの完全版マクロは Lodestone 原文 (blog/5500375) 参照。
#     本ファイルには各Phase冒頭の主要マクロ行のみ抜粋。
#     完全コピペは url を Bot から提示する想定。
macros:
  - source: りりーどーる (Lily Doll) - Lodestone 日記「◆絶エデンマクロ◆」
    url: https://jp.finalfantasyxiv.com/lodestone/character/34120564/blog/5500375/
    text: |
      # P1（フェイトブレイカー）— リリド式
      /p P1(優先HTD/STD4入替/塔キャス固定)
      /p ■基本散開 　｜■全ての優先度
      /p D3 MT D4 　｜北/西←H1H2MTSTD1D2D3D4→南/東
      /p H1 ☆ H2　 ペア：TH反時計、DPS時計
      /p D1 ST D2　散開：全員時計回り(遠隔離れる)
      /p ■楽園絶技(STD4入替/※爆印MTだけ寄る)
      /p 　MT組 A-3　　　ST組 1-C
      /p 　　／ H1 ＼　　　／ H2 ＼
      /p 　／D1MTD3＼　／D2STD4 ＼

      # P2（シヴァ・ミトロン）— 基本イディル
      /p P2(基本イディル/暴走HT/ノクバマカ色＆バニシュガ2ペア変更)
      /p 【DD】基本散開から時計回り調整
      /p D3 MT D4 |扇誘導:1,3枚目(スプリント)

      # P3（闇の巫女）— アポカリ最初の安置基準
      /p P3(アポカリ[最初の安置基準]TH赤紫/DPS黄青)
      /p 【時間圧縮・絶】跡部王国改(ぽにこねさん)

      # P4（2体フェーズ）— ぬけまる式
      /p P4(扇前調整/アクモーン1:7/赤爆走アムレンY字/attack meマクロ)
      /p 基本担当：MT組⇒ミトロン/ST組⇒闇の巫女

      # P5（最終フェーズ）— ぬけまる式
      /p P5最終フェーズ(ぬけまる)
      /p 【光塵の剣】
      /p アクモーン(ボス基準)：MT組左/ST組右

  - source: ふうcだよ FF14情報サイト - 絶もうひとつの未来（絶エデン）マクロ
    url: https://fuucdayo.com/macro/5618/
    # P1-P5 各Phase ごとに「マクロコピー」ボタン付きで提供されている。
    # 著者: ふうしーだよ (X: @fuucdayo) / 公開日: 2024-12-05
    # 注: HTMLからマクロ本文を直接抽出できなかったため、URL のみ保持。

# ────────────────────────────────────────────────────────
# 募集テンプレ
# ────────────────────────────────────────────────────────
recruitmentTemplates:
  - source: Rage Avel - Lodestone「固定募集記事テンプレート（コピペ用）」
    # Source: https://na.finalfantasyxiv.com/lodestone/character/36087283/blog/5297756/
    # 注: Lodestone 用 BBCode フォーマット。Discord 用には別途整形が必要。
    template: |
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}

      ▼固定の目標
      ● {{goal}}
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}    # 例: ぬけまる式トレース、リリド式 etc

      ▼必須事項
      {{requirements}}

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle

