id: fru
displayName: 絶もうひとつの未来
shortName: FRU
type: ultimate
patch: "7.11"
phases:
  - id: p1
    name: P1 フェイトブレイカー (Fatebreaker)
    order: 1
    popularStrategy: 優先HTD / STD4入替 / 塔キャス固定
    description: |-
      サイクロニックブレイク、楽園絶技、転輪召、シンソイルセヴァー、塔踏みなど。
      野良主流は「優先HTD / STD4入替 / 塔キャス固定」。
    videos:
      - title: P1 フェイトブレイカー解説【Lucrezia】
        url: https://youtu.be/m1dMWTvdPiI?si=6sABigdyc8BatT0A
        author: Lucrezia
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (Patch 7.11 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1MWvfvf283BAkDjLBXu6wQz7EWbjYrJzAtyKfO5E3k2s/edit?usp=sharing
      copyable: true
    strategies:
      - id: priority-htd-std4
        name: 優先HTD/STD4入替/塔キャス固定
        description: 野良主流。STとD4が入替、塔をキャスター固定で処理する流派。
        popular: false
  - id: p2
    name: P2 シヴァ・ミトロン (Usurper of Frost)
    order: 2
    popularStrategy: 基本イディル / 暴走HT / ノクバマカ色＆バニシュガ2ペア変更
    description: |-
      ダイアモンドダスト、鏡の国、光の暴走など。
      その後雑魚フェーズ(P2.5)が直後にある。
      野良主流は「基本イディル / 暴走HT / ノクバマカ色＆バニシュガ2ペア変更」。
    videos:
      - title: P2～2.5 シヴァ･ミトロン～光の氾濫解説【しのしょー】
        url: https://youtu.be/u7yy2BMyaIU?si=Qe7CLMrmnnktrXNC
        author: しのしょー
    strategies:
      - id: idyll-basic
        name: 基本イディル (リリド式)
        description: |-
          りりーどーるの「基本イディル」処理法。
          DD（ダイアモンドダスト）は基本散開から時計回り調整、
          扇誘導は D3 MT D4 ライン上に1,3枚目（スプリント）。
        popular: false
  - id: p3
    name: P3 闇の巫女 (Oracle of Darkness)
    order: 3
    popularStrategy: 跡部王国改 / アポカリ基準
    description: |-
      時間圧縮・絶、アポカリプス。
      野良主流は「跡部王国改（ぽにこね）」での時間圧縮処理 + アポカリ「アポカリ基準」。
    videos:
      - title: P3-1 時間圧縮・絶 解説【ぬけまる】
        url: https://youtu.be/oKSHteslL2w?si=IEF3cPBdEPmxD1q0
        author: ぬけまるG
      - title: P3-2 アポカリ解説 安置基準&アポカリ基準【ぬけまる】
        url: https://youtu.be/4gWtS7GWiFQ?si=KQ39y1ZDNZixEut-
        author: ぬけまるG
    strategies:
      - id: atobe-kingdom-kai
        name: 跡部王国改 (時間圧縮・絶)
        description: |-
          ポネコニさんが派生させた跡部王国改版。
          P3野良主流の時間圧縮処理。X投稿 (PoneKoni) に詳細図あり。
        popular: false
      - id: anchi-kijun
        name: アポカリ：最初の安置基準
        description: |-
          TH 赤紫マーカー / DPS 黄青マーカーで、最初の安置を基準にアポカリ処理。
          固定での採用が主流。遠隔組の移動距離が少ない。
        popular: false
      - id: apoka-kijun
        name: アポカリ：アポカリ基準
        description: |-
          アポカリの出現位置を見て安置を決定する流派。
          ぬけまる動画 (P3-2) で詳細解説。
        popular: false
  - id: p4
    name: P4 2体フェーズ (Usurper of Frost & Oracle of Darkness)
    order: 4
    popularStrategy: 扇前調整 / アクモーン1:7 / 赤爆走アムレンY字 / attack me マクロ
    description: |-
      ミトロンと闇の巫女の2体フェーズ。
      光と闇の竜詩、アク・モーン、モーン・アファー、時間結晶など。
      野良主流は「扇前調整 / アクモーン1:7 / 赤ブリ爆走アムレンY字 / attack me マクロ」。
      MT組がミトロン、ST組が闇の巫女を担当。
    videos:
      - title: P4 2体フェーズ解説【ぬけまる】
        url: https://youtu.be/nX2kfaMnCiU?si=jF80rhVAJCnm_0ZV
        author: ぬけまるG
    strategies:
      - id: nukemaru-style
        name: ぬけまる式 (扇前調整/アクモーン1:7/赤爆走アムレンY字)
        description: |-
          P4-P5 野良主流。
          - 扇前調整: ウォタガ扇前調整
          - アクモーン: 1:7（1人と7人の分割）
          - 赤爆走: アムレンY字配置
          - attack me マクロ使用
        popular: false
  - id: p5
    name: P5 パンドラ・ミトロン (Pandora)
    order: 5
    description: |-
      光塵の剣（エクサ）、パラダイスリゲインド、星霊の剣など。
      野良主流はぬけまる式。アクモーンはボス基準で MT組左/ST組右。
    videos:
      - title: P5 パンドラ・ミトロン ギミック解説【ぬけまる】
        url: https://youtu.be/nzpOdfOyUNo?si=PNFVTdyQv87FH4Zk
        author: ぬけまるG
    strategies:
      - id: nukemaru-style-p5
        name: ぬけまる式 (アクモーン ボス基準/MT組左/ST組右)
        description: P5 野良主流。光塵の剣、アクモーン、パラダイスリゲインド、星霊の剣をぬけまる解説動画準拠で処理。
        popular: false
