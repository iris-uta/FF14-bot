  - source: りりーどーる (P4 - ぬけまる扇前 / アクモーン1:7 / 赤爆走アムレンY字)
    url: https://ffxiv.link/0122122
    text: |-
      /p P4(扇前調整/アクモーン1:7/赤爆走アムレンY字/attack meマクロ)
      /p 基本担当：MT組⇒ミトロン/ST組⇒闇の巫女
      /p 【光と闇の竜詩】
      /p 北：H1H2MTST 南北で整列
      /p 南：D1D2D3D4
      /p (四角型)　　　　|(砂時計)　　　  |扇誘導
      /p  HーーT  TとD②| HーーT TとD①| H　　T
      /p │　　│　  入替| 　 X　　　入替|　  ●
      /p D①ーD②　　    |D①ーD② 　　  |←D1234→
      /p ■頭割り：南北の4:4で処理
      /p ※南北の片側に頭割りが偏った場合
      /p ⇒扇誘導頭割りが扇誘導の前に調整
      /p ■宵闇の舞踏技：タンク無敵で2回とも受ける
      /p ■アクモーン1:7受け
      /p 1回目：MT/2回目：ST/他：中央

      /p 【時間結晶】
      /p 赤ブリザガ/エアロガ優先度(西←H1MTSTD1D2D3D4H2→東)
      /p A基準/エラプと他担当は紫線に合わせて移動
      /p 　　　       A　　　　　  |赤氷：東西で待機して竜とぶつかる
      /p 　  エラプ　エラプ　　　 |⇒ エラプ側は氷発動後頭割りへ/無い側はスプリントで北安置へ
      /p 赤氷①　　　　　赤氷②|エラプ+他+氷で頭割り
      /p   　風①+他  風②+他　   |風：南で竜がすれ違う前にぶつかる
      /p ----------------------------------
      /p ④　　　① |青デバフ：attack meマクロ
      /p 　③　②　 |2人同時に押して付かなかった場合はもう1回押す
      /p ■リターン置き(南北波が来た方に全員寄る)
      /p 左前：MT/右前：ST/中央少し前：他
      /p ■テイカー散開⇒波が来た南北基準で基本散開(タンクはAを避けて外周側に)
      /p リターン残り5秒で軽減、残り2秒でアムレン
      /p ※バリア＆軽減3枚以上必要[動画ではレンジ,BH,PH(無いならタンク)軽減]
  - source: りりーどーる (P5 - ぬけまる最終フェーズ)
    url: https://ffxiv.link/0122122
    text: |-
      /p P5最終フェーズ(ぬけまる)
      /p 【光塵の剣】
      /p アクモーン(ボス基準)：MT組左/ST組右
      /p 【パラダイスリゲインド】1個目の塔を6時として見る
      /p 塔踏み(スプリント)
      /p H⇒6時塔/D12⇒待機場所じゃない方の塔/D34⇒待機場所の塔
      /p 光先：MT→6時塔真逆(12時)で受けてボス真下で線処理
      /p 　　　ST→4時で離れて線処理
      /p 闇先：MT→6時塔真逆(12時)で受けて離れて線処理
      /p 　　　ST：ボス真下(8時寄り)で線処理
      /p 【星霊の剣】※先頭で受けた後以降反対側で受ける
      /p スタート時(ボス基準)：左下MT組/右下ST組
      /p 先頭受け：T→D12→D34→H
      /p 【パンドラの櫃】タンクLB3
      /p 詠唱バー「パン[ﾀﾝｸLB]ドラの櫃」目安
recruitmentTemplates:
  - template: |-
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}

      ▼固定の目標
      ● {{goal}}
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}    # 例: ぬけまる式トレース、リリド式 etc

      ▼必須事項
      {{requirements}}

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle
