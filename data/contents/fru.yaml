# ────────────────────────────────────────────────────────
# 軽減表メモ
# ────────────────────────────────────────────────────────
# Last Agous (らすと) の軽減表は全Phaseを1シートで扱うため P1 の mitigation
# にぶら下げている。将来的に Phase 毎にシートが分かれた場合は P2-P5 にも
# 個別の mitigation を付与すること。
