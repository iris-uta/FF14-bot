# マクロ (コピペ用)
# ────────────────────────────────────────────────────────
macros:
  - source: Game8 (ゲームエイト) - 天獄編零式1層 マクロ Ver1.1 (無職マラソン式)
    url: https://game8.jp/ff14/532345
    # Source: WebFetch 2026-05-25 (Game8 P9S 攻略ページ Ver1.1)
    # 注: Game8 にはマクロ前半のみ抽出されており、後半 (ビースト以降) は要動画確認の場合あり。
    text: |
      /p ■基本散開　　　　■ペア十字(X字反時計回り)
      /p D3 MT D4　　 　　　　 　MT/D3
      /p H1 ★ H2 　　 　 　H1/D1　★　H2/D4
      /p D1 ST D2　 　　　　 　　 ST/D2
      /p ■古式破砕拳(4:4頭割り)
      /p 西：MTH1D1D3 / STH2D2D4 ：東
      /p ■ジャンブルコンボ(サイコロ1回目)※無職マラソン式
      /p 無職：1壁から進行方向に走り青ついたら止まる
      /p 塔：6→8→2→4の順に処理
      /p 炎：2→4→6→8の順に処理(塔から進行方向に45度ずれる)
      /p ■ビーストフェーズ
      /p 毒:12時から時計回り DPS＞TH　扇誘導:TH→D
      /p ■キメリック(サイコロ２回目)
      /p 1→東　2→西　3,4→北　無職→南

