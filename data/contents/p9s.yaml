id: p9s
displayName: パンデモニウム零式：天獄編 1層 (コキュートス)
shortName: P9S
type: savage
patch: "6.41"
phases:
  - id: p1
    name: "P1 コキュートス 通し (Mythic Creation: Kokytos)"
    order: 1
    description: |-
      コキュートス戦。1ボス完結型 (フェーズ分けはしないが、内部的に「メイジ」「マーシャリスト」
      「キメラ」「ビースト」の魂を取り込んで姿を変える展開)。
      主要ギミック:
        - グラトニーズアーガー (全体)
        - デストゥワイス (タンク連続強攻撃)
        - ダブルスペル (魔法×2)
        - 古式地烈斬 (地面範囲)
        - 古式破砕拳 (4:4 頭割り)
        - ジャンブルコンボ (サイコロ1回目、無職マラソン式の山場)
        - ミールストーム (中央吸引)
        - ビーストフェーズ (毒・扇誘導)
        - キメリックコンボ (サイコロ2回目)
        - 憑魔双撃 (フィニッシュ系)
      野良主流: 無職マラソン式 (Game8 採用、ぬけまる動画ベース)。
    videos:
      - title: 【FF14】解説 天獄編零式1層 無職マラソン式【ぬけまる】
        url: https://www.youtube.com/watch?v=rnKHQtYCuAk
        author: ぬけまるG
    tips:
      - ジャンブルコンボ (無職マラソン) はフィールド全体を活用するため、開幕の散開位置・デバフ確認が最重要。
      - 古式破砕拳の 4:4 頭割りは西/東に分かれる。クロスしないよう先に立ち位置を決める。
      - ビーストフェーズの扇誘導は TH→D 順、毒は DPS が先。両者の優先度が逆なので要意識。
macros:
  - source: Game8 (ゲームエイト) - 天獄編零式1層 マクロ Ver1.1 (無職マラソン式)
    url: https://game8.jp/ff14/532345
    text: |-
      /p ■基本散開　　　　■ペア十字(X字反時計回り)
      /p D3 MT D4　　 　　　　 　MT/D3
      /p H1 ★ H2 　　 　 　H1/D1　★　H2/D4
      /p D1 ST D2　 　　　　 　　 ST/D2
      /p ■古式破砕拳(4:4頭割り)
      /p 西：MTH1D1D3 / STH2D2D4 ：東
      /p ■ジャンブルコンボ(サイコロ1回目)※無職マラソン式
      /p 無職：1壁から進行方向に走り青ついたら止まる
      /p 塔：6→8→2→4の順に処理
      /p 炎：2→4→6→8の順に処理(塔から進行方向に45度ずれる)
      /p ■ビーストフェーズ
      /p 毒:12時から時計回り DPS＞TH　扇誘導:TH→D
      /p ■キメリック(サイコロ２回目)
      /p 1→東　2→西　3,4→北　無職→南
