# パンデモニウム零式：天獄編 1層 - コキュートス (P9S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 P9S (Pandæmonium Anabaseios Ninth Circle Savage)、
#   Game8 / JP コミュニティでは「天獄編1層」「天獄1」が一般的。
# - ボス正式名称: 「コキュートス」(Kokytos / 希: Κωκυτός)
#   暁月のフィナーレ・万魔殿パンデモニウム最終 tier (天獄編) の第1戦。
# - 実装パッチ: 6.41 (零式)、6.4 (ノーマル)
#   ノーマル実装日: 2023-05-23 (Patch 6.4 「玉座の咎人」)
#   零式実装日:   2023-05-30 (1週間後)
# - Game8 マクロ Ver1.1 (2023年中盤改訂版) を基準とする。
#   流派: 「無職マラソン式」(ぬけまる様の動画ベース)
# - 本ファイルは Game8 (https://game8.jp/ff14/532345) から WebFetch (2026-05-25) で取得。

id: p9s
displayName: パンデモニウム零式：天獄編 1層 (コキュートス)
shortName: P9S
type: savage
patch: "6.41"
# Source: https://ffxiv.consolegameswiki.com/wiki/Anabaseios:_The_Ninth_Circle_(Savage)
# Source: https://finalfantasy.fandom.com/wiki/Anabaseios:_The_Ninth_Circle
# Source: https://next-innovation-fuk.com/2023/05/29/ff14-%E3%83%91%E3%83%83%E3%83%816-4x-%E3%80%8C%E9%9B%B6%E5%BC%8F%E3%80%8D%E4%B8%87%E9%AD%94%E6%AE%BF%E3%83%91%E3%83%B3%E3%83%87%E3%83%A2%E3%83%8B%E3%82%A6%E3%83%A0%E9%9B%B6%E5%BC%8F%EF%BC%9A%E5%A4%A9/

phases:
  - id: p1
    name: "P1 コキュートス 通し (Mythic Creation: Kokytos)"
    order: 1
    description: |
      コキュートス戦。1ボス完結型 (フェーズ分けはしないが、内部的に「メイジ」「マーシャリスト」
      「キメラ」「ビースト」の魂を取り込んで姿を変える展開)。
      主要ギミック:
        - グラトニーズアーガー (全体)
        - デストゥワイス (タンク連続強攻撃)
        - ダブルスペル (魔法×2)
        - 古式地烈斬 (地面範囲)
        - 古式破砕拳 (4:4 頭割り)
        - ジャンブルコンボ (サイコロ1回目、無職マラソン式の山場)
        - ミールストーム (中央吸引)
        - ビーストフェーズ (毒・扇誘導)
        - キメリックコンボ (サイコロ2回目)
        - 憑魔双撃 (フィニッシュ系)
      野良主流: 無職マラソン式 (Game8 採用、ぬけまる動画ベース)。
    # Source: https://game8.jp/ff14/532345
    videos:
      - title: 【FF14】解説 天獄編零式1層 無職マラソン式【ぬけまる】
        url: https://www.youtube.com/watch?v=rnKHQtYCuAk
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/532345) で参照されている主流動画
    strategies:
      - id: musyoku-marathon
        name: 無職マラソン式 (Game8 採用版 / ぬけまる動画ベース)
        description: |
          Game8 が採用しているぬけまる動画ベースの処理法。「無職マラソン式」
          (jobless marathon) と呼ばれる。
          - 基本散開: D3/MT/D4 // H1/★/H2 // D1/ST/D2
          - ペア十字 (X字反時計回り): MT/D3, ST/D2, H1/D1, H2/D4
          - 古式破砕拳: 4:4 頭割り、西 MTH1D1D3 / 東 STH2D2D4
          - ジャンブルコンボ (サイコロ1回目):
            * 無職 (デバフ無し) は 1壁 (西) から進行方向に走り、青AoE が
              ついたら止まる (= マラソン式の語源)
            * 塔は 6→8→2→4 の順で処理
            * 炎は 2→4→6→8 (塔から進行方向に45度ずれる)
          - ビーストフェーズ: 毒は 12時から時計回り、優先順 DPS > TH
            扇誘導は TH→D の順
          - キメリックコンボ (サイコロ2回目): 1→東 / 2→西 / 3,4→北 / 無職→南

