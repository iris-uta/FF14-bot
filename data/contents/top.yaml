id: top
displayName: 絶オメガ検証戦
shortName: TOP
type: ultimate
patch: "6.31"
phases:
  - id: p1
    name: P1 オメガ (Omega) - サークルプログラム / パンクラ
    order: 1
    popularStrategy: 南集合・北11.5時から時計回り (H1MTSTD1D2D3D4H2)
    description: |-
      開幕フェーズ。ビートル形態のオメガ。
      主要ギミック: サークルプログラム (塔踏み・線とり・線捨て)、
      パントクラトル (ミサイル/頭割り)、波動砲 (T無敵 / 7方向散開)、
      Atomic Ray (時間切れ)。
      野良主流は「南集合・北11.5時から時計回り (H1MTSTD1D2D3D4H2) 」。
    videos:
      - title: 【FF14/絶解説】絶オメガフェーズ1 さらっとアニメーション解説【ぬけまる】修正
        url: https://www.youtube.com/watch?v=vcQizvMjSio
        author: ぬけまるG
      - title: 【FF14】パントクラトル 完全解説【絶オメガ検証戦 フェーズ１】
        url: https://www.youtube.com/watch?v=3Xa4Sdc76KA
      - title: 【FF14/イメトレ用】絶オメガ パンクライメトレまとめ
        url: https://www.youtube.com/watch?v=5okMJ8LzxlE
        author: ぬけまるG
      - title: 【FF14/イメトレ用】絶オメガ サークルプログラムイメトレまとめ
        url: https://www.youtube.com/watch?v=J0uBb7Xe9oQ
        author: ぬけまるG
      - title: 【絶オメガ】文字を読みたくない人のための絶オメガＰ１【解説】
        url: https://www.youtube.com/watch?v=GABEtFVcn58
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (絶オメガ TOP / patch 7.1 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1G10SCv2lJ-42k0bnTduYnBRnOQ5pj9xLs-qMSqJBYb8/edit?usp=sharing
      copyable: true
    tips:
      - パンクラ：ミサイルを捨てに行くときは内周を通り、戻るときは外周から合流。
      - 波動砲はタンク無敵で受け、7方向散開で AoE 処理。
      - ACが綺麗に潰れたときのみ東西配置を使用する。
  - id: p2
    name: P2 オメガM・オメガF (Omega-M / Omega-F)
    order: 2
    popularStrategy: 下から調整・男三人基準で左右組振り分け
    description: |-
      男女形態フェーズ。
      主要ギミック: ファイアウォール、連携プログラム (PT / LB)、
      プレイステーション (ミドル/ファー)、4:4吹き飛ばし、
      シールドバッシュ&フレア、Laser Shower (時間切れ)。
      野良主流は「下から調整・男三人基準で左右組振り分け」。
    videos:
      - title: 【FF14/絶解説】絶オメガフェーズ P2さらっと図解解説【ぬけまる】
        url: https://www.youtube.com/watch?v=bDXXSksWPQo
        author: ぬけまるG
    tips:
      - 連携プログラムLB は線取り (MT→西/ST→東) → 時計回り処理 → 弓LBは全員でボス南誘導。
      - シールドバッシュ&フレアは盾誘導以外の7人で中央集合して頭割り。
  - id: p3
    name: P3 ファイナルオメガ (Final Omega) - コロッサスブロー / ハローワールド
    order: 3
    popularStrategy: 優先TDH (検知式波動砲) / ファー→ニアー線渡し (ハロワ)
    description: |-
      強化版オメガ単体フェーズ。
      主要ギミック: コロッサスブロー、ハローワールド (Hello, World)、
      検知式波動砲 (Oversampled Wave Cannon)、Ion Efflux (時間切れ)。
      野良主流は「優先TDH (検知式波動砲) / ファー→ニアー線渡し (ハロワ) 」。
    videos:
      - title: 【FF14/絶解説】絶オメガP3 ハロワ検知 アニメーション解説 The Omega Protocol P3【ぬけまる】
        url: https://www.youtube.com/watch?v=mj1a2G2TBgk
        author: ぬけまるG
      - title: 【絶オメガ/イメトレ】P3 検知式波動砲 十字式イメトレ【ぬけまる】
        url: https://www.youtube.com/watch?v=eUPGkeg6qCU
        author: ぬけまるG
      - title: 【絶オメガ】文字を読みたくない人のための絶オメガＰ３【解説】
        url: https://www.youtube.com/watch?v=9dyL-nSOJuA
    tips:
      - コロッサスブロー：❶①>H1MTSTD1D2D3D4H2>②❹ の優先度。白＋無職→①②、紫→❶❷❸❹。
      - 検知式波動砲：ボス検知が逆の場合は左右反転。AC縦列(①④⑤)はボスモニターの無い方へ。
  - id: p4
    name: P4 ブルースクリーン (Damaged Omega / Blue Screen)
    order: 4
    popularStrategy: 下調整・D1D2人数調整
    description: |-
      ダメージを受けた状態のオメガ。
      主要ギミック: 波動砲 (3 iterations)、Wave Repeater、
      ブルースクリーン (DPSチェック付き時間切れ)。
      野良主流は「下調整・D1D2人数調整」のシンプル散開。
    videos:
      - title: 【FF14/絶解説】絶オメガP4 ブルースクリーン解説 The Omega Protocol P4【ぬけまる】
        url: https://www.youtube.com/watch?v=ayGtjf0__0k
        author: ぬけまるG
      - title: 【絶オメガ】ブルースクリーンをひたすら見る動画【P4】
        url: https://www.youtube.com/watch?v=rPa6ei-fgJs
        author: ぬけまるG
    tips:
      - P4 は短いがDPSチェックがシビア。バフ回しと軽減を P3 から準備しておく。
      - 実質 P4 はブルースクリーン耐えのフェーズ。タンクLBやヒーラーLBの可能性も考慮。
  - id: p5
    name: P5 ラン：ディナミス (Run:Dynamis) - デルタ / シグマ / オメガ
    order: 5
    popularStrategy: デルタ：ハムカツ式 / シグマ：りょんめ式 (塔Wingwan) / オメガ：ぬけまる式
    description: |-
      オメガM/オメガFの2体ディナミスフェーズ。
      コード「＊＊＊ミ＊」の3パターン (デルタ / シグマ / オメガ) を順次処理。
      ロケパン、アーム&バッシュ誘導、ハロワ散開、塔踏み、
      Solar Ray (タンクバスター)、Quickening Dynamis スタック蓄積、
      Blind Faith (時間切れ) を含む。
      野良主流は「デルタ：ハムカツ式 / シグマ：りょんめ式 (塔Wingwan) / オメガ：ぬけまる式」。
    videos:
      - title: 【FF14/絶解説】絶オメガP5 コード:＊＊＊ミ＊【デルタ】 アニメーション解説 The Omega Protocol P5【ぬけまる】
        url: https://www.youtube.com/watch?v=vg_AEbdn2zM
        author: ぬけまるG
      - title: 【FF14/絶解説】絶オメガP5 コード:＊＊＊ミ＊【シグマ】注意点追加版 アニメーション解説 The Omega Protocol P5【ぬけまる】
        url: https://www.youtube.com/watch?v=3x-_d8RZJXE
        author: ぬけまるG
      - title: 【FF14/絶解説】絶オメガP5 コード:＊＊＊ミ＊【オメガ】 アニメーション解説 The Omega Protocol P5-3【ぬけまる】修正版
        url: https://www.youtube.com/watch?v=6LIXoAk7wrI
        author: ぬけまるG
      - title: 【FF14】絶オメガ検証戦 ランデュナミス解説 フェーズ5 (さらちゃんのつぶやき)
        url: https://sarachantubuyaki.jp/finalfantasyxiv/run-dynamis/
      - title: 【絶オメガ】文字を読みたくない人のためのP5オメガ【解説】
        url: https://www.youtube.com/watch?v=316MZKSBXdc
    tips:
      - P5 デルタ：散開位置は言語化して共有、移動タイミングはデバフの数字で判断。
      - P5 シグマ：塔の多いほうを北として、散開時の自分のマーカー位置の塔に入る。
      - P5 オメガ：オメガFを基準として、③④★は回転方向で左右反転あり。
  - id: p6
    name: P6 アルファオメガ (Alpha Omega)
    order: 6
    description: |-
      最終フェーズ。Quickening Dynamis スタック3個必須。
      主要ギミック: コスモメモリー (タンクLB3)、フラッシュゲイル、
      コスモアロー、コスモダイブ、Unlimited Wave Cannon (リミッターカット)、
      波動砲、コスモメテオ (DPS LB必要)、マジックナンバー (タンク&ヒーラーLB)。
      時間切れ Run: ◆◆◆◆mi◆。
    videos:
      - title: 【FF14/絶解説】絶オメガ最終P6 アルファオメガ 軽減付アニメーション解説 The Omega Protocol P6【ぬけまる】最新
        url: https://www.youtube.com/watch?v=2u_I9zYh2j4
        author: ぬけまるG
    tips:
      - コスモメモリー：LB3 は ST が打つ。
      - 1回目波動砲：中央集合→1回目エクサフレア安置側マーカーに向かって AoE 捨て。
      - マジックナンバー：LB3 順は MT→H1→ST→H2。
      - コスモメテオ：頭割り基本A集合、D3フレア時はC集合。
