      /p 【ヴァンプストンプ】
      /p 　D3　 MT 　 D4　近：コウモリ1後
      /p 　 　 D1 　D2
      /p 　H1　 ST　　H2
      /p 【エーテルレッティング】
      /p 　 　MT　D4 　 　 最外周扇間捨て
      /p 　D3　　 　 H2 　 中央安置集合
      /p 　H1　　 　 D2
      /p 　 　D1　ST
      /p 【茨塔】 北から時計回り　T＞近＞遠＞H
      /p 《ロール》　 《頭割り》
      /p 　 塔 塔 　 　　 塔 塔
      /p 　D ★ H　 　 　 ★
      /p 塔　 T　塔　 塔　全　塔
      /p 【バットデスマッチ】北西:MT組 南東:ST組
