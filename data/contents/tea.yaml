id: tea
displayName: 絶アレキサンダー討滅戦
shortName: TEA
type: ultimate
patch: "5.11"
phases:
  - id: p1
    name: P1 リビングリキッド (Living Liquid)
    order: 1
    popularStrategy: ヤークト無視 (20秒バースト) + サイコロ 1211
    description: |
      開幕フェーズ。リビングリキッド (本体) と頭手 (Liquid Hand / Hand of Prayer/Parting) を相手取る。
      主要ギミック: プロティアンウェイブ、ハンドオブペイン、ジャグドール、ドレナージ、
      圧壊 (Pressurize/Embolus)、スプラッシュ、スルース、サイコロ (Throttle - 1/2/3/4 番号デバフ)。
      野良主流は「ヤークト無視 (20秒バースト) + サイコロ 1211」。
      時間切れ 2分20秒だがヤークト無視では 1分9秒以内に本体だけ削り切る。
    videos:
      - title: 【FF14/濃厚解説】絶アレキ討滅戦 リキッドセパレ式 サイコロ44と1211【ぬけまる】Re
        url: https://www.youtube.com/watch?v=AMdtMyvbPNs
        author: ぬけまるG
        phase: p1
      - title: FF14 みんとのギミック解説 絶アレキサンダー討滅戦 リキッド&サイコロ編 (だいたいセパレ 4:4)
        url: https://www.youtube.com/watch?v=a_D-UFcMiYU
        phase: p1
      - title: FF14 絶アレキ サイコロフェーズ 1211式 イメトレ用 ポイント解説付き
        url: https://www.youtube.com/watch?v=BSTvYXvM1ls
        phase: p1
      - title: 【絶アレキサンダー】リキッドフェーズ【解説動画】
        url: https://www.youtube.com/watch?v=j8taILNR6-g
        phase: p1
      - title: 【絶アレキサンダー討滅戦】饅頭でも分かるリビングリキッド徹底解説【ゆっくり実況プレイ/FF14】
        url: https://www.youtube.com/watch?v=o4PCuw7FS70
        phase: p1
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (絶アレキ TEA / patch 7.0 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1B2hdvvofSn2oEKHygcEU7Knsf3bdq93jUIuyQDyhvQ0/edit?usp=sharing
      copyable: true
    strategies:
      - id: yarkt-mushi-20
        name: ヤークト無視 (20秒バースト / 野良主流)
        description: |
          リキッドフェーズ 2分20秒の時間切れを 1分9秒以内に本体だけ全力で殴り切る手法。
          HP均等化を行わず、ペイン大ダメージを軽減とバリアで耐える。
          ふうcだよが図解＋解説動画でまとめている派生も含む。野良の現在主流。
        popular: false
      - id: dice-1211
        name: サイコロ 1211 (野良主流)
        description: |
          サイコロ (Throttle) 1番→2番→1番→1番 の順で爆発位置を踏み替えていく処理。
          東西スタートの場合は東側優先。1211式 = 最初の爆発中心を通る線を0本目として、
          1本先 / その2本先 / さらに1本先 / さらに1本先で処理する命名。
        popular: false
      - id: dice-44-separate
        name: サイコロ 4:4 セパレ式 (派生)
        description: |
          ぬけまる「リキッドセパレ式」動画で解説される 4:4 分割の派生処理。
          1211 より遭遇率は低いが固定で採用するケースあり。
        popular: false
    tips:
      - ヤークト無視はペインのダメージ大かつブレが大きいので、軽減を絶対切らさない。
      - 可視扇 (プロティアン) は D3 が誘導、不可視扇は D4 担当が標準。
      - サイコロ 1211 は中央ピザ (フィールド8等分) を踏み替えていくため自分の番号位置を即座に判断。
  - id: p2
    name: P2 ブルートジャスティス & クルーズチェイサー (2体フェーズ)
    order: 2
    popularStrategy: ヒラ先 (Healer-priority Nisi渡し) + サイコロ番号配置
    description: |
      ジャスティス＋チェイサーの2体フェーズ。間に Limit Cut (アルファソード / スーパーブラスティチャージ /
      ホークブラスター) を挟む。
      主要ギミック: 初期散開チャクラム、雷・水圧縮 (1〜3回目)、ミサイル全弾発射、
      カウント・地雷処理、ナイサイ (Judgment Nisi)、最後の審判 (開廷/結審)、
      ロケットパンチ&スーパージャンプ、Verdict (時間切れ)。
      野良主流は「ヒラ先 (Healer-priority Nisi渡し) + サイコロ番号配置」。
    videos:
      - title: 【FF14/濃厚解説】絶アレキ討滅戦 2体フェーズ 5ジョブ視点有【ぬけまる】
        url: https://www.youtube.com/watch?v=yuLjtpm2ti8
        author: ぬけまるG
        phase: p2
      - title: 【FF14】2体フェーズ ギミック解説【絶アレキサンダー討滅戦】
        url: https://www.youtube.com/watch?v=xl7jU2EmmaE
        phase: p2
    strategies:
      - id: nisi-hira-saki
        name: ナイサイ ヒラ先渡し (野良主流)
        description: |
          ナイサイ (Judgment Nisi) 受け渡しを「ヒラが先に渡してから DPS が処理」する流派。
          1回目DPS反時計受け渡し、3回目は一列 (A｝MT・D1・D3・D4・D2・ST｛C)、
          4回目はタンヒラが先に並ぶ (MT・H1・H2・ST｛氷)。
        popular: false
      - id: super-jump-d3-yuudou
        name: スーパージャンプ D3 誘導 (野良主流)
        description: |
          スーパージャンプ誘導を D3 が担当する標準処理。地雷は D3:5時 / ST:6時 配置。
        popular: false
    tips:
      - サイコロ番号順に散開 (西H1 → 西D3D4D2D1東) で雷散開を綺麗に作る。
      - ヒラ先渡しは1回目 DPS が反時計で受け渡す手順を体に覚えさせる。
      - Limit Cut (P1とP2の間) は数字順にスタンを撃ち抜くシンプル処理。
  - id: p3
    name: P3 アレキサンダー・プライム (Alexander Prime / プライムフェーズ)
    order: 3
    popularStrategy: ぬけまる/ハムカツ式 34固定 + 時間停止 脳死法
    description: |
      アレキサンダー・プライム単体の準ラスフェーズ。
      主要ギミック: チャステイニングヒート (Chastening Heat / TB)、ディヴァインスピア、
      メガホーリー、時間停止 (Temporal Stasis)、時空潜航のマーチ (Inception)、
      次元断絶のマーチ (Wormhole)、サモン・アレキサンダー (Summon Alexander)。
      野良主流は「ぬけまる/ハムカツ式 34固定 + 時間停止 脳死法」。
    videos:
      - title: 【FF14/濃厚解説】絶アレキ討滅戦 プライムフェーズ ハムカツさん34固定方式 各視点有【ぬけまる】
        url: https://www.youtube.com/watch?v=3wtfeXognIY
        author: ぬけまるG
        phase: p3
    strategies:
      - id: jikan-teishi-nooshi
        name: 時間停止 脳死法 (野良主流)
        description: |
          時間停止 (Temporal Stasis) を「無印→左側ロボ、緑線→右側ロボ、青線TH左/青線D右、
          雷→ジャスの側面」で機械的に処理する脳死法。
          ジャス左側/右側で散開図がミラー反転する。
        popular: false
      - id: dansetsu-hamukatsu-34-kotei
        name: 断絶 ハムカツ式 34固定 (野良主流)
        description: |
          次元断絶のマーチを「ハムカツさん34固定方式」で処理する流派。
          ぬけまる「ハムカツさん34固定方式 各視点有」動画で詳細解説。
          懴悔順は 5,6 → 7,8 → 1,2。
        popular: false
    tips:
      - "時空潜航のマーチ: ラピス 1→①, 2→②, 3→③, 4→④。火炎放射は プライム側6人/中央MT/真心側ST。"
      - "次元断絶のマーチ: マップ基準A北で 北MTST / H1H2南、北←D1D2D3D4→南 (デバフ無DPSは抜ける)。"
      - プライムフェーズはバーストとタイムライン暗記が要。固定でPTメンバーごとの担当を明文化。
  - id: p4
    name: P4 パーフェクト・アレキサンダー (Perfect Alexander / 最終パレキフェーズ)
    order: 4
    popularStrategy: ぬけまる式 + 未来観測 北/南頭割り
    description: |
      最終フェーズ。3体融合したパーフェクト・アレキサンダー。
      主要ギミック: 確定判決 (The Final Word)、運命の輪 (Ordained Motion / Stillness)、
      光学式波動砲 (Optical Sight)、聖なる大審判 (Almighty Judgment)、
      未来観測 α/β (Fate Calibration α/β)、時空干渉 (Temporal Prison)、
      抑圧の懲罰 (Ordained Capital Punishment)、強制的引力 (Irresistible Grace)。
      野良主流は「ぬけまる式 + 未来観測 北/南頭割り」。
    videos:
      - title: 【FF14/濃厚解説】絶アレキ討滅戦 最終パレキフェーズ【ぬけまる】
        url: https://www.youtube.com/watch?v=9YgDXyUWbiQ
        author: ぬけまるG
        phase: p4
      - title: 【絶アレキ】パーフェクトアレキサンダーフェーズ【解説】
        url: https://www.youtube.com/watch?v=dXZBMPY9gjE
        phase: p4
      - title: 【FF14/解説】誰でもわかる 最終フェーズ 図解 ゆっくり音声付 絶アレキサンダー討滅戦【再掲載】
        url: https://www.youtube.com/watch?v=XR9IFP647oI
        phase: p4
    strategies:
      - id: mirai-kansoku-alpha-beta
        name: 未来観測 α/β 北南頭割り (野良主流)
        description: |
          未来観測 α/β を「黄親→北頭割り / 紫親→南頭割り」で処理する流派。
          α: ボス側安置=名誉罰 / 対面側安置=左集団罰+他, 右加重罰。
          β: 接触保護(黄親)→北寄り北西, 接触禁止(黄子)→2左上, 等の細かい配置あり。
        popular: false
      - id: kakutei-hanketsu-kihon
        name: 確定判決 基本散開 (野良主流)
        description: |
          確定判決を「黄親→4 / 紫親→2 / 他6人→2左側」で処理。
          頭割り TH北/DPS南、散開は MT ST / H1 H2 / D3 D1 D2 D4 配置。
        popular: false
    tips:
      - 確定判決はデバフの色 (黄/紫) と親/子の判別を最優先。
      - 未来観測 β は配置パターンが多いので、自分のデバフごとの安置を事前にカンペ化。
      - Wave Cannon (光学式波動砲) との重複処理あり。タイムラインで先回り。
