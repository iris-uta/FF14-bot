id: tea
displayName: 絶アレキサンダー討滅戦
shortName: TEA
type: ultimate
patch: "5.11"
phases:
  - id: p1
    name: P1 リビングリキッド (Living Liquid)
    order: 1
    popularStrategy: ヤークト無視 (20秒バースト) + サイコロ 1211
    description: |-
      リビングリキッド (本体) とハンドを相手取る。
      主要ギミック: プロティアンウェイブ、ハンドオブペイン、サイコロ。
      野良主流は「ヤークト無視 (20秒バースト) + サイコロ 1211」。
      時間切れ 2分20秒だがヤークト無視では 1分9秒以内に本体だけ削り切る。
    videos:
      - title: P1 リビングリキッド（ヤークト無視）解説【ふうcだよ】
        url: https://www.youtube.com/watch?v=mxy_ZYEYwlE&t=3s
        author: ふうｃだよ
      - title: P1 リビングリキッド（サイコロフェーズ）解説【ぬけまる】
        url: https://youtu.be/AMdtMyvbPNs?si=1bpCn66GIcS1Wqlw&t=1037
        author: ぬけまるG
    mitigation:
      name: Last Agous / らすと 軽減表スプレッドシート (絶アレキ TEA / patch 7.0 対応, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1B2hdvvofSn2oEKHygcEU7Knsf3bdq93jUIuyQDyhvQ0/edit?usp=sharing
      copyable: true
    tips:
      - ヤークト無視はペインのダメージ大かつブレが大きいので、軽減を絶対切らさない。
      - 可視扇 (プロティアン) は D3 が誘導、不可視扇は D4 担当が標準。
      - サイコロ 1211 は中央ピザ (フィールド8等分) を踏み替えていくため自分の番号位置を即座に判断。
  - id: p2
    name: P2 ブルートジャスティス & クルーズチェイサー (2体フェーズ)
    order: 2
    popularStrategy: ヒラ先
    description: |-
      ジャスティス＋チェイサーの2体フェーズ。
      主要ギミック: 初期散開チャクラム、雷・水圧縮 (1〜3回目)、ミサイル全弾発射、
      カウント・地雷処理、ナイサイ 、最後の審判 (開廷/結審)、
      ロケットパンチ&スーパージャンプ。
      野良主流は「ヒラ先渡し」。
    videos:
      - title: P2 2体フェーズ解説【ぬけまる】
        url: https://youtu.be/yuLjtpm2ti8?si=s06vqJPX5VB10aPR
        author: ぬけまるG
    tips:
      - サイコロ番号順に散開 (西H1 → 西D3D4D2D1東) で雷散開を綺麗に作る。
      - ヒラ先渡しは1回目 DPS が反時計で受け渡す手順を体に覚えさせる。
      - Limit Cut (P1とP2の間) は数字順にスタンを撃ち抜くシンプル処理。
  - id: p3
    name: P3 アレキサンダー・プライム (Alexander Prime / プライムフェーズ)
    order: 3
    popularStrategy: ハムカツ式 34固定 + 時間停止 脳死法
    description: |-
      アレキサンダー・プライム単体の準ラスフェーズ。
      主要ギミック: 時間停止、時空潜航のマーチ 、次元断絶のマーチ。
      野良主流は「ハムカツ式 34固定 + 時間停止 脳死法」。
    videos:
      - title: P3 プライムフェーズ解説【ぬけまる】
        url: https://youtu.be/3wtfeXognIY?si=905JsYF7OMv-5_qh
        author: ぬけまるG
    tips:
      - "時空潜航のマーチ: ラピス 1→①, 2→②, 3→③, 4→④。火炎放射は プライム側6人/中央MT/真心側ST。"
      - "次元断絶のマーチ: マップ基準A北で 北MTST / H1H2南、北←D1D2D3D4→南 (デバフ無DPSは抜ける)。"
      - プライムフェーズはバーストとタイムライン暗記が要。固定でPTメンバーごとの担当を明文化。
  - id: p4
    name: P4 パーフェクト・アレキサンダー (Perfect Alexander / 最終パレキフェーズ)
    order: 4
    description: |-
      最終フェーズ。3体融合したパーフェクト・アレキサンダー。
      主要ギミック: 確定判決 、未来観測 α/β
    videos:
      - title: P4 パーフェクトアレキサンダー解説【ぬけまる】
        url: https://youtu.be/9YgDXyUWbiQ?si=g63xrfP-nJre3pxS
        author: ぬけまるG
    tips:
      - 確定判決はデバフの色 (黄/紫) と親/子の判別を最優先。
      - 未来観測 β は配置パターンが多いので、自分のデバフごとの安置を事前にカンペ化。
      - Wave Cannon (光学式波動砲) との重複処理あり。タイムラインで先回り。
