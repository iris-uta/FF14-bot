recruitmentTemplates:
  - source: Rage Avel - Lodestone「固定募集記事テンプレート（コピペ用）」(fru.yaml / top.yaml と共通)
    template: |
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}

      ▼固定の目標
      ● {{goal}}
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}    # 例: ぬけまる/ヤ無視20/1211/ヒラ先/時間停止脳死/断絶34固定 etc

      ▼必須事項
      {{requirements}}

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle
