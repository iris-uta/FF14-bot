id: m6s
displayName: 至天の座アルカディア：クルーザー級零式 2層 (シュガーライオット)
shortName: M6S
type: savage
patch: "7.2"
phases:
  - id: p1-front
    name: P1 シュガーライオット 前半 (ボス〜砂漠フェーズ)
    order: 1
    description: |-
      シュガーライオット 前半。スプレーガンで描いたアートを具現化させる戦闘。
      主要技:
        - カラーライオット
        - ウイングマーク
        - ダブルグラフィティ
        - ねばねばムース (基本散開: 北基準、Tボス下)
        - ランドスケープ
        - カラークラッシュ (2:2:2:2 配置)
        - 砂漠フェーズ: サボテン避け、サボテン+流砂、爆弾捨て (流砂北基準)
      野良主流: Game8 採用版 (新FFO式 Ver.3.1)。
    videos:
      - title: 世界一わかりやすいアルカディア零式クルーザー級2層解説【game8準拠】【FF14黄金】
        url: https://www.youtube.com/watch?v=RWt1GQzv-fU
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア クルーザー級:零式 [1-4層対応])
      url: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5540581/
      copyable: true
    tips:
      - 雑魚フェーズが本層最大の難所。情報不足だと野良では事故りやすい (さり氏談)。
      - ねばねば配置は北基準。Tがボス下なので、誤って T も外周に行くと事故。
      - "PT構成: 赤魔→賢者、ヴァイパー導入で雑魚フェーズ対応が安定 (さり氏 活動録より)。"
  - id: p2-back
    name: P2 シュガーライオット 後半 (山川 〜 時間切れ)
    order: 2
    description: |-
      雑魚フェーズ後の後半。山川 (山と川のフィールド) ギミック。
      主要技:
        - 山川 (火・雷)
        - 雷雲 (TH←左 / 他DPS→右)
        - 雷 (基本散会)
        - マグマ (北 H1H2 / 南 D3D4 → MT/ST/D1/D2)
        - 塔処理 2回目: 4・2・2 or 南8塔 (構成によって配置変動)
      野良主流: Game8 後半マクロ (Lucrezia 様動画準拠)。
    tips:
      - "山川火: 内側 MTH1D1D2 / 外側 STH2D3D4。"
      - "雷雲: 雷雲を見て、TH 左 / 他DPS 右に散開。"
      - 塔2回目は 4・2・2 配置 (近接4人基準で時計/反時計) or 南8塔。マクロ図参照。
macros:
  - source: Game8 (ゲームエイト) - クルーザー級零式2層 新FFO式 Ver.3.1 (前半 + 雑魚)
    url: https://game8.jp/ff14/681086
    text: |-
      /p ■基本散開:ねばねば(北基準、Tボス下)■カラークラッシュ（2:2:2:2）
      /p 　 D3 D4　 　 | 　 　 　　 ボス
      /p H1　☆　H2　| 　H1D3　MTD1　　STD2
      /p 　 D1 D2 　 　|　　　　　 H2D4　4:4は←MT組ST組→
      /p ■砂漠フェーズ
      /p 　〇サボテン避け（北で避ける）〇サボテン+流砂（北基準）
      /p 　　　 6人 　　 　｜　　北西H1　北東6人
      /p 　T 　　　　D 　　｜　　予備　　 南東H2
      /p 　〇爆弾捨て（流砂北）
      /p H1/D3 MT/D1 ST/D2 H2/D4
      /p ■雑魚フェーズ（倒す順：ジャバ＞キャット＞フェザー＞ムー＞ヤーン）※リキャバースト
      /p wave1：MTムー　ST＋近接ヤーン（リキャバーストで処理）　遠隔キャット　ヤーンの場所に遠隔ヒラ集合
      /p wave2：D側フェザーD3　B側フェザーH2　北から捨てる　MTムーを東→西フェザーへ誘導　他全員で範囲焼き
      /p wave3：ジャバ＋ムー行進(スタン：MT→D1→D2)　STヤーン北東待機　バインドヒラ南東
      /p wave4：MTムーC　STヤーンA(スタン：ST→D1→D2)　D側フェザーD3　B側フェザーD4　南から捨てる
  - source: "Game8 (ゲームエイト) - クルーザー級零式2層 新FFO式 Ver.3.1 (後半: 山川〜)"
    url: https://game8.jp/ff14/681086
    text: |-
      /p 【山川】火：内側MTH1D1D2　【雷雲】雷雲見て
      /p 　　　　　　 外側STH2D3D4　　TH←左　他　右→DPS
      /p 雷：基本散会
      /p 【マグマ】ーーーーーー【塔2回目】ーーーーーー
      /p D3D4　北　H1H2　 ◎4・2・2の場合：近接4人基準時計or反時計
      /p ※※※※※※※※※※ 　中央見て左←【D1MTSTD2】【H1H2】【D3D4】→右
      /p 　　 MT　　ST　　　　◎南８塔の場合：H1　H2　D3　D4
      /p 　　 D1　 　D2　　　　　　　　　　　 D1　 MT　 ST 　D2
