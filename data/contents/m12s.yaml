# 至天の座アルカディア：ヘビー級零式 4層 - リンドブルム (M12S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 M12S、Game8/JP では「ヘビー級零式4層」「アルカディア零式4層」。
# - 公式ボス名: 「リンドブルム」(本作 Heavyweight 最終ボス)。
# - 4層は前半 (Part1) と後半 (Part2) の2部構成で実装。
#   * 前半: 細胞付着ギミックメイン (リーサルスカージ等)
#   * 後半: アルカディアンドリーム (3分以上の長大ギミック) メイン
# - Game8 後半ページにはマクロ本文が直接掲載されておらず「ぬけまる動画リンクから」
#   という案内のみ。本ファイルではぬけまる動画 + Lodestone Sr Odin 改良版マクロを参照。

id: m12s
displayName: 至天の座アルカディア：ヘビー級零式 4層 (リンドブルム)
shortName: M12S
type: savage
patch: "7.4"
# ノーマル実装日: 2025-12-16 / 零式実装日: 2026-01-06
# Source: https://ffxiv.consolegameswiki.com/wiki/The_Arcadion
# Source: https://leprestore.com/guides/ffxiv/arcadion-heavyweight/

phases:
  - id: p1
    name: P1 リンドブルム 前半 (細胞付着フェーズ) — M12S Part 1
    order: 1
    description: |
      Part 1 (前半)。細胞付着ギミックがメイン。
      主要技:
        - リーサルスカージ (玉誘導、D側:MT組 / B側:ST組)
        - 細胞付着・前期 (左前タゲサ端で散開、頭割り:角扇外周)
        - 細胞付着・中期 (線取り:1234 / 塔踏み:3412)
        - 細胞付着・後期 (細胞中央向け、X字/十字判断)
        - 細胞付着・終期 (AoE 左上から外周沿い捨て)
        - スローターシェッド (頭割り＆散開＆半面攻撃判定)
      野良主流: ぬけまる様式 (ほぼイディル式) - Game8 採用。
    # Source: https://game8.jp/ff14/756439
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア ヘビー級:零式 / 全層, Patch 7.4 対応)
      # M9S-M12S 全層を 1 ブックで管理。詳細は M9S を参照。
      # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5642585/
      url: https://docs.google.com/spreadsheets/d/1mSfKgAq1RwXLG3IdL6tgIk8SHtdtOI1utXQkWr-iOq0/edit?usp=sharing
      copyable: true
    videos:
      - title: 【FF14】ほぼイディル式 アルカディア：ヘビー級 零式 4層前半 攻略解説 M12S Part1 Guide【ぬけまる】
        url: https://www.youtube.com/watch?v=Tmfv_bbDqQ8
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/756439) で参照されている動画
    strategies:
      - id: nukemaru-idyll-style
        name: ぬけまる様式 (ほぼイディル式) - Game8 採用版
        description: |
          ぬけまる様 + イディル様の解説をベースにした処理法。
          - リーサルスカージ: D側 MT組 / B側 ST組
          - 細胞付着 前期: 左前タゲサ端で散開、頭割り角扇外周
          - 細胞付着 中期: 線取り 1234 / 塔踏み 3412
          - 細胞付着 後期: X字/十字判断で散開位置変更
            X字: DPS右上 TH左下
            十字 東西: DPS右上 TH左下 / 南北: DPS左上 TH右下
          - タン強: 無敵前捨て D側MT/B側ST

  - id: p2
    name: P2 リンドブルム 後半 (アルカディアンドリームフェーズ) — M12S Part 2
    order: 2
    description: |
      Part 2 (後半)。リンドブルム・メテオから始まり、フィールドが浮島×2に変化。
      4 色の塔 (赤/黄/紫/緑) ギミック → アルカディアンドリーム (3 分以上の大ギミック)
      が後半の山場。最終的にアルカディアンドリームを処理しきれば実質クリア。
      主要技:
        - リンドブルム・メテオ (全体大ダメージ、フィールド変化トリガー)
        - 4 色塔ギミック (赤:ヒート / 黄:タケノコ / 紫:ビーム / 緑:?)
        - レプリケーション (位置固定式、Game8 採用)
        - ダブルソバット (タンク強攻撃)
        - 模倣細胞 (牛子式)
        - 変異細胞 + マナスフィア (αβデバフ管理)
        - アルカディアンドリーム (3 分以上、予告遅延型大ギミック、ワンエース式)
      野良主流: Game8 推奨は レプリ:位置固定式 / 模倣:牛子式 / ドリーム:ワンエース式。
    # Source: https://game8.jp/ff14/757988
    # Source: https://nizusiro.com/ff14/heavy-raid-4s/
    videos:
      - title: 【FF14】最新修正版 アルカディア：ヘビー級 零式 4層後半 攻略解説 M12S Part 2 Guide【ぬけまる】
        url: https://www.youtube.com/watch?v=YXxp8nrRw3o
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/757988) で参照されている動画 (最新修正版)
      - title: 【FF14/イメトレ用】アルカディアンドリームをいくつか見る動画 (ヘビー級 零式 4層後半) M12S part2 Image training【ぬけまる】
        url: https://www.youtube.com/watch?v=lF8RJ97UWeo
        author: ぬけまるG
      - title: 【FF14】アルカディア：ヘビー級 零式 4層後半 攻略解説 M12S Part2 Guide【ぬけまる】(初版)
        url: https://www.youtube.com/watch?v=Fl1nPBxcPpM
        author: ぬけまるG
    strategies:
      - id: nukemaru-wanace-game8
        name: Game8 採用版 (レプリ位置固定 / 模倣牛子式 / ドリームワンエース式)
        description: |
          Game8 が採用しているハイブリッド流派。
          - レプリケーション: 位置固定式
          - 模倣細胞: 牛子式
          - アルカディアンドリーム: ワンエース式
          - マクロは Game8 では直接掲載されておらず、ぬけまる動画リンク先からコピーする必要あり。
      - id: nukemaru-improved-srodin
        name: ぬけまる改良版 (Sr Odin 改) - レプリ近接内+レプリ固定法
        description: |
          Sr Odin 氏が公開した「ヘビー級零式4層後半 アルカディアンドリーム用 ぬけまる改良版」。
          ぬけまる動画 (修正版) で追加された
          - レプリ近接内 + レプリ固定法
          - アルカディアンドリーム理屈説明
          - マナバ図修正
          を反映した /e (emote) コール用マクロ。
          確認したい場合は Lodestone を参照。
          # Source: https://na.finalfantasyxiv.com/lodestone/character/39631700/blog/5649775/

# ────────────────────────────────────────────────────────
# マクロ (コピペ用)
# ────────────────────────────────────────────────────────
macros:
  - source: Game8 (ゲームエイト) - ヘビー級零式4層前半 ぬけまる様式
    url: https://game8.jp/ff14/756439
    # 最終更新: 2026-03-12 (Game8 ページの最終更新日)
    # Game8 上では 2 本に分かれて掲載。
    text: |
      /p ■リーサルスカージ　D側:MT組 B側:ST組
      /p H→近→遠→調整役　T/遠調整 (紫T)
      /p ■細胞付着：前期 左前タゲサ端で散開
      /p 〈頭割り:角〉扇外周
      /p 　H1STMT | MTSTH1 Ⅱ D3D2D1｜D1D2D3
      /p 　H2 　 　 ｜　 　 H2 Ⅱ D4　　　｜　　　D4
      /p 〈前期散開/周期散開/線切〉
      /p 北から MT/D1 ＞ ST/D2 ＞ H1/D3 ＞ H2/D4
      /p 〈最後〉元安置HD　反対北MT南STでタン強
      /p ■細胞付着：中期 線取り：1234
      /p 塔踏み：3412
      /p ■細胞付着：後期　細胞中央向け
      /p 〈X字〉 DPS右上 TH左下
      /p 〈十字〉東西：DPS右上TH左下 南北：DPS左上TH右下
      /p 〈タン強〉無敵前捨て：D側MT　B側ST

  - source: Game8 (ゲームエイト) - ヘビー級零式4層前半 ぬけまる様式 (散開・スローターシェッド)
    url: https://game8.jp/ff14/756439
    text: |
      /p 〈散開〉T　　T
      /p 　　★D1 HH D2 ★
      /p 　　　D3　　 D4
      /p ■細胞付着：終期　AoE左上から外周沿い捨て
      /p 線：中央集合→TH:西、D:東
      /p ■スローターシェッド　詠唱中集合：TH：A　DPS：タゲサ先
      /p 散会組：H1 MT | MT H1　D3 D1 | D1 D3
      /p 　 　　　H2 S T | S T H2　D4 D2 | D2 D4

  - source: Game8 (ゲームエイト) - ヘビー級零式4層後半 (マクロは外部リンク参照)
    url: https://game8.jp/ff14/757988
    # 注: Game8 4層後半ページにはマクロ本文の直接記載がなく
    # 「ぬけまる様が紹介しているので下記リンクからコピーしましょう」
    # との案内のみ。完全なマクロ本文はぬけまる YouTube 動画
    # (https://www.youtube.com/watch?v=YXxp8nrRw3o) の概要欄から取得すること。
    # 要手動補完。

  - source: Lodestone Sr Odin - 「ヘビー級零式4層後半 アルカディアンドリーム用 ぬけまる改良版」
    url: https://na.finalfantasyxiv.com/lodestone/character/39631700/blog/5649775/
    # 著者: Sr Odin (Hades [Mana])
    # /e (emote) コマンドベースのコールマクロ。レプリ固定法を含む改良版。
    # マクロ全文は WebFetch で取得困難だったため、URL のみ保持。要手動補完。
    text: |
      # 抜粋 (実際の本文は Lodestone を参照)
      /e -----
      /e [A] ●頭割り
      /e 入替ペア -> [2]
      /e 頭割りは[3]
      /mk attack4 <me>
      /micon A fieldmarking
      # ... (続きは Lodestone URL を参照)

  - source: Lodestone Ku Yuri - 「４層後半アルカディアンドリーム 自分用メモとコールマクロ（処理法ぬけまる）」
    url: https://na.finalfantasyxiv.com/lodestone/character/22717408/blog/5651169/
    # 著者: Ku Yuri (Pandaemonium [Mana])
    # ぬけまる処理法に基づく十字/X字判断マクロ + 分身判定マクロ (8 種)。
    # マクロ全文は WebFetch で取得困難だったため、URL のみ保持。要手動補完。
    text: |
      # 抜粋 (実際の本文は Lodestone を参照)
      /p -十字から-------------
      /p MT組：A→扇よけ→1→扇よけ
      /p ST組：D→扇よけ→4→扇よけ
      /p -X字から-------------
      /p MT組：1→扇よけ→A→扇よけ
      /p ST組：4→扇よけ→D→扇よけ
      # ... (続きは Lodestone URL を参照)

