# 至天の座アルカディア：ライトヘビー級零式 1層 - ブラックキャット (M1S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 本ファイルの情報源は2026年5月時点で Game8 / Lodestone / X / YouTube 上で
#   確認できた野良主流の処理法・マクロです。流派は時期により変化しています。
# - 通称: 国際/FFLogs では M1S (Arcadion 通し番号)、Game8 等の日本コミュニティでは
#   「ライトヘビー級零式1層」「LH1」が一般的。本ファイルは shortName を M1S とする。
