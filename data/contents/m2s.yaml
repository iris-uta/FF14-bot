id: m2s
displayName: 至天の座アルカディア：ライトヘビー級零式 2層 (ハニーB・ラブリー)
shortName: M2S
type: savage
patch: "7.05"
phases:
  - id: p1
    name: P1 ハニーB・ラブリー (Honey B. Lovely) 通し
    order: 1
    description: |-
      「劇毒の愛」ハニーB・ラブリー戦。1ボス完結型。
      主要ギミック:
        - ハニーツイスター / ハニーブラスト (全体ダメージ)
        - ハニー・B・ライヴ (1st / 2nd / 3rd の 3 回構成)
          * 1st ライヴ: 近接 ♡2 / 遠隔 ♡3 (頭割り処理)
          * 2nd ライヴ: ♡0 中央→北→TH西 / DPS東で頭割り、
                       ♡1 南待機 → AOE 対象者は捨てる、塔は TH 北/西 DPS 南/東
          * 3rd ライヴ: デバフ捨て、塔踏みはペア割基準
        - アラームフェロモン (1回目: 外周蜂直線範囲 / 2回目)
        - リング / ラウンド・ラブコンビネーション (♡ハート機構: TH 2 + DPS 2 に ♡1、残り 4 人に ♡0)
        - ブラックハート (8 方向散開 → HP 回復後早いペア順に中央集合)
        - キラースラッシュ / キラースティング (タンク強)
        - 毒捨て: TH 北西 / DPS 南東
      野良主流: ぬけまる版 (Game8 採用)。
    videos:
      - title: 【FF14】アルカディア零式：ライトヘビー級2層 攻略解説【ぬけまる】
        url: https://www.youtube.com/watch?v=p9tE-x0XEC4
        author: ぬけまるG
      - title: 【 FF14 / 解説 】アルカディア零式：ライトヘビー級零式2 マクロ
        url: https://nukemarugames.com/2024/07/31/%E3%80%90-ff14-%E8%A7%A3%E8%AA%AC-%E3%80%91%E3%82%A2%E3%83%AB%E3%82%AB%E3%83%87%E3%82%A3%E3%82%A2%E9%9B%B6%E5%BC%8F%EF%BC%9A%E3%83%A9%E3%82%A4%E3%83%88%E3%83%98%E3%83%93%E3%83%BC%E7%B4%9A%E9%9B%B6/
        author: ぬけまるG
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア ライトヘビー級:零式, Patch 7.05 対応)
      url: https://note.com/lastagous/n/ncfcb027117fd
      copyable: true
    tips:
      - ハニー・B・ライヴ各回で「♡ハート数」によって塔位置と頭割り位置が分岐する。
      - アラームフェロモン 1 回目は外周蜂からの直線範囲、各人が個別にケアする。
      - ブラックハート後の中央集合は『早い人ペア順』。HP回復タイミングを意識する必要がある。
      - 野良では『お知らせマクロ』(◯◯ Rain or Drop で次に来るギミックを宣言する) も併用される。
macros:
  - source: Game8 (ゲームエイト) - アルカディア零式ライトヘビー級2層 ぬけまる版
    url: https://game8.jp/ff14/630353
    text: |-
      /p ■基本散開
      /p D3 MT D4　 　D3 D4 　 　MT/D3 　ST/D4
      /p H1 ☆ H2 　 　 MT ST 　 　 H1/D1 　 D2/H2
      /p D1 ST D2 　 　 D1 D2
      /p 　 　 　 　 　 　H1 H2
      /p ■1stライヴ
      /p 近接：♡2（頭割り処理）　遠隔：♡3
      /p ■2ndライヴ
      /p ♡0：中心→北→TH西、DPS東で頭割り
      /p ♡1：南待機→AOE対象者は捨てる 塔:TH 北/西 DPS南/東
      /p ■毒捨て　TH：北西、DPS：南東
      /p ■3rdライヴ
      /p デバフ捨て、塔踏みはペア割基準
      /p ■ブラックハート
      /p 8方向散開　HPが戻り次第、早いペア順に中央集合
