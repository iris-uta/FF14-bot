# 至天の座アルカディア：ライトヘビー級零式 2層 - ハニーB・ラブリー (M2S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 M2S、Game8/JP では「ライトヘビー級零式2層」「LH2」。
# - 公式肩書: 「劇毒の愛」 (Famitsu 設定画特集)
# - Source: https://www.famitsu.com/article/202505/42743
# - 「ハニー・B・ライヴ」を軸にした音楽×蜂モチーフのアイドル戦。
# - Game8 のマクロは「ぬけまる版」が掲載 (2026-03-12 時点)。

id: m2s
displayName: 至天の座アルカディア：ライトヘビー級零式 2層 (ハニーB・ラブリー)
shortName: M2S
type: savage
patch: "7.05"
# ノーマル実装日: 2024-07-16 (Patch 7.01)
# 零式実装日:   2024-07-30 (Patch 7.05)
# Source: https://ffxiv.consolegameswiki.com/wiki/The_Arcadion

phases:
  - id: p1
    name: P1 ハニーB・ラブリー (Honey B. Lovely) 通し
    order: 1
    description: |
      「劇毒の愛」ハニーB・ラブリー戦。1ボス完結型。
      主要ギミック:
        - ハニーツイスター / ハニーブラスト (全体ダメージ)
        - ハニー・B・ライヴ (1st / 2nd / 3rd の 3 回構成)
          * 1st ライヴ: 近接 ♡2 / 遠隔 ♡3 (頭割り処理)
          * 2nd ライヴ: ♡0 中央→北→TH西 / DPS東で頭割り、
                       ♡1 南待機 → AOE 対象者は捨てる、塔は TH 北/西 DPS 南/東
          * 3rd ライヴ: デバフ捨て、塔踏みはペア割基準
        - アラームフェロモン (1回目: 外周蜂直線範囲 / 2回目)
        - リング / ラウンド・ラブコンビネーション (♡ハート機構: TH 2 + DPS 2 に ♡1、残り 4 人に ♡0)
        - ブラックハート (8 方向散開 → HP 回復後早いペア順に中央集合)
        - キラースラッシュ / キラースティング (タンク強)
        - 毒捨て: TH 北西 / DPS 南東
      野良主流: ぬけまる版 (Game8 採用)。
    # Source: https://game8.jp/ff14/630353
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア ライトヘビー級:零式, Patch 7.05 対応)
      # M1S-M4S 全層を 1 ブックで管理。詳細は M1S を参照。
      # Source: https://note.com/lastagous/n/ncfcb027117fd
      url: https://note.com/lastagous/n/ncfcb027117fd
      copyable: true
    videos:
      - title: 【FF14】アルカディア零式：ライトヘビー級2層 攻略解説【ぬけまる】
        url: https://www.youtube.com/watch?v=p9tE-x0XEC4
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/630353) で参照されている動画
      - title: 【 FF14 / 解説 】アルカディア零式：ライトヘビー級零式2 マクロ
        url: https://nukemarugames.com/2024/07/31/%E3%80%90-ff14-%E8%A7%A3%E8%AA%AC-%E3%80%91%E3%82%A2%E3%83%AB%E3%82%AB%E3%83%87%E3%82%A3%E3%82%A2%E9%9B%B6%E5%BC%8F%EF%BC%9A%E3%83%A9%E3%82%A4%E3%83%88%E3%83%98%E3%83%93%E3%83%BC%E7%B4%9A%E9%9B%B6/
        author: ぬけまるG
    strategies:
      - id: nukemaru-game8
        name: ぬけまる版 (Game8 採用版)
        description: |
          Game8 が公式採用しているぬけまる氏解説に準拠した処理法。
          - 基本散開: D3 MT D4 / H1 ☆ H2 / D1 ST D2
          - 1st ライヴ: 近接 ♡2 / 遠隔 ♡3
          - 2nd ライヴ ♡0: 中央→北→TH 西、DPS 東で頭割り
          - 2nd ライヴ ♡1: 南待機 → AOE 対象者は捨てる、塔は TH 北/西 DPS 南/東
          - 毒捨て: TH 北西 / DPS 南東
          - ブラックハート: 8 方向散開 → HP 戻り次第早いペア順に中央集合

