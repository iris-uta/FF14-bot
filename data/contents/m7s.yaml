# 至天の座アルカディア：クルーザー級零式 3層 - ブルートアボミネーター (M7S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際/FFLogs では M7S、Game8/JP では「クルーザー級零式3層」「クルーザー3層」。
# - 公式肩書: 「反則王のリベンジ」(Source: ファミ通 https://www.famitsu.com/article/202505/42745)
# - 背景: ブルートボンバー (前 tier の M3S ボス) が複数の魔物の魂を注入した状態で再登場。
# - 魂の源: カトブレパス、サイクロプス、ベラドンナ。
# - 特徴: 人の形を成していない外見。多彩な攻撃を展開。
# - BGM: 『Not Afraid』(THE PRIMALS によるヘヴィメタル調)。
# - Game8 採用流派: 「さり式」(Asche Okumura 氏 = note の さり 氏)。
#   別流派として「ぽにこね式」も掲載。
# - 攻略の鍵: ソーンデスマッチ・ビルディング (地下マーカー前提)。

id: m7s
displayName: 至天の座アルカディア：クルーザー級零式 3層 (ブルートアボミネーター)
shortName: M7S
type: savage
status: testing
patch: "7.2"
# パッチ実装日: 2025-03-25 (Patch 7.2)
# 零式実装日: 2025-04-01
# Source: https://www.famitsu.com/article/202503/36584
# Source: https://ffxiv.consolegameswiki.com/wiki/The_Arcadion

phases:
  - id: p1
    name: P1 ブルートアボミネーター 前半 (スキャッターシード 〜 ビルディング)
    order: 1
    description: |
      ブルートアボミネーター前半フェーズ。
      主要技:
        - スキャッターシード 1回目 (種捨て + エラプ)
          * 近接: 南内側開始→上→中央→下
          * 遠隔: D北H南開始→東西→最後中央寄せ
          * 頭割り: MT組=西 / ST組=東
        - ソーンスマッシュ (北固定散開)
        - ブルートグラワー (中央集合からの十字配置)
        - ソーンデスマッチ・ビルディング (いしあ式・さり式・ぽにこね式が存在、Game8 はさり式)
      野良主流: さり式 (Game8 採用) または ぽにこね式。
    # Source: https://game8.jp/ff14/681274
    # Source: https://na.finalfantasyxiv.com/lodestone/character/13307902/blog/5542016/ (ぬけまる固定 マクロ)
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア クルーザー級:零式 [1-4層対応])
      # M5S-M8S 全層を 1 ブックで管理。
      # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5540581/
      url: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5540581/
      copyable: true
    videos:
      - title: 【FF14/解説】さり式 クルーザー級零式 3層解説 GAME8準拠【ぬけまる】(M7S)
        url: https://www.youtube.com/watch?v=EvPn0UHMevk
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/681274) で参照されている動画
    strategies:
      - id: sari-shiki
        name: さり式 (Game8 採用版)
        description: |
          さり氏 (Asche Okumura, note.com/srm_br) が考案、Game8 採用流派。
          - いしあ式よりも後出しGCDを多く回せる処理法 (火力寄り)。
          - 移動がシビアで P3 ストーンウェポンでスプリント必須。
          - ソーンデスマッチ・ビルディング (奇数 3回目安置 / 13捨て位置 など) の位置を固定。
          - ペア頭割り: MTD1=①, STD2=②, H1D3=③, H2D4=⑤。
      - id: ponikone-shiki
        name: ぽにこね式 (代替流派)
        description: |
          Game8 が代替として掲載しているもうひとつの処理法。
          ソーンデスマッチ・ビルディングを別アプローチで処理する。詳細は Game8 ページ参照。
          # Source: https://game8.jp/ff14/681274
    tips:
      - "ビルディング処理が攻略のキー (さり氏 活動録: 7割の準備時間をここに費やした)。"
      - "P3 ストーンウェポンでは複数回スプリント必須。クールダウン管理を徹底。"
      - "地下マーカーをマップ上に置く前提のマクロ運用 (ぬけまる固定 Lodestone 参照)。"

  - id: p2
    name: P2 ブルートアボミネーター 後半 (ゾーンデスマッチ・ウォール 〜 ツイン)
    order: 2
    description: |
      後半フェーズ。石化視線ギミックと2体ボス処理。
      主要技:
        - ゾーンデスマッチ・ウォール (石化視線: 北西/南東避け、雑魚石化後処理)
        - スキャッターシード 2回目 (近接北西集合)
          * 近接 AoE: 北西から時計回り→南西安置 (遠隔: シード十字捨て、南側外周避け)
          * 遠隔 AoE: 最外周捨て→中央安置 (近接: シード十字内側捨て、外から2マス、中央避け)
        - ウェポンツイン + ブロウシード (1回目北向き / 2回目ボス北基準)
        - ストーンウェポン: ツイン (P3 最大の山場、移動シビア)
    # Source: https://game8.jp/ff14/681274
    tips:
      - "ストーンウェポン: ツインは石化視線+8方向直線+ブルートスイング+ツインの複合。"
      - "ウェポンツイン+ブロウシード 1回目: MT/D3 北西、ST/D4 北東。"
      - "ウェポンツイン+ブロウシード 2回目: MT/D1 北西、ST/D2 北東、H1/D3 南西、H2/D4 南東。"

