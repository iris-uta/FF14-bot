id: m7s
displayName: 至天の座アルカディア：クルーザー級零式 3層 (ブルートアボミネーター)
shortName: M7S
type: savage
patch: "7.2"
phases:
  - id: p1
    name: P1 ブルートアボミネーター 前半 (スキャッターシード 〜 ビルディング)
    order: 1
    description: |-
      ブルートアボミネーター前半フェーズ。
      主要技:
        - スキャッターシード 1回目 (種捨て + エラプ)
          * 近接: 南内側開始→上→中央→下
          * 遠隔: D北H南開始→東西→最後中央寄せ
          * 頭割り: MT組=西 / ST組=東
        - ソーンスマッシュ (北固定散開)
        - ブルートグラワー (中央集合からの十字配置)
        - ソーンデスマッチ・ビルディング (いしあ式・さり式・ぽにこね式が存在、Game8 はさり式)
      野良主流: さり式 (Game8 採用) または ぽにこね式。
    videos:
      - title: 【FF14/解説】さり式 クルーザー級零式 3層解説 GAME8準拠【ぬけまる】(M7S)
        url: https://www.youtube.com/watch?v=EvPn0UHMevk
        author: ぬけまるG
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア クルーザー級:零式 [1-4層対応])
      url: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5540581/
      copyable: true
    tips:
      - "ビルディング処理が攻略のキー (さり氏 活動録: 7割の準備時間をここに費やした)。"
      - P3 ストーンウェポンでは複数回スプリント必須。クールダウン管理を徹底。
      - 地下マーカーをマップ上に置く前提のマクロ運用 (ぬけまる固定 Lodestone 参照)。
  - id: p2
    name: P2 ブルートアボミネーター 後半 (ゾーンデスマッチ・ウォール 〜 ツイン)
    order: 2
    description: |-
      後半フェーズ。石化視線ギミックと2体ボス処理。
      主要技:
        - ゾーンデスマッチ・ウォール (石化視線: 北西/南東避け、雑魚石化後処理)
        - スキャッターシード 2回目 (近接北西集合)
          * 近接 AoE: 北西から時計回り→南西安置 (遠隔: シード十字捨て、南側外周避け)
          * 遠隔 AoE: 最外周捨て→中央安置 (近接: シード十字内側捨て、外から2マス、中央避け)
        - ウェポンツイン + ブロウシード (1回目北向き / 2回目ボス北基準)
        - ストーンウェポン: ツイン (P3 最大の山場、移動シビア)
    tips:
      - "ストーンウェポン: ツインは石化視線+8方向直線+ブルートスイング+ツインの複合。"
      - "ウェポンツイン+ブロウシード 1回目: MT/D3 北西、ST/D4 北東。"
      - "ウェポンツイン+ブロウシード 2回目: MT/D1 北西、ST/D2 北東、H1/D3 南西、H2/D4 南東。"
