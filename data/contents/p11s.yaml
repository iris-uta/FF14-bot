# パンデモニウム零式：天獄編 3層 - テミス (P11S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 P11S (Pandæmonium Anabaseios Eleventh Circle Savage)、
#   Game8 / JP コミュニティでは「天獄編3層」「天獄3」が一般的。
# - ボス正式名称: 「テミス」(Themis / 希: Θέμις)
#   万魔殿パンデモニウム創設の同盟者・暁月メインシナリオ重要 NPC。
# - 実装パッチ: 6.41 (零式)、6.4 (ノーマル)
#   零式実装日: 2023-05-30
# - Game8 マクロ採用流派: 「ハムカツ様準拠」
#   別流派: 「ぬけまる/Zizie式」「しのしょー式 (X字処理)」など。
#   アップヘルド闇の処理で十字 (ハムカツ) と X字 (しのしょー) が分かれる。
# - 本ファイルは Game8 (https://game8.jp/ff14/532825) から WebFetch (2026-05-25) で取得。

id: p11s
displayName: パンデモニウム零式：天獄編 3層 (テミス)
shortName: P11S
type: savage
patch: "6.41"
# Source: https://ffxiv.consolegameswiki.com/wiki/Anabaseios:_The_Eleventh_Circle_(Savage)
# Source: https://na.finalfantasyxiv.com/lodestone/character/29231383/blog/5231433 (ボス名出典)

phases:
  - id: p1
    name: P1 テミス 通し (Themis - 法理を司る者)
    order: 1
    description: |
      テミス戦。1ボス完結型。光と闇の対比、魔法陣・戒律など秩序系ギミックがメイン。
      主要技:
        - ジューリー・オーバールール (光/闇属性判定)
        - アップヘルド・オーバールール (十字 or X字)
        - ディバイド・オーバールール
        - 魔法陣展開 + ディスミサル
        - 戒律の幻想
        - ライトストリーム
        - 光と闇の調停 (ジジー式採用)
        - ダークストリーム
        - 理法の幻想 (闇線中央 / 光線その場)
        - ステュクス (5〜8連、フィニッシュ)
      野良主流: ハムカツ様準拠 + 光と闇の調停はジジー式 (Game8 採用)。
    # Source: https://game8.jp/ff14/532825
    videos:
      - title: 【FF14】解説 天獄編零式3層 アニメーション解説 Zizie式マクロ有り【ぬけまる】
        url: https://www.youtube.com/watch?v=AsS4R1qYbGM
        author: ぬけまるG
        # Source: 検索結果より (ぬけまる版アニメーション解説 + Zizie式マクロ)
      - title: 【FF14】パンデモニウム天獄編零式3層【解説】修正版
        url: https://www.youtube.com/watch?v=-EM-XR6qocU
        # Source: 検索結果より (修正版解説動画)
    strategies:
      - id: hamukatsu-zizie
        name: ハムカツ様準拠 + ジジー式調停 (Game8 採用版)
        description: |
          Game8 採用流派。基本散開・配置はハムカツ様準拠。光と闇の調停はジジー式。
          - ボスを見る場合以外は北 (A) 基準で散開
          - MT組: MTH1D1D3、ST組: STH2D2D4
          - 基本散開: D3/MT/D4 // H1/★/H2 // D1/ST/D2
          - アップヘルド闇/ペア散開: MTD3, H1D1/H2D4, STD2 (十字形)
            * 闇ジューリー → DPS時計回り
            * 塔 X字 → 反時計回り
          - 魔法陣 & 戒律:
            * 初動 MT組:西待機 / ST組:東待機
            * 魔法陣ディスミサル闇 / 戒律闇ディバイドはボスを見て
              左: MTD3/STD2 / 右: H1D1/H2D4
            * 戒律の闇線 → T線: A マーカー / 光: ボス中央
          - ライトストリーム後ディバイド: ボスを見て MT組:左 / ST組:右
          - 光と闇の調停 (ジジー式): 光→TH:西側/DPS:東側、闇→TH:東側/DPS:西側
          - 調停ディバイド: 近マーカー待機→位置確定後時計回り
          - ダークストリーム: MT組:北西 / ST組:南東、内:近接(T側) / 外:遠隔(H側)
      - id: shinosho-xshiki
        name: しのしょー式 (X字処理 - アップヘルド闇)
        description: |
          アップヘルド闇の処理で十字 (ハムカツ式) ではなく X字を採用する流派。
          Game8 ページに「別解」として注記あり。詳細は動画予習推奨。

