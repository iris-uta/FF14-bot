id: p11s
displayName: パンデモニウム零式：天獄編 3層 (テミス)
shortName: P11S
type: savage
patch: "6.41"
phases:
  - id: p1
    name: P1 テミス 通し (Themis - 法理を司る者)
    order: 1
    description: |-
      テミス戦。1ボス完結型。光と闇の対比、魔法陣・戒律など秩序系ギミックがメイン。
      主要技:
        - ジューリー・オーバールール (光/闇属性判定)
        - アップヘルド・オーバールール (十字 or X字)
        - ディバイド・オーバールール
        - 魔法陣展開 + ディスミサル
        - 戒律の幻想
        - ライトストリーム
        - 光と闇の調停 (ジジー式採用)
        - ダークストリーム
        - 理法の幻想 (闇線中央 / 光線その場)
        - ステュクス (5〜8連、フィニッシュ)
      野良主流: ハムカツ様準拠 + 光と闇の調停はジジー式 (Game8 採用)。
    videos:
      - title: 【FF14】解説 天獄編零式3層 アニメーション解説 Zizie式マクロ有り【ぬけまる】
        url: https://www.youtube.com/watch?v=AsS4R1qYbGM
        author: ぬけまるG
      - title: 【FF14】パンデモニウム天獄編零式3層【解説】修正版
        url: https://www.youtube.com/watch?v=-EM-XR6qocU
    tips:
      - アップヘルド闇は十字 (ハムカツ) と X字 (しのしょー) で野良マクロが分かれるため、募集時に流派確認必須。
      - 魔法陣ディスミサル闇 / 戒律闇ディバイドは『ボスを見て』判定なのでカメラ向き重要。
      - 光と闇の調停はジジー式 (光:TH西/DPS東、闇:TH東/DPS西) が Game8 採用。
      - ダークストリームは MT組北西 / ST組南東、内側に近接・外側に遠隔。
macros:
  - source: Game8 (ゲームエイト) - 天獄編零式3層 マクロ 1枚目 (ハムカツ様準拠)
    url: https://game8.jp/ff14/532825
    text: |-
      /p ※ボスを見て以外は北(A)基準
      /p MT組：MTH1D1D3　ST組：STH2D2D4
      /p 【基本散開】　　　【アップヘルド闇/ペア散開】
      /p D3 MT D4　　　 　　　　　　　MTD3
      /p H1 ★ H2 　 　　　 　　H1D1 ★ H2D4
      /p D1 ST D2　　 　 　　 　 　　STD2
      /p ※闇ジューリー⇒DPS時計※塔X字⇒反時計
      /p 【魔法陣＆戒律】
      /p 初動⇒MT組：西待機　ST組：東待機
      /p 「魔法陣ディスミサル闇：戒律闇ディバイド」
      /p ボスを見て　左:MTD3/STD2 右:H1D1/H2D4
      /p 戒律の闇線⇒T線：Aマーカー　光：ボス中央
      /p 【ライトストリーム後ディバイド】
      /p ボスを見て MT組：左　ST組：右
  - source: Game8 (ゲームエイト) - 天獄編零式3層 マクロ 2枚目 (調停/ダークストリーム/理法)
    url: https://game8.jp/ff14/532825
    text: |-
      /p 【光と闇の調停：ジジー式】
      /p 光⇒TH：西側　DPS：東側
      /p 闇⇒TH：東側　DPS：西側
      /p 【調停ディバイド】
      /p 近くのマーカーで待機し位置確定後　時計回り
      /p 闇ペア⇒ボスを見て 短い線(異色)：左　長い線(同色)：右
      /p 【ダークストリーム】
      /p MT組:北西 ST組:南東
      /p 内:近接(T進行方向側) / 外:遠隔(H進行方向側)
      /p 【理法の幻想】
      /p 闇線中央捨て　光線その場
      /p 塔処理　北(A)基準で塔ペア散開
      /p 闇ディスミサル　ボスを見て　左:MTD3/STD2 右:H1D1/H2D4
  - source: Lodestone Kama Boko - 天獄編零式3層 ハムカツさん マクロ
    url: https://jp.finalfantasyxiv.com/lodestone/character/32180468/blog/5233886/
