id: p12s
displayName: パンデモニウム零式：天獄編 4層 (アテナ / パラス・アテナ)
shortName: P12S
type: savage
patch: "6.41"
phases:
  - id: p1
    name: P1 アテナ 前半 (Athena Part 1) — パラデイグマ〜サイコロネバラン
    order: 1
    description: |-
      Part 1 (前半)。「アテナ」戦。パラデイグマ系のギミックが軸。
      主要技:
        - パラデイグマ 1回目 (タンク無敵処理)
        - パラデイグマ 2回目 (十字、線対面伸ばし、塔TH反時計/塔DPS時計)
        - トリニティ・ソウル
        - スーパーチェインセオリー I (8方向 / ペア / ペア半面ⅡA)
        - スーパーチェインセオリー ⅡB (ビーム誘導 / 4:4 / 塔天火散開)
        - アポ (HD ボス下) / ペリ (HD ボス背面サークル外)
        - パラデイグマ 3回目 (イディル: 北十字 / 南X字)
        - サイコロフェーズ (ネバーランド)
        - オン・ザ・ソウル
      野良主流: ぬけまる式 (「パラ1無敵パラ2十字パラ3イディルサイコロネバラン」)。
    videos:
      - title: 【FF14】解説 天獄編零式4層前半 ぬけまる式
        url: https://www.youtube.com/watch?v=rgqmXnsPsAc
        author: ぬけまるG
    tips:
      - パラデイグマ1回目はタンク無敵処理が前提。タンクの無敵スキル管理 (リプ含む) 必須。
      - スーパーチェイン I/II は『8方向 → ペア → ペア半面 → ビーム誘導 → 4:4 → 塔/天火散開』の連続。
      - サイコロネバランは 2/4 が頭割り、ビーム順番要暗記 (5,7→6,8→1,3→2,4)。
  - id: p2
    name: P2 パラス・アテナ 後半 (Pallas Athena Part 2) — サモンダークネス〜パンゲネシス
    order: 2
    description: |-
      Part 2 (後半)。「パラス・アテナ」戦。神格融合形態。
      Idol of Darkness 系・カロリック系・パンゲネシスが軸。
      主要技:
        - パラスの手 (T:西 / 他:東)
        - サモンダークネス (北/西:TH 南/東:DPS)
        - デミハルペリオン (MT/ST 上 // H1/H2 // ● // D3/D4 // D1/D2 を3回連続)
        - イデアエレメンタル (西 〇×△□ 東、α:赤▲ β:黄■)
        - パラスレイ (X処理 / K処理。Game8 マクロは X処理、1回目は K処理することもあり)
        - カロリックセオリー 1回目 (もちべ式 - 炎マーカー頭割り 西TH/東DPS、風炎AB時計)
        - エクピロシス
        - パンゲネシス (MT:西無敵、他:南(東側))
        - カロリック2回目 (反時計/最後中央行かずに2回移動)
        - サモンダークネス + デミ 2回目 (MTD1 が奥まで走る)
        - 最終線処理 (MT/D1, ST/D2, H1/D3, H2/D4 ペア)
      野良主流: ぬけまる動画ベース (Game8 採用、X処理メイン)。
    videos:
      - title: 【FF14】解説 天獄編零式4層後半 ぬけまる式 (パラスレイX処理)
        url: https://www.youtube.com/watch?v=9jE9zWeWkAg
    tips:
      - パラスレイは X処理 (Game8 マクロ) と K処理 (1回目バリアント) があるので募集確認必須。
      - カロリック1 (もちべ式) は風炎 ABCD の時計回り順序を厳守 (MTSTH1H2D1D2D3D4)。
      - パンゲネシスで無職スライムは 西:1マーカー / 東:2マーカー に分かれる。
      - カロリック2 はマーカーが MT と交代になる点が 1 回目との違い。
      - 最終サモンダークネス線処理は MT/D1 ST/D2 H1/D3 H2/D4 のペアを崩さない。
