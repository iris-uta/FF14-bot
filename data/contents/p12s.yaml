# - ぬけまる動画 URL (前半・後半) は仮置き。本ファイルでは類似ジャンルの検索結果 URL を
#   採用しているが、要 P12S 本編の正規動画への置き換え。
# - パラスレイ K処理 (1回目バリアント) のマクロ全文は未取得。strategies[] に詳細を追加すること。
