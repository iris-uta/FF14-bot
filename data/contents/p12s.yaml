# パンデモニウム零式：天獄編 4層 - アテナ / パラス・アテナ (P12S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 P12S (Pandæmonium Anabaseios Twelfth Circle Savage)、
#   Game8 / JP コミュニティでは「天獄編4層」「天獄4」が一般的。
# - ボス正式名称:
#     前半: 「アテナ」(Athena / 神格としては Theos: Athena)
#     後半: 「パラス・アテナ」(Pallas Athena / 神格融合形態、アスフォダロス神格)
# - 4 層は前半 (Part 1) と後半 (Part 2) の 2 部構成で実装。
#   * 前半: パラデイグマ / スーパーチェインセオリー / サイコロネバラン
#   * 後半: サモンダークネス / デミハルペリオン / カロリックセオリー / パンゲネシス
#     パラスレイ (パラス・テスタメント) が後半の山場で、X処理と K処理 (1回目) が分かれる。
# - 実装パッチ: 6.41 (零式)、6.4 (ノーマル)
#   零式実装日: 2023-05-30
# - Game8 マクロ採用流派: 「ぬけまる式」
#   前半: パラ1無敵 / パラ2十字 / パラ3イディル / サイコロネバラン
#   後半: パラスレイ X処理 (1回目は K処理することもあり、PT 募集確認必須)
# - 本ファイルは Game8 前半 (https://game8.jp/ff14/534748) と
#   後半 (https://game8.jp/ff14/535668) から WebFetch (2026-05-25) で取得。

id: p12s
displayName: パンデモニウム零式：天獄編 4層 (アテナ / パラス・アテナ)
shortName: P12S
type: savage
patch: "6.41"
# Source: https://ffxiv.consolegameswiki.com/wiki/Anabaseios:_The_Twelfth_Circle_(Savage)
# Source: https://na.finalfantasyxiv.com/lodestone/character/29231383/blog/5231433 (ボス名出典)

phases:
  - id: p1
    name: P1 アテナ 前半 (Athena Part 1) — パラデイグマ〜サイコロネバラン
    order: 1
    description: |
      Part 1 (前半)。「アテナ」戦。パラデイグマ系のギミックが軸。
      主要技:
        - パラデイグマ 1回目 (タンク無敵処理)
        - パラデイグマ 2回目 (十字、線対面伸ばし、塔TH反時計/塔DPS時計)
        - トリニティ・ソウル
        - スーパーチェインセオリー I (8方向 / ペア / ペア半面ⅡA)
        - スーパーチェインセオリー ⅡB (ビーム誘導 / 4:4 / 塔天火散開)
        - アポ (HD ボス下) / ペリ (HD ボス背面サークル外)
        - パラデイグマ 3回目 (イディル: 北十字 / 南X字)
        - サイコロフェーズ (ネバーランド)
        - オン・ザ・ソウル
      野良主流: ぬけまる式 (「パラ1無敵パラ2十字パラ3イディルサイコロネバラン」)。
    # Source: https://game8.jp/ff14/534748
    videos:
      - title: 【FF14】解説 天獄編零式4層前半 ぬけまる式
        url: https://www.youtube.com/watch?v=rgqmXnsPsAc
        author: ぬけまるG
        # 注: 検索結果より関連動画 URL を仮置き。要再確認 (P12S 前半 ぬけまる解説本編)。
    strategies:
      - id: nukemaru-zenhan
        name: ぬけまる式 (Game8 採用版 / 前半)
        description: |
          Game8 採用流派。「パラ1無敵 / パラ2十字 / パラ3イディル / サイコロネバラン」。
          - パラデイグマ 1回目: タンク無敵で処理
          - パラデイグマ 2回目 (十字):
            * 線: 対面に伸ばす
            * 塔TH: 北西から反時計回り
            * 塔DPS: 北東から時計回り
          - スーパーチェイン I (8方向): D1/MT/D2 // ★ // H1/D3/D4/H2 // 円配置
            ペア: MT/D1 // ST/D2 // H1/D3 // H2/D4
            ペア半面 (ⅡA): MTD1 / STD2 / H1D3 / H2D4
          - スーパーチェイン II (ビーム誘導): 黒ビーム / 白ビーム、白デバフ/黒デバフ
            4:4 + 塔/天火散開: MT/D1 ST/D2 // ★ 白/黒 // H1/D3 H2/D4
          - アポ・ペリ: アポ HD ボス下 / ペリ HD ボス背面サークル外
          - パラデイグマ 3回目 (イディル): 北:十字 / 南:X字
            北 MT > ST > H1 > H2 南
            DPS 塔踏み: 中央 > D1D2D3D4
          - サイコロネバラン: 2/4 は辺から頭割り、ビーム順: 5,7→6,8→1,3→2,4
            サイコロ後は北に集合
    tips:
      - "パラデイグマ1回目はタンク無敵処理が前提。タンクの無敵スキル管理 (リプ含む) 必須。"
      - "スーパーチェイン I/II は『8方向 → ペア → ペア半面 → ビーム誘導 → 4:4 → 塔/天火散開』の連続。"
      - "サイコロネバランは 2/4 が頭割り、ビーム順番要暗記 (5,7→6,8→1,3→2,4)。"

  - id: p2
    name: P2 パラス・アテナ 後半 (Pallas Athena Part 2) — サモンダークネス〜パンゲネシス
    order: 2
    description: |
      Part 2 (後半)。「パラス・アテナ」戦。神格融合形態。
      Idol of Darkness 系・カロリック系・パンゲネシスが軸。
      主要技:
        - パラスの手 (T:西 / 他:東)
        - サモンダークネス (北/西:TH 南/東:DPS)
        - デミハルペリオン (MT/ST 上 // H1/H2 // ● // D3/D4 // D1/D2 を3回連続)
        - イデアエレメンタル (西 〇×△□ 東、α:赤▲ β:黄■)
        - パラスレイ (X処理 / K処理。Game8 マクロは X処理、1回目は K処理することもあり)
        - カロリックセオリー 1回目 (もちべ式 - 炎マーカー頭割り 西TH/東DPS、風炎AB時計)
        - エクピロシス
        - パンゲネシス (MT:西無敵、他:南(東側))
        - カロリック2回目 (反時計/最後中央行かずに2回移動)
        - サモンダークネス + デミ 2回目 (MTD1 が奥まで走る)
        - 最終線処理 (MT/D1, ST/D2, H1/D3, H2/D4 ペア)
      野良主流: ぬけまる動画ベース (Game8 採用、X処理メイン)。
    # Source: https://game8.jp/ff14/535668
    videos:
      - title: 【FF14】解説 天獄編零式4層後半 ぬけまる式 (パラスレイX処理)
        url: https://www.youtube.com/watch?v=9jE9zWeWkAg
        # 注: 検索結果より関連動画 URL を仮置き。要再確認 (P12S 後半 ぬけまる解説本編)。
    strategies:
      - id: nukemaru-kouhan-xshori
        name: ぬけまる式 (Game8 採用版 / 後半 X処理)
        description: |
          Game8 採用流派。パラスレイは X処理メイン (1回目は K処理することも多い)。
          - パラスの手: T:西 / 他:東
          - サモンダークネス: 北>西:TH / 南>東:DPS
          - デミハルペリオン: 3 セット連続、TH/DPS のスワップ配置
          - イデア: 西←〇×△□→東、α:赤▲ β:黄■
          - パラスレイ X処理:
            ● ● ● ●
            〇α ★ ×α (1回目) / △α ★ □α (2回目)
            ● ● ● ●
            〇β ★ ×β / △β ★ □β
            2回目は〇×△□が反転、誘導後→★ に入る
          - カロリック1 (もちべ式): 炎マーカー頭割り 西TH/東DPS
            風炎は MTSTH1H2D1D2D3D4 の順で A から時計
          - エクピロシス: MT/ST 上 // D1 MT // D2 ST // H1 H2 上 // D3 D4 // 等
          - パンゲネシス: MT:西無敵、他:南(東側)
            極性なし: 西←MTSTH1H2D1D2D3D4→東
            無職:スライム → 西:1マーカー、東:2マーカー
          - カロリック2: マーカーは MT と交代、反時計/最後中央行かずに2回移動
          - サモンダークネス + デミ 2 回目: MTD1 が奥まで走る、安置の逆側に
            MT/D1 ST/D2 H1/D3 H2/D4 ペア
      - id: nukemaru-kshori
        name: パラスレイ K処理 (1回目バリアント)
        description: |
          パラスレイの 1回目を K処理で行うバリアント。Game8 マクロは X処理だが
          「1回目は K処理することも多い」と注記あり。PT 募集時に必ず流派確認すること。
          詳細処理は ぬけまる別解動画 / Lodestone 等で要確認。
    tips:
      - "パラスレイは X処理 (Game8 マクロ) と K処理 (1回目バリアント) があるので募集確認必須。"
      - "カロリック1 (もちべ式) は風炎 ABCD の時計回り順序を厳守 (MTSTH1H2D1D2D3D4)。"
      - "パンゲネシスで無職スライムは 西:1マーカー / 東:2マーカー に分かれる。"
      - "カロリック2 はマーカーが MT と交代になる点が 1 回目との違い。"
      - "最終サモンダークネス線処理は MT/D1 ST/D2 H1/D3 H2/D4 のペアを崩さない。"

