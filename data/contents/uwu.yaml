      /p 【乱撃タンクLB3法】\r

      /p 　　　　A　　　　\r

      /p 　　 ST　　\r

      /p  　D　   ★　    B　　※★はヒラ・DPS\r

      /p 　　　　　MT\r

      /p 　　　　C\r

