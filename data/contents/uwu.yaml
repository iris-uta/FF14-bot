      /p ・ST：メソハイ処理、タンクLB3　　MT：アルテマ詠唱リプ\r

      /p 【エーテル波動】ST：LB1\r

      /p 【紫玉】MT：AB間→AD間　ST：BC間　その他：CD間\r

      /p 【三蛮神】\r

      /p 　・ガル(A北→A→2)→イフ(2→3)→タコ(3→2.3間→3)\r

      /p 　・イフ(２→3)→ガル(A北→A→2)→タコ(２→2.３間→2)\r

      /p 　・タコ(２→2.3間→2)→イフ(2→3)→ガル(A北→A→2)\r

      /p 　※イフの時スプリント使用"
recruitmentTemplates:
  - template: |-
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}    # 例: MT, ST, 近接, レンジ

      ▼固定の目標
      ● {{goal}}                        # 例: 初絶クリア / リスタ周回
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}          # 例: 週4-5日 22:00-24:00 JST
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}          # 例: 新みんとっと(楔逆Z/ジェイル自滅/十字無視/3111/乱撃TLB)

      ▼必須事項
      {{requirements}}                  # 例: 絶経験者 or 煉獄編クリア、予習・復習可能

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle
