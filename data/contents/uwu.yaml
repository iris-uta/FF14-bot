id: uwu
displayName: 絶アルテマウェポン破壊作戦
shortName: UWU
type: ultimate
patch: "4.31"
phases:
  - id: p1
    name: P1 ガルーダ (Garuda)
    order: 1
    description: |-
      スリップストリーム、ミストラルソング、フェザーレイン、メソハイ、低気圧(ドーム処理)など。
      野良主流は「ドーム処理(低気圧)」+「メソハイMTキャス」
    videos:
      - title: P1 ガルーダ解説 【みんとっと】
        url: https://youtu.be/Sb6NfNCUWtM?si=wga2blrKf35-52Dr
        author: みんとっと
    mitigation:
      name: らすと (lastagous) 軽減表スプレッドシート (絶アルテマ Patch 4.31, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1C73RrIVV6sUoTxwUSiifMp_oktkxeOAWn9RbwbVrUOk/edit?usp=sharing
      copyable: true
    tips:
      - 覚醒バフは BH > D4 > D1 の順で取得。
      - ミストラルソングは MT B>A>C / ST D>C>A の順で誘導。
      - インシネレートは 1 回目 ST 無敵 / 2 回目 MT 無敵 (ナイト MT なら 1 回目無敵)。
  - id: p2
    name: P2 イフリート (Ifrit)
    order: 2
    popularStrategy: 楔:逆Z
    description: |-
      クリムゾンサイクロン、エラプション、炎獄の楔、灼熱の咆哮など。
      「インシネレート1回目ST/2回目MT」。
      野良主流は「楔:逆Z」処理。①D1 ②D2 ③D3 ④D4 の順で楔を破壊。
    videos:
      - title: P2 イフリート解説 【みんとっと】
        url: https://youtu.be/qoI6B2QZxb8?si=BEVMlR6Kls-QhK0H
        author: みんとっと
    tips:
      - "楔配置: 上段に ③ ④、下段に D3 ① ② D4 (逆 Z 字)。"
      - エラプ誘導は D3D4 が担当した後に楔処理へ移行。
  - id: p3
    name: P3 タイタン + アルテマ履行LB
    order: 3
    popularStrategy: ジェイル自滅式 (重み2回目で ST/メレー/レンジが被弾死)
    description: |-
      大地の重み、ランドスライド、グラナイトジェイル。
      アルテマ履行(LB3)フェーズへ繋がる。
      野良主流は「ジェイル自滅式 (重み2回目で ST/メレー/レンジが被弾死)」+
      「マウンテンバスター 1回目 MT / 2回目 ST(かばう) / 3回目 MT」。
    videos:
      - title: P3 タイタン＆LBフェーズ解説 【みんとっと】
        url: https://youtu.be/-hAfONuZEcE?si=ELfei57MX6PSBTQR
        author: みんとっと
    tips:
      - "ジェイル位置: ボス D4 / H1 / H2。ランスラ斜め誘導。"
      - マウンテンバスター 1回目&3回目は MT バフ / 2回目は ST バフ(orかばう)。
      - "アルテマ履行 LB 使用順: D4 -> H2 -> D1 -> MT。"
  - id: p4
    name: P4 追撃の究極幻想
    order: 4
    popularStrategy: 十字無視法
    description: |-
      アルテマウェポン本体フェーズの前半。
      誘導レーザー(吸着爆雷)、激震、フェザーレイン、ジェイル、十字範囲など。
      野良主流は「十字無視法」(十字範囲を安置判定で無視して位置取り)。
    videos:
      - title: P4 アルテマフェーズ序 解説 【みんとっと】
        url: https://youtu.be/iSZOcsMIKhQ?si=KAqiSXCwORaBJTRD
        author: みんとっと
    tips:
      - 吸着爆雷(ヘイト1位)は MT 無敵 -> 激震後半で ST 挑発。
      - 誘導レーザー(ヘイト2位)は追撃中は MT 無敵 / 爆撃中は ST 無敵。
  - id: p5
    name: P5 爆撃の究極幻想
    order: 5
    popularStrategy: 3111 (緑玉3-1-1-1配分)
    description: |-
      アルテマウェポン本体フェーズの中盤。
      緑玉、メソハイ、灼熱など。
      野良主流は「3111 (緑玉3-1-1-1配分)」処理。
    videos:
      - title: P5 アルテマフェーズ 中 解説【みんとっと】
        url: https://youtu.be/fjDJattJTi4?si=LX_sM3Wr5bH9WtnQ
        author: みんとっと
    tips:
      - 緑玉 1 回目は MT/ST/D1 の 3 人で処理。
      - 灼熱はヒラがメソハイ線取り (2 回目)。
  - id: p6
    name: P6 乱撃+最終三蛮神
    order: 6
    popularStrategy: 乱撃TLB (タンクLB3顔面受け)
    description: |-
      アルテマウェポン本体フェーズの終盤。乱撃 (タンクLB3 ※顔面受け)、
      アルテマ詠唱、エーテル波動、紫玉、そして
      最終三蛮神ルーレット (ガルーダ/イフリート/タイタン のランダム順序処理) 。

      野良主流は「乱撃TLB (タンクLB3顔面受け)」+「紫玉 4 隅散開」。
    videos:
      - title: P6アルテマフェーズ 終 解説【みんとっと】
        url: https://youtu.be/gQK6JOK7nZw?si=VIhwqVzIKTH3WKHi
        author: みんとっと
    tips:
      - 乱撃顔面受けは ST が LB3。ヒラは堅実魔で詠唱中断回避。
      - "紫玉散開: MT AB間->AD間 / ST BC間 / その他 CD間。"
      - 最終三蛮神の移動ルートはパターン分岐。事前にホットバーカンペ準備推奨。
