id: uwu
displayName: 絶アルテマウェポン破壊作戦
shortName: UWU
type: ultimate
patch: "4.31"
phases:
  - id: p1
    name: P1 ガルーダ (Garuda)
    order: 1
    popularStrategy: ドーム処理(低気圧)
    description: |
      開幕フェーズ。スリップストリーム、ミストラルソング、フェザーレイン、サーマルロウ、
      メソハイ、ウィキッドウィール、ウィキッドトルネード、低気圧(ドーム処理)など。
      所要時間 約2分43秒。
      野良主流は「ドーム処理(低気圧)」+「メソハイMTキャス」+「インシネレート1回目ST/2回目MT」。
    videos:
      - title: FF14 みんとのギミック解説 絶アルテマウェポン ガルーダ編(メソハイMTキャス)
        url: https://www.youtube.com/watch?v=zZ6qhddIO3I
        author: みんとっと
      - title: FF14 みんとのギミック解説 絶アルテマ破壊作戦 ガルーダ編 MT視点 (メソハイキャスMT)
        url: https://www.youtube.com/watch?v=iWQmHY19zt0
        author: みんとっと
    mitigation:
      name: らすと (lastagous) 軽減表スプレッドシート (絶アルテマ Patch 4.31, 全Phase)
      url: https://docs.google.com/spreadsheets/d/1C73RrIVV6sUoTxwUSiifMp_oktkxeOAWn9RbwbVrUOk/edit?usp=sharing
      copyable: true
    strategies:
      - id: dome-shori
        name: ドーム処理 (低気圧)
        description: |
          低気圧 (サーマルロウ/メソハイ) の被弾優先度を「ST > ST/H1/H2/D3/D4 > D1 > D2」で
          回す野良主流処理法。初動 ST 受けで誘導距離を最小化する。
      - id: mesohigh-mt-cast
        name: メソハイ MT キャス担当
        description: |
          メソハイ線取りを D 側に D4、B 側に MT (キャスター MT 想定) で取る流派。
          みんとっと動画準拠で野良主流。
  - id: p2
    name: P2 イフリート (Ifrit)
    order: 2
    popularStrategy: 楔:逆Z
    description: |
      クリムゾンサイクロン、レイディアントプルーム、エラプション、炎獄の楔、灼熱の咆哮など。
      所要時間 約2分37秒。
      野良主流は「楔:逆Z」処理。①D1 ②D2 ③D3 ④D4 の順で楔を破壊。
    videos:
      - title: FF14 みんとのギミック解説 絶アルテマウェポン破壊作戦 イフリート編(楔逆Z)
        url: https://www.youtube.com/watch?v=LCjYKOImeuM
        author: みんとっと
    strategies:
      - id: kusabi-gyaku-z
        name: 楔:逆Z (野良主流)
        description: |
          炎獄の楔を逆 Z 字配置で①〜④の順に破壊する流派。
          ①D1 / ②D2 / ③D3 / ④D4 が担当。
          D3D4 はエラプ誘導から楔へ。みんとっと動画準拠。
  - id: p3
    name: P3 タイタン + アルテマ履行LB (Titan + Limit Break Phase)
    order: 3
    popularStrategy: ジェイル自滅式 (重み2回目で ST/メレー/レンジが被弾死)
    description: |
      ジオクラッシュ、ロックバスター、マウンテンバスター、大地の重み、ランドスライド、
      グラナイトジェイル、タムルトなど。タイタン討伐後、ヘイブンスインビョクスから
      アルテマ履行(LB3)フェーズへ繋がる。
      所要時間 約4分27秒 (タイタン本体)。
      野良主流は「ジェイル自滅式 (重み2回目で ST/メレー/レンジが被弾死)」+
      「マウンテンバスター 1回目 MT / 2回目 ST(かばう) / 3回目 MT」。
    videos:
      - title: FF14 みんとのギミック解説 絶アルテマ破壊作戦 タイタン編
        url: https://www.youtube.com/watch?v=cJaNpDkBwu4
        author: みんとっと
      - title: FF14 みんとのギミック解説 絶アルテマウェポン タイタン＆LB編
        url: https://www.youtube.com/watch?v=2safeyumQ9o
        author: みんとっと
    strategies:
      - id: jail-jimetsu
        name: ジェイル自滅式 (4連スキップ)
        description: |
          重み 2 回目で ST/D1/D2/D3 が自滅して人数を減らし、
          3 連ジェイル + 4 連ジェイルを処理する野良主流。
          蘇生先は H1->ST / H2->D1 / D4->D2,D3。
          みん学 (4連スキップ) ジェイル自滅 TLB 法プレイリスト参照。
          Source: https://www.youtube.com/playlist?list=PL2Hitw4uipFQQ8svogk788A9eWSPtz33M
  - id: p4
    name: P4 追撃の究極幻想 (Annihilation - Predation)
    order: 4
    popularStrategy: 十字無視法
    description: |
      アルテマウェポン本体フェーズの前半。誘導レーザー(吸着爆雷)、激震、
      フェザーレイン、ジェイル、十字範囲など。所要時間 約1分38秒。
      野良主流は「十字無視法」(十字範囲を安置判定で無視して位置取り)。
    videos:
      - title: FF14 みんとのギミック解説 絶アルテマウェポン 追撃の究極幻想
        url: https://www.youtube.com/watch?v=ENn9O274DMw
        author: みんとっと
    strategies:
      - id: juuji-mushi
        name: 十字無視法 (安置判定)
        description: |
          十字範囲攻撃を安置判定で無視して位置取りを最適化する流派。
          フェザーレイン回避方向は ★ -> A -> D。
          ジェイル破壊はフェザーレイン回避時にターゲット可能。
  - id: p5
    name: P5 爆撃の究極幻想 (Annihilation - Bombardment)
    order: 5
    popularStrategy: 3111 (緑玉3-1-1-1配分)
    description: |
      アルテマウェポン本体フェーズの中盤。緑玉(エメラルドレディアンス)、
      ノックバック、メソハイ、灼熱など。所要時間 約58秒。
      野良主流は「3111 (緑玉3-1-1-1配分)」処理。
    videos:
      - title: FF14 ⑤絶アルテマ きりたんたちと学ぶ アルテマフェーズ(中)
        url: https://www.youtube.com/watch?v=fjDJattJTi4
    strategies:
      - id: san-ichi-ichi-ichi
        name: 3111 (緑玉 3-1-1-1 配分)
        description: |
          緑玉(エメラルドレディアンス)を 3-1-1-1 で配分する野良主流。
          1 回目は MT/ST/D1 / 2-4 回目は MT が処理。
          爆撃 P メソハイは 1 回目 D3 / 2 回目 灼熱ヒラ。
  - id: p6
    name: P6 乱撃+最終三蛮神 (Annihilation - Final + Primal Roulette)
    order: 6
    popularStrategy: 乱撃TLB (タンクLB3顔面受け)
    description: |
      アルテマウェポン本体フェーズの終盤。乱撃 (タンクLB3 ※顔面受け)、
      アルテマ詠唱、エーテル波動、紫玉(パープルレディアンス)、そして
      最終三蛮神ルーレット (ガルーダ/イフリート/タイタン のランダム順序処理) で締める。
      所要時間 約2分28秒。
      野良主流は「乱撃TLB (タンクLB3顔面受け)」+「紫玉 4 隅散開」。
    videos:
      - title: FF14 みんとのギミック解説 絶アルテマ破壊作戦 完結編(3111 乱撃インビン)
        url: https://www.youtube.com/watch?v=QpuleeUOHh0
        author: みんとっと
      - title: D4特化型 絶アルテマウェポン超絶シンプル破壊大作戦解説
        url: https://www.youtube.com/watch?v=74_JclZrORA
    strategies:
      - id: ranhageki-tlb
        name: 乱撃 TLB (タンクLB3 顔面受け)
        description: |
          乱撃を ST のタンク LB3 (顔面受け) で処理する野良主流。
          D マーカー誘導 -> 外周避け + ST メソハイ -> D 集合。
          MT がアルテマ詠唱 LB3、ST がエーテル波動 LB1 を担当。
      - id: final-3-primals
        name: 最終三蛮神ルーレット (3パターン分岐)
        description: |
          最終三蛮神はガルーダ/イフリート/タイタンのスタートがランダム。
          ①ガルーダスタート (イフ→タコ)
          ②イフリートスタート (ガル→タコ)
          ③タイタンスタート (イフ→ガル)
          各パターンで移動ルートが異なる。スプリントをイフリート処理に合わせる。
