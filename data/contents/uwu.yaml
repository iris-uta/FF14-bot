recruitmentTemplates:
  - source: 「【初絶歓迎！】絶テマ草案【@MT,ST,近接,レンジ】」(Lodestone 用 BBCode テンプレ)
    template: |
      ▼募集ジョブ
      ● 活動DC: {{datacenter}}
      ● 言語: {{language}}
      ● ロール: {{recruitingRoles}}    # 例: MT, ST, 近接, レンジ

      ▼固定の目標
      ● {{goal}}                        # 例: 初絶クリア / リスタ周回
      ● 攻略期間が超過した場合: {{overrunPolicy}}
      ● 踏破後の周回/消化: {{postClearPolicy}}

      ▼基本事項
      ● 活動時間: {{schedule}}          # 例: 週4-5日 22:00-24:00 JST
      ● VC: Discord (聞き専 {{listenOnlyPolicy}})
      ● 攻略方針: {{strategy}}          # 例: 新みんとっと(楔逆Z/ジェイル自滅/十字無視/3111/乱撃TLB)

      ▼必須事項
      {{requirements}}                  # 例: 絶経験者 or 煉獄編クリア、予習・復習可能

      ▼禁止事項
      {{prohibitions}}

      ▼コンタクト
      Discord: {{discordHandle}}
      X: {{xHandle}}
    variables:
      - datacenter
      - language
      - recruitingRoles
      - goal
      - overrunPolicy
      - postClearPolicy
      - schedule
      - listenOnlyPolicy
      - strategy
      - requirements
      - prohibitions
      - discordHandle
      - xHandle
