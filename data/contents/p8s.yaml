# 要手動補完メモ
# ────────────────────────────────────────────────────────
# - ヘファイストスの公式声優情報は本ファイル作成時点で未確認。
# - 概念支配 (High Concept) のデバフ詳細 (早α/遅β/複/重/単 等) の意味は
#   ぬけまる動画 + Lodestone Shimaji Row で予習必須。
# - 「はいじあ式」「ビジョン式」「リシュア式」など複数流派あり。
#   Game8 採用は「はいじあ/ビジョン式」(マクロVer1)。
# - 万象灰燼 (Ego Death) は Immortal Conception (3デバフ合成バフ) で生存可能になる
#   仕様。デバフの色組み合わせを正確に作る必要あり。
# - 当時 Top50 マウント報酬「タイマット (Tiamat)」配布対象だったが現在は配布終了。
# - 旧コンテンツのため野良募集は閑散としており、固定 or 経験者 PT 必須。
