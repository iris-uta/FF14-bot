# 至天の座アルカディア：ヘビー級零式 3層 - ザ・タイラント / キング・オブ・アルカディア (M11S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 M11S、Game8/JP では「ヘビー級零式3層」「アルカディア零式3層」。
# - 公式タイトル「ザ・タイラント」(CV.濱野大輝)、バトルフィールド上の表記は
#   「キング・オブ・アルカディア」。本ファイルではボス名併記。
# - 統一王者 (Unified Champion)。
# - Game8 採用流派: 「ぬけまる様式」(基本ルクレ + ドミネ安置北 + チャンピオンズメテオ ジジ式
#   + スタンピード DXA 式)。

id: m11s
displayName: 至天の座アルカディア：ヘビー級零式 3層 (ザ・タイラント / キング・オブ・アルカディア)
shortName: M11S
type: savage
patch: "7.4"
# ノーマル実装日: 2025-12-16 / 零式実装日: 2026-01-06
# Source: https://ffxiv.consolegameswiki.com/wiki/The_Arcadion
# Source: https://leprestore.com/guides/ffxiv/arcadion-heavyweight/

phases:
  - id: p1
    name: P1 武器ジェネレート (Weapon Generate) 〜 メテオレイン
    order: 1
    description: |
      開幕〜中盤フェーズ。
      主要技:
        - キング・オブ・アルカディア (全体)
        - ウェポンジェネレート・バスター (タンク強)
        - トロフィーウェポン (剣・鎌・斧の3種類武器選択ギミック)
        - コメットレイン (ボス背面から時計回り誘導)
        - ウェポンジェネレート・ドミネーション (安置北基準)
        - ザ・ミールストーム (中央吸引)
        - アルティメット・トロフィーウェポン
        - ワン・アンド・オンリーフェーズ
        - ファイアストリーム
        - メテオレイン (3回連続、隕石処理)
      野良主流: ぬけまる様式 (Game8 採用)。
    # Source: https://game8.jp/ff14/755154
    # Source: https://na.finalfantasyxiv.com/lodestone/character/34025302/blog/5645096
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア ヘビー級:零式 / 全層, Patch 7.4 対応)
      # M9S-M12S 全層を 1 ブックで管理。詳細は M9S を参照。
      # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5642585/
      url: https://docs.google.com/spreadsheets/d/1mSfKgAq1RwXLG3IdL6tgIk8SHtdtOI1utXQkWr-iOq0/edit?usp=sharing
      copyable: true
    videos:
      - title: 【FF14】ヘビー級零式3層 攻略解説【ぬけまる】
        url: https://www.youtube.com/watch?v=9fMy4yJRNTM
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/755154) で参照されている動画
    strategies:
      - id: nukemaru-game8
        name: ぬけまる様式 (Game8 採用版)
        description: |
          Game8 採用流派。
          - 基本: ルクレ (基本散開)
          - ドミネーション: 安置を北基準に処理
          - オービタル: 北固定
          - メテオレイン: H 遠近 (H1: 南西遠、H2: 北東タゲサ上 など、3回ローテーション)
          - チャンピオンズ・メテオ: ジジ式位置固定
          - メテオスタンピード: DXA 式

  - id: p2
    name: P2 チャンピオンズ・メテオ 〜 ハートブレイクキック (時間切れ)
    order: 2
    description: |
      後半フェーズ。チャンピオンズ・メテオから始まり、メテオスタンピード、
      最終的にハートブレイクキック (時間切れ) で終了。
      主要技:
        - チャンピオンズ・メテオ (塔踏み2セット、ジジ式位置固定)
        - メテオスタンピード (DXA 式: 沼捨て+範囲捨て+塔)
        - フォーウェイ (X字ペア / 内側誘導)
        - ツーウェイ (東西4:4)
        - ハートブレイクキック (時間切れ)
    # Source: https://game8.jp/ff14/755154

# ────────────────────────────────────────────────────────
# マクロ (コピペ用)
# ────────────────────────────────────────────────────────
macros:
  - source: Game8 (ゲームエイト) - ヘビー級零式3層 ぬけまる様式 (前半)
    url: https://game8.jp/ff14/755154
    # 最終更新: 2026-03-12 (Game8 ページの最終更新日)
    # Game8 上では 2 本に分かれて掲載。本ファイルでは前半 (基本散開〜メテオレイン) を掲載。
    text: |
      /p ■基本散開　　■ミールストーム誘導
      /p 　D3 MT D4 　　 　D3MT
      /p 　H1 ☆ H2 　　　H1　　D4
      /p 　D1 ST D2　　　D1　　H2
      /p 　　　　　　　 　 　 STD2
      /p ■コメットレイン：ボス背面から時計周り
      /p ■ドミネーション：安置を北に見て
      /p 　H1D3 H2D4
      /p 　MTD1 ★ ST D2
      /p ■メテオレイン
      /p 1回目　H1:南西遠　　　　H2:北東タゲサ上
      /p 2回目　D3:南西中間　　　D4:南東タゲサ上
      /p 3回目　D1:南西タゲサ上　 D2:北東タゲサ上
      /p タンク線取り(隕石基準)　　MT:23マカ、ST:4マカ

  - source: Game8 (ゲームエイト) - ヘビー級零式3層 ぬけまる様式 (後半 / チャンピオンズメテオ〜)
    url: https://game8.jp/ff14/755154
    # Game8 上の後半マクロ。チャンピオンズメテオ以降。
    text: |
      /p ■チャンピオンズメテオ（ジジー式位置固定）
      /p ◯塔踏み1回目 ※範囲捨てボス下から割れ目沿い南北
      /p 　MTD3　H2D4
      /p 　H1D1　 ST D2
      /p ◯塔踏み2回目：1回目処理位置近くに同じペアで入る
      /p ■メテオスタンピード（DXA式）
      /p 沼捨て： 北 H1D3 / 南 H2D4 (D調整)
      /p 範囲捨て：ボス下→A→時計回り
      /p 〈MT、近接ペア〉1から時計回り塔
      /p 〈ST 、遠隔ペア 〉4から反時計回り塔
      /p 線持ち：穴を背にして右前に伸ばす
      /p 【フォーウェイ】X字ペア
      /p 〈内側誘導〉①北沼 ②無職近接 ③南沼 ④無職遠隔
      /p 【ツーウェイ】東西4:4
      /p 〈内側誘導〉西:反時計2人塔線無、東:時計2人塔線無

