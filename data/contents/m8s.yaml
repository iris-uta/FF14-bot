# 至天の座アルカディア：クルーザー級零式 4層 - ハウリングブレード (M8S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際/FFLogs では M8S、Game8/JP では「クルーザー級零式4層」「クルーザー4層」。
# - 公式肩書: 「孤高の狼」、本名: レザラ。
# - 背景: 元駆除人。クルーザー級の現王者で「善玉闘士」と呼ばれている。
# - 魂の源: 魔狼フェンリル (FF9 召喚獣)。
# - 特徴: 光剣とビットを使用。素早さと鋭さを併せ持つ斬撃が特徴。
# - 後半では土と風のフェンリルの力をすべて取り込み巨大化する。
# - BGM: 『Unleashed』『Peerless』(Jason Charles Miller 歌唱)。
#   Source: ファミ通 https://www.famitsu.com/article/202505/42745
# - 4層は前半 (Part1) と後半 (Part2) の2部構成で実装。
# - Game8 採用流派: ぬけまる様マクロ (前半:イディル土修正/風化IQ6000/狐狼Alice/81128,
#   後半: 魔印正規/狐狼Alice/81128)。

id: m8s
displayName: 至天の座アルカディア：クルーザー級零式 4層 (ハウリングブレード)
shortName: M8S
type: savage
patch: "7.2"
# パッチ実装日: 2025-03-25 (Patch 7.2)
# 零式実装日: 2025-04-01
# Source: https://www.famitsu.com/article/202503/36584
# Source: https://ffxiv.consolegameswiki.com/wiki/The_Arcadion

phases:
  - id: p1
    name: P1 ハウリングブレード 前半 (土・風の魔技) — M8S Part 1
    order: 1
    description: |
      Part 1 (前半)。土と風のフェンリルを操る戦闘。
      主要技:
        - 空間斬り (タンク強攻撃)
        - 土の魔技 (MTD4/D3/H1/D1ST/H2/D2 の配置)
        - 風の魔技 / 千年の風化 (IQ6000式: MT/D3 H2/D4 H1/D1 ST/D2、塔ズレ時計)
        - 薙の群狼剣 (MT/ST 北 / H1組 H2組)
        - 廻の群狼剣 (中央 ★ / MT/ST / H1組 H2組)
        - 大地の呼び声 + 斬空剣
        - 光狼招来 (分身ギミック)
        - 大地の怒り (風化散開 + 安置時計回り or ズレ時計回り)
        - 幻狼招来 (MT/D3 / ST/D4 / H1/D1 ST/D2 配置)
      野良主流: ぬけまる様マクロ (イディル土修正 / 風化IQ6000 / 狐狼Alice / 81128 構成)。
    # Source: https://game8.jp/ff14/681843
    mitigation:
      name: Last Agous / らすと 軽減表 (アルカディア クルーザー級:零式 [1-4層対応])
      # M5S-M8S 全層を 1 ブックで管理。
      # Source: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5540581/
      url: https://na.finalfantasyxiv.com/lodestone/character/12440293/blog/5540581/
      copyable: true
    videos:
      - title: 【FF14/解説】GAME8準拠 クルーザー級 4層 前半 解説 マクロ有【ぬけまる】(M8S-1)
        url: https://www.youtube.com/watch?v=Pqxs9VBKn74
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/681843) で参照されている動画
    strategies:
      - id: nukemaru-idyll-mod
        name: ぬけまる様マクロ (Game8 採用 / イディル土修正 / 風化IQ6000)
        description: |
          ぬけまる様 + イディルシャイア居住区様の土修正版を融合した流派。
          - 土の魔技: MTD4 / D3 / H1 / D1ST / H2 / D2 の配置。
          - 風の魔技 / 千年の風化 (IQ6000式):
            MT/D3 H2/D4 / H1/D1 ST/D2、塔ズレ時計、回転中に前=近接 / 南北=遠隔 / 後=無職。
          - 群狼剣 (薙/廻): 北 MT/ST → 中央 H1組/H2組 へ移行。
          - 大地の怒り:
            ① 風化散開 → 安置時計回り、頭割り中央。
            ② 風化散開 → ズレ時計回り、頭割り北。
          - 幻狼招来: MT/D3 (頭割り) / H2/D4 / H1/D1 ST/D2。

  - id: p2
    name: P2 ハウリングブレード 後半 (フェンリル巨大化 / アルティメット) — M8S Part 2
    order: 2
    description: |
      Part 2 (後半)。土と風のフェンリルの力を全て取り込み巨大化したハウリングブレード戦。
      主要技:
        - クエイガ / 1-3 魔光 (青マカ上から北島→その場→南島)
        - 双牙撃 (西島:MT / 東島:ST)
        - 風震の魔印 (正規処理: 頭割りは風撃タンク隣島)
        - 風狼陣 / 双牙暴風撃 (D1D3 / D2D4 配置、線・誘導処理)
        - 孤狼の呪い (Alice式: Tニア北東 / Tファー西 / H不動 / Dニア線南北判定 / Dファー線南北判定)
        - 八連光弾 (時間切れ前: 2=MT無敵 / 3=ST無敵 / 4=T二人フルバフ)
      野良主流: ぬけまる様 魔印正規 / 狐狼Alice / 81128 構成 (Game8 採用)。
    # Source: https://game8.jp/ff14/681846
    # Source: https://note.com/feenal/n/n30ea48699717
    videos:
      - title: 【FF14】クルーザー級零式 4層後半 攻略解説【ぬけまる】(M8S Part 2)
        url: https://www.youtube.com/@nukemarugames/videos
        author: ぬけまるG
        # Source: Game8 (https://game8.jp/ff14/681846) で参照されている動画
        # 注: ぬけまるG チャンネル内の M8S Part 2 動画 (具体的な watch URL は要確認)
    strategies:
      - id: nukemaru-maxin-alice
        name: ぬけまる様マクロ (Game8 採用 / 魔印正規 / 狐狼Alice / 81128)
        description: |
          Game8 採用流派。
          - 風震の魔印: 正規処理 (頭割りは風撃タンク隣島)。
          - 双牙撃: 西島=MT / 東島=ST。
          - 孤狼の呪い: Alice式 (T/H/D の位置とライン誘導を分岐固定)。
            * Tニア: 北東 / Tファー: 西 / H: 不動
            * Dニア: 線が北伸び→北東 / 南伸び→南
            * Dファー: 線が北伸び→不動 / 南伸び→北東
          - 八連光弾: 2=MT無敵 / 3=ST無敵 / 4=T二人フルバフ。

