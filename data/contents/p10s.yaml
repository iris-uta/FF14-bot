# パンデモニウム零式：天獄編 2層 - パンデモニウム (P10S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - 通称: 国際 P10S (Pandæmonium Anabaseios Tenth Circle Savage)、
#   Game8 / JP コミュニティでは「天獄編2層」「天獄2」が一般的。
# - ボス正式名称: 「パンデモニウム」(Pandæmonium)
#   暁月のフィナーレ・万魔殿パンデモニウム本人 (=ボス) との対峙。
# - 実装パッチ: 6.41 (零式)、6.4 (ノーマル)
#   零式実装日: 2023-05-30
# - Game8 マクロ採用流派: 「犬丸改FFO式」(犬丸様の攻略動画ベース)
#   別解として「ぬけまる様の魔殿の震撃ボンドマクロ」も補足掲載。
# - 本ファイルは Game8 (https://game8.jp/ff14/532718) から WebFetch (2026-05-25) で取得。

id: p10s
displayName: パンデモニウム零式：天獄編 2層 (パンデモニウム)
shortName: P10S
type: savage
patch: "6.41"
# Source: https://ffxiv.consolegameswiki.com/wiki/Anabaseios:_The_Tenth_Circle_(Savage)
# Source: https://na.finalfantasyxiv.com/lodestone/character/29231383/blog/5231433 (ボス名出典)

phases:
  - id: p1
    name: P1 パンデモニウム 通し (Pandæmonium)
    order: 1
    description: |
      パンデモニウム戦。1ボス完結型。クモ・ウェブ系のギミックがメイン。
      主要技:
        - ディバイドウィング + ヘビーウェブ (1回目)
        - 尖脚 + グランドウェブ + パンデモニックピラー
        - スピットウェブ
        - パンデモニックボンド (1〜4回目、ダブル/クアドラの組み合わせ)
        - パンデモニックタレット
        - パンデモニックレイ
        - ディバイドプルーム
        - 魔殿の震撃 (タッチダウン時は西島集合)
      野良主流: 犬丸改FFO式 (Game8 採用)、補足としてぬけまる様の震撃ボンドマクロ併用。
    # Source: https://game8.jp/ff14/532718
    videos:
      - title: 【FF14】解説 天獄編零式2層 犬丸改FFO式
        url: https://www.youtube.com/watch?v=B0cH0HmcPk4
        author: 犬丸
        # 注: Game8 で参照されている動画。実際の URL は要再確認 (犬丸様の P10S 解説動画)。
    strategies:
      - id: inumaru-ffo
        name: 犬丸改FFO式 (Game8 採用版)
        description: |
          Game8 が採用している犬丸様の攻略動画ベースの処理法。
          - 尖脚: 左 MT / 右 ST
          - グランドウェブ: 左 H / 右 DPS
          - パンデモニックピラー: ST H1 MT // D1 H2 D2 // D3 D4 など細かい配置あり
          - スピットウェブ: MT/ST 北側、内側 D1/D2、H1 中央、外側 D3/D4、H2 南
          - ヘビーウェブ (1回目): 左 TH / 右 DPS、扇北向け、頭割り南で横並び、線クロスしない
          - ボンド (西島/片面/震撃): MT D1 / ST D2 / H1 D3 / H2 D4 縦並び
            ダブル: MTD1 STD2 H1D3 H2D4
            クアドラ: MTSTH1H2 / D1D2D3D4
            タッチダウン時は西島に8人入って処理
          - タレット: 西 H1MT→D3MT→D1MT→MT / 東 H2ST→D4ST→D2ST→ST
            3番レーザーは4番タレットに向けて角度調整
      - id: nukemaru-shingeki
        name: ぬけまる様 魔殿の震撃ボンド (補足)
        description: |
          魔殿の震撃ボンドの処理法だけ別解として記載されているもの。
          - ダブル(22) MT組:ST組: D1 MT ST D2 / D3 H1 H2 D4
          - クアドラ(44) TH組:DPS組: MT ST D1 D2 / H1 H2 D3 D4

# ────────────────────────────────────────────────────────
# マクロ (コピペ用)
# ────────────────────────────────────────────────────────
macros:
  - source: Game8 (ゲームエイト) - 天獄編零式2層 マクロ 1枚目 (犬丸改FFO式)
    url: https://game8.jp/ff14/532718
    # Source: WebFetch 2026-05-25 (Game8 P10S 攻略ページ)
    text: |
      /p ■尖脚 左MT 右ST
      /p ■グランドウェブ 左H 右DPS
      /p ■パンデモニックピラー-----------------------
      /p ST H1 MT 　　　　　　｜D1 MT ST D2
      /p D1 H2 D2　　　　　　｜
      /p D3 　　D4　　　　　　｜D3 H1 H2 D4
      /p ■スピットウェブ---｜■ヘビーウェブ(1回目)-----
      /p MT　　　　　　ST　　｜ 左TH 右DPS
      /p 　　D1 　　 D2 　　　｜ 扇北向け
      /p 　　　　H1 　　　　　｜ 頭割り南で横並び
      /p 　　D3 　　 D4 　　　｜ 線クロスしない
      /p 　　　　H2 　　　　　｜

  - source: Game8 (ゲームエイト) - 天獄編零式2層 マクロ 2枚目 (ボンド/タレット)
    url: https://game8.jp/ff14/532718
    text: |
      /p ■ボンド
      /p -西島/片面/震撃---------------ﾀﾚｯﾄ------------
      /p MT D1 　　　　　　　｜ D1 / MT ST / D2
      /p ST D2 　　　　　　　｜
      /p H1 D3 　　　　　　　｜ D3 / H1 H2 / D4
      /p H2 D4 　　　　　　　｜
      /p ダブル MTD1 STD2 H1D3 H2D4
      /p クアドラ MTSTH1H2 D1D2D3D4
      /p タッチダウン時は西島に8人入って処理
      /p ■タレット
      /p 西 H1MT → D3MT → D1MT → MT
      /p 東 H2ST → D4ST → D2ST → ST
      /p 3番レーザーは4番タレットに向けて角度調整

  - source: ぬけまる様 - 天獄編零式2層 魔殿の震撃ボンド補足マクロ
    url: https://game8.jp/ff14/532718
    # Game8 上に「補足」として掲載されている別解マクロ。
    text: |
      /p ■魔殿の震撃ボンド
      /p ダブル(22)MT組:ST組
      /p D1　MT　ST　D2
      /p D3　H1　 H2　D4
      /p クアドラ(44)TH組:DPS組
      /p MT　ST　D1　D2
      /p H1　H2　D3　D4

