id: p4s
displayName: 万魔殿パンデモニウム零式：辺獄編4層 (ヘスペロス)
shortName: P4S
type: savage
patch: "6.05"
phases:
  - id: p1
    name: P1 ヘスペロス 前半 (Part 1)
    order: 1
    description: |-
      Part 1 (前半)。ピナクス・毒線・緑玉ギミック中心。
      主要技:
        - 基本散開                          標準 8 人散開
        - 毒線 (YPP 式)                     TH 北 / DPS 南、塔線時計回り (線ぐるぐる)
        - ピナクス炎 (頭割り / シフト後)     MTH1 / STH2 ペア → シフト後 敵正面/背面分割
        - ピナクス毒 (散開 / シフト後)       MT 中央誘導、遠隔は適時外周
        - 緑玉脳死 (十字配置)               MTH2 / STH1 → D3D4 / D1D3 → MT / D2D4 → H1
                                            上記の玉を取って時計回りで処理
      野良主流: YPP 式 (毒線 YPP 緑玉脳死) - Game8 採用。
      DPS チェック前層比厳しめのため、装備 / 食事 / 薬使用 (最大 2 回) 必須。
    videos:
      - title: ゆっくりと振り返るパンデモニウム辺獄編零式4層(前半)
        url: https://www.youtube.com/watch?v=AH0mRxuJx7c
    mitigation:
      name: 軽減表テンプレ (P4S 前半 - パッチ 6.0x 攻略時の野良標準)
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
  - id: p2
    name: P2 ヘスペロス 後半 (Part 2 - 「劇」演出)
    order: 2
    description: |-
      Part 2 (後半)。序幕 → 第二幕 → 第三幕 → 第四幕 → 終幕 → カーテンコールの
      「劇」演出形式で進行。最終ギミック「カーテンコール」が時間切れ判定。
      主要技:
        - 序幕                              標準散開
        - 第二幕                            T/Hダージャ + エアロガ + DPSファイガ移動
        - 第三幕 (犬丸式)                   アースシェイカー誘導
        - 第四幕                            ウォタガ + ダージャ 塔処理、南西集合 → 時計回り
        - 終幕                              ボス基準散開 + 塔配置
        - カーテンコール                    TH 6 秒 / D 11 秒で切り (13/23/33/43)
      野良主流: 犬丸式 (および、ぬけまる式も Game8 で並列掲載)。
    videos:
      - title: ゆっくりと振り返るパンデモニウム辺獄編零式4層(後半)
        url: https://www.youtube.com/watch?v=GYCDnITC_jc
    mitigation:
      name: 軽減表テンプレ (P4S 後半 - パッチ 6.0x 攻略時の野良標準)
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
    tips:
      - 後半は『劇』演出形式で時間軸が長め。各幕の入りタイミングをコールするのが安定。
      - カーテンコールは最終ギミック。TH/D で切る秒数が違うので秒数を覚える。
      - 第二幕のダージャ切りは方角ベース、第三幕は犬丸式で誘導役固定。
macros:
  - source: Game8 (ゲームエイト) - 辺獄編零式4層前半 YPP 式
    url: https://game8.jp/ff14/421733
    text: |-
      /p 【基本散開】　　　　　【毒線YPP式】
      /p 　D3MTD4　　　　　TH：北　DPS：南
      /p 　H1 ◯ H2
      /p 　D1 ST D2　※塔線時計回り/線ぐるぐる
      /p 【ピナクス炎：頭割り】　【ピナクス炎：シフト後頭割り】
      /p 　MTH1 ● STH2　 　　敵正面：MTH1D1D3
      /p 　D1D3 　 D2D4　　　敵背面：STH2D2D4
      /p 【ピナクス毒：散開】　　【ピナクス毒：シフト後散開】
      /p 　 MT　●　 ST　　　　　 　MT
      /p 　 　D1　 D2　　　　 　 D1 〇 D2　　 ※MTは中央へ誘導
      /p 　D3H1　H2D4　 　　　　 ST　※遠隔は適時外周寄りに散開
      /p 【緑玉脳死・十字】
      /p 　STMTH2　※MTH2→D3　STH1→D4
      /p 　H1 ● D4　　 D1D3→MT　D2D4→H1
      /p 　D1D3D2　　上記の玉を取って時計回り
  - source: Game8 (ゲームエイト) - 辺獄編零式4層後半 犬丸式 (序幕〜第三幕)
    url: https://game8.jp/ff14/422515
    text: |-
      /p ―《序幕》――――――――――――――――――
      /p 　D3　　　　　D4
      /p 　　MT　　　ST
      /p 　　　　ボス
      /p 　　D1　　　D2
      /p 　H1　　　　　H2
      /p ―《第二幕》―――――――――――――――――
      /p 1番目にTダージャは北西、Hダージャは南東で切る
      /p エアロガは北西、Dファイガ南東
      /p DPSファイガ移動:時計回りD1D2D3D4反時計回り
      /p ―《第三幕(犬丸式)》―――――――――――――
      /p 　　D3　　　D3　 　　アースシェイカー誘導
      /p 　H1　　●　　H1　→ 　ST　　　　ST
      /p 　H2　　　　　H2　　D1 ● その他　● D1
      /p 　　D4　　　D4　　　　 D2　　　　D2
  - source: Game8 (ゲームエイト) - 辺獄編零式4層後半 犬丸式 (第四幕〜カーテンコール)
    url: https://game8.jp/ff14/422515
    text: |-
      /p ―《第四幕》――――――――――――――――
      /p ①ウォタガは塔の対角の１つ時計回り側で切る
      /p 　ダージャは自分の塔の時計回り側の塔を踏む
      /p ②南西集合し北のダージャから【時計回り】処理
      /p ―《終幕》―――――――――――――――――
      /p ●ボス基準散開
      /p 　D3　D1　　　ST　H2
      /p 　　 塔　【ボス】 塔
      /p 　D4　D2　　　MT　H1
      /p ―《カーテンコール》――――――――――――
      /p 　THは6秒で切りに行く
      /p 　Dは11秒で切りに行く
      /p 　（メモ：13/23/33/43）
