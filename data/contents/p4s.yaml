# 万魔殿パンデモニウム零式：辺獄編4層 - ヘスペロス (P4S)
# データ収集日: 2026-05-25
# 第一参照: Game8 (ゲームエイト)
#
# 注意:
# - シリーズ呼称について p1s.yaml 冒頭コメント参照。
# - 通称: 国際/FFLogs では P4S、Game8/JP では「辺獄編零式4層」「パンデ零4層」。
# - 公式ボス名: 「ヘスペロス」(英: Hesperos)。Asphodelos 最終ボス。
# - 4 層は前半 (Part 1) と後半 (Part 2) の 2 部構成。Game8 ページもそれぞれ別。
#   * 前半: 毒 / ピナクス / 緑玉 ギミック中心
#   * 後半: 序幕〜カーテンコールの「劇」演出ギミック (最終ギミックはカーテンコール)
# - 流派名: 前半は「YPP 式 (毒線 YPP 緑玉脳死)」、後半は「犬丸式 + ぬけまる式」併記。
# - 旧 tier (2022-01 実装) のため情報の散逸あり。Game8 + ARUTORA / Aqua Cat / ameblo 主体で収集。

id: p4s
displayName: 万魔殿パンデモニウム零式：辺獄編4層 (ヘスペロス)
shortName: P4S
type: savage
status: testing
patch: "6.05"
# ノーマル実装日: 2021-12-21 (Patch 6.01)
# 零式実装日:   2022-01-04 (Patch 6.05)
# 拡張: 暁月のフィナーレ (Endwalker)
# Source: https://ffxiv.consolegameswiki.com/wiki/Asphodelos:_The_Fourth_Circle_(Savage)

phases:
  - id: p1
    name: P1 ヘスペロス 前半 (Part 1)
    order: 1
    description: |
      Part 1 (前半)。ピナクス・毒線・緑玉ギミック中心。
      主要技:
        - 基本散開                          標準 8 人散開
        - 毒線 (YPP 式)                     TH 北 / DPS 南、塔線時計回り (線ぐるぐる)
        - ピナクス炎 (頭割り / シフト後)     MTH1 / STH2 ペア → シフト後 敵正面/背面分割
        - ピナクス毒 (散開 / シフト後)       MT 中央誘導、遠隔は適時外周
        - 緑玉脳死 (十字配置)               MTH2 / STH1 → D3D4 / D1D3 → MT / D2D4 → H1
                                            上記の玉を取って時計回りで処理
      野良主流: YPP 式 (毒線 YPP 緑玉脳死) - Game8 採用。
      DPS チェック前層比厳しめのため、装備 / 食事 / 薬使用 (最大 2 回) 必須。
    # Source: https://game8.jp/ff14/421733
    # Source: https://closedalpha.com/ffxiv-guide/ffxiv-pandemonium-fourth-circle-part1-dps/
    mitigation:
      name: 軽減表テンプレ (P4S 前半 - パッチ 6.0x 攻略時の野良標準)
      # P4S 前半専用の Last Agous シートを 2026 時点で確認できず。要手動補完。
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
    videos:
      - title: ゆっくりと振り返るパンデモニウム辺獄編零式4層(前半) #FF14
        url: https://www.youtube.com/watch?v=AH0mRxuJx7c
        # Source: 検索結果 (作者: ゆっくりシリーズ)
    strategies:
      - id: ypp-style-game8
        name: YPP 式 (毒線 YPP 緑玉脳死) - Game8 採用版
        description: |
          Game8 採用流派。
          - 基本散開: 標準 8 人配置
          - 毒線 YPP 式: TH 北 / DPS 南、塔線時計回り (線ぐるぐる)
          - ピナクス炎 頭割り: MTH1 / STH2 / D1D3 / D2D4 ペア
          - ピナクス炎 シフト後: 敵正面 MTH1D1D3 / 敵背面 STH2D2D4
          - ピナクス毒 散開: MT 中央誘導、遠隔は外周
          - 緑玉脳死: 十字配置で MTH2→D3 / STH1→D4 / D1D3→MT / D2D4→H1
            上記の玉を取った後、時計回りで処理

  - id: p2
    name: P2 ヘスペロス 後半 (Part 2 - 「劇」演出)
    order: 2
    description: |
      Part 2 (後半)。序幕 → 第二幕 → 第三幕 → 第四幕 → 終幕 → カーテンコールの
      「劇」演出形式で進行。最終ギミック「カーテンコール」が時間切れ判定。
      主要技:
        - 序幕                              標準散開
        - 第二幕                            T/Hダージャ + エアロガ + DPSファイガ移動
        - 第三幕 (犬丸式)                   アースシェイカー誘導
        - 第四幕                            ウォタガ + ダージャ 塔処理、南西集合 → 時計回り
        - 終幕                              ボス基準散開 + 塔配置
        - カーテンコール                    TH 6 秒 / D 11 秒で切り (13/23/33/43)
      野良主流: 犬丸式 (および、ぬけまる式も Game8 で並列掲載)。
    # Source: https://game8.jp/ff14/422515
    # Source: https://arutora.com/23843
    mitigation:
      name: 軽減表テンプレ (P4S 後半 - パッチ 6.0x 攻略時の野良標準)
      # P4S 後半専用の Last Agous シートを 2026 時点で確認できず。要手動補完。
      url: https://docs.google.com/spreadsheets/d/1pOQ3sMSUQx-E-zFJSFv5BbHIq27tASgH14WhM02k4NI/edit?usp=sharing
      copyable: true
    videos:
      - title: ゆっくりと振り返るパンデモニウム辺獄編零式4層(後半) #FF14
        url: https://www.youtube.com/watch?v=GYCDnITC_jc
        # Source: 検索結果 (作者: ゆっくりシリーズ)
    strategies:
      - id: inumaru-style-game8
        name: 犬丸式 (Game8 採用版・第三幕)
        description: |
          Game8 採用流派。第三幕アースシェイカー誘導に「犬丸式」を採用。
          - 序幕: 標準散開 (D3/D4 北、MT/ST 中段、D1/D2 / H1/H2 南)
          - 第二幕: 1 番目に T ダージャ北西 / H ダージャ南東で切り、エアロガ北西、
            D ファイガ南東、DPSファイガ移動は時計回り D1→D2→D3→D4 反時計回り
          - 第三幕 (犬丸式): アースシェイカー誘導は ST が左/D1 が中央/その他右
          - 第四幕: ウォタガは塔の対角の 1 つ時計回り側で切り、ダージャは自塔の時計回り側塔を踏む
            → 南西集合し北のダージャから時計回り処理
          - 終幕: ボス基準散開 + 塔配置
          - カーテンコール: TH 6 秒切り / D 11 秒切り (メモ: 13/23/33/43)
      - id: nukemaru-style
        name: ぬけまる式 (Game8 並列掲載)
        description: |
          Game8 ページ上で犬丸式と並列掲載されている別流派。
          主に第三幕の処理が異なる。詳細はぬけまる動画参照。
    tips:
      - "後半は『劇』演出形式で時間軸が長め。各幕の入りタイミングをコールするのが安定。"
      - "カーテンコールは最終ギミック。TH/D で切る秒数が違うので秒数を覚える。"
      - "第二幕のダージャ切りは方角ベース、第三幕は犬丸式で誘導役固定。"

