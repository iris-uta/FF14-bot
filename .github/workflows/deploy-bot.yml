name: Deploy bot to Fly.io

# Deploys the Discord bot whenever main updates files that affect the bot.
# Skip on docs-only changes to avoid burning Fly machine starts.
#
# Setup:
#   1. Create a Fly deploy token: https://fly.io/user/personal_access_tokens
#   2. Add to repo Settings → Secrets and variables → Actions → New secret:
#        Name: FLY_API_TOKEN
#        Value: <token from step 1>
#   3. Push to main — the workflow runs automatically.

on:
  push:
    branches: [main]
    paths:
      - "apps/bot/**"
      - "packages/db/**"
      - "packages/schema/**"
      - "data/**"
      - "fly.toml"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-bot.yml"
  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io (Tokyo)
    runs-on: ubuntu-latest
    concurrency:
      # Serialize deploys — never run two `fly deploy` against the same app at once.
      group: deploy-bot-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
