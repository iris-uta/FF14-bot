# Fly.io configuration for 固定支援Bot (Discord bot for FF14 statics).
#
# First-time setup:
#   1. `fly apps create ff14-kotei-bot` (or rename `app` below to your unique name)
#   2. `fly volumes create ff14_kotei_data --size 1 --region nrt`
#   3. `fly secrets set DISCORD_TOKEN=xxx DISCORD_CLIENT_ID=xxx`
#      (DISCORD_GUILD_ID is optional — set for guild-scope commands during dev)
#   4. `fly deploy`
#
# See docs/deploy.md for the full walkthrough.

app = "ff14-kotei-bot"
primary_region = "nrt"           # Tokyo (close to JP users)

[build]
  dockerfile = "apps/bot/Dockerfile"

# Re-register slash commands on every deploy (idempotent — Discord upserts).
# Runs after build, before the new machine receives traffic.
[deploy]
  release_command = "node --enable-source-maps ../../node_modules/.bin/tsx src/register-commands.ts"

# Persistent SQLite storage. Auto-created on first deploy via `fly volumes create`.
[[mounts]]
  source = "ff14_kotei_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  NODE_ENV = "production"
  HEALTH_PORT = "8080"
  DATABASE_URL = "/data/ff14kotei.db"
  # GIT_SHA can be injected: `fly deploy --env GIT_SHA=$(git rev-parse --short HEAD)`
  # Cap V8 heap at 192MB so we leave ~64MB for native (better-sqlite3,
  # buffers, etc) on the 256MB machine. Pairs with the discord.js cache
  # diet in src/index.ts and SQLite pragmas in packages/db/src/client.ts.
  NODE_OPTIONS = "--max-old-space-size=192"

# Discord bot needs exactly 1 instance holding the gateway connection.
# Auto-start on crash, never auto-stop on idle.
#
# 256 MB is enough thanks to the three-layer memory diet (discord.js cache
# limits + V8 heap cap + SQLite pragmas). The mem-monitor in
# src/lib/mem-monitor.ts logs RSS every 5min and warns at 200MB so we
# get heads-up before OOM. Bump to "512mb" if HIGH warnings appear at scale
# (>200 active guilds is the empirical threshold).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Internal-only HTTP for Fly's health checks. Not exposed to the public internet.
[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"          # gateway login can take ~10s
    method = "GET"
    path = "/health"
    protocol = "http"
